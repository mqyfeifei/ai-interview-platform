version: 1
project: FuChuangTiKu
locale: zh-CN
domain: multi-domain-interview # 涵盖后端、前端、CV、网络、QA
maintainer: owner
updated_at: 2026-03-03

storage:
  format: yaml
  root: data
  question_path: data/questions
  examples_path: data/examples
  knowledge_points_path: data/knowledge_points

workflow:
  default_status: draft
  review_states:
    - draft
    - reviewed
    - archived

fields:
  question:
    - id
    - type
    - question
    - tags
    - difficulty
    - source
    - status
  example:
    - id
    - type
    - question
    - answer
    - framework
    - status
  knowledge_point:
    - module_name
    - point
    - complexity
    - estimated_hours
    - resources

# 可选：domain 到岗位的映射配置。
# 后端会优先使用该映射创建/匹配岗位，避免在代码中写死岗位信息。
job_mapping:
  backend:
    name: Java后端开发
    desc: Java基础、并发、JVM、框架及中间件等
  frontend:
    name: Web前端开发
    desc: JS核心、Vue/React架构、工程化等
  cv:
    name: 计算机视觉
    desc: 经典机器学习、CNN/Transformer架构、工程部署优化等
  network:
    name: 网络工程
    desc: TCP/IP协议栈、OSPF/BGP路由控制、SD-WAN等
  qa:
    name: 测试开发
    desc: 白盒/黑盒理论、UI/接口自动化、性能调优等