  - id: "FE-TQ-014"
    type: "technical"
    question: "微前端架构（如 qiankun 或 Module Federation）解决了什么问题？其核心沙箱机制是怎样的？"
    tags: ["架构", "微前端", "隔离机制"]
    difficulty: "hard"
    source: "RAG知识库重构" 
    key_points:
      - "解决巨石应用（Monolith）难以维护、技术栈固化及多团队协同开发部署的痛点"
      - "JS 沙箱主要通过 Proxy 拦截 window 对象读写实现全局变量隔离（如 ProxySandbox）"
      - "CSS 样式隔离通过 Scoped CSS、Shadow DOM 或动态添加/移除样式标签来防止样式污染"
  - id: "FE-TQ-015"
    type: "technical"
    question: "前端监控体系通常包含哪些维度？如何实现无侵入式的错误埋点与性能监控？"
    tags: ["前端监控", "埋点", "性能收集"]
    difficulty: "hard"
    source: "RAG知识库重构" 
    key_points:
      - "监控维度涵盖页面性能（Web Vitals）、运行时异常（JS 错误、Promise 拒绝）、接口监控及用户行为打点"
      - "利用 window.onerror、unhandledrejection 及拦截 XHR/Fetch 请求实现全局错误捕获"
      - "通过 PerformanceObserver API 实时监控 LCP、FID、CLS 等核心 Web 性能指标"
  - id: "FE-TQ-016"
    type: "technical"
    question: "浏览器强缓存与协商缓存的判断逻辑及优先级是怎样的？"
    tags: ["网络", "浏览器缓存", "HTTP"]
    difficulty: "medium"
    source: "RAG知识库重构" 
    key_points:
      - "优先检查强缓存（Cache-Control max-age 和 Expires），命中则直接返回 200 (from memory/disk cache)"
      - "强缓存失效时发起请求，服务器利用 ETag/If-None-Match 和 Last-Modified/If-Modified-Since 进行协商缓存校验"
      - "如果资源未变更，服务器返回 304 Not Modified 通知客户端继续使用本地缓存，否则返回 200 及新数据"
  - id: "FE-TQ-017"
    type: "technical"
    question: "React Hooks 中的“闭包陷阱”是如何产生的？应如何避免？"
    tags: ["React", "Hooks", "闭包"]
    difficulty: "medium"
    source: "RAG知识库重构" 
    key_points:
      - "因 useEffect 等 Hook 的依赖数组（deps）配置不完整，导致其内部回调函数捕获了旧的 state 或 props 快照"
      - "解决方案一是利用 ESLint 插件（eslint-plugin-react-hooks）严格补全依赖项"
      - "解决方案二是通过 useRef 缓存最新的变量值或函数句柄，打破依赖收集域实现最新值访问"
  - id: "FE-TQ-018"
    type: "technical"
    question: "简述 V8 引擎的垃圾回收（GC）机制，新生代与老生代分别采用了什么算法？"
    tags: ["JavaScript", "V8", "垃圾回收"]
    difficulty: "hard"
    source: "RAG知识库重构" 
    key_points:
      - "基于分代回收思想，将内存划分为新生代（存活时间短）与老生代（存活时间长或体积大）"
      - "新生代采用 Scavenge 算法（Cheney 复制），将内存分为 From/To 空间，通过对象的复制迁移进行清理，速度极快"
      - "老生代采用 Mark-Sweep（标记清除）释放空间，并结合 Mark-Compact（标记整理）解决内存碎片化问题"
  - id: "FE-TQ-019"
    type: "technical"
    question: "什么是 JWT (JSON Web Token)？如何在前、后端配合下实现 Token 的无感刷新？"
    tags: ["安全", "认证", "JWT"]
    difficulty: "medium"
    source: "RAG知识库重构" 
    key_points:
      - "JWT 是无状态且防篡改的紧凑型身份认证凭证，分为 Header、Payload 与 Signature 三部分"
      - "采用双 Token 策略：短效 Access Token 用于常规接口请求，长效 Refresh Token 用于更新 Access Token"
      - "在前端 Axios 响应拦截器中捕获 401 状态码，挂起并发请求，利用 Refresh Token 自动换取新 Token 后重试失败请求"
  - id: "FE-TQ-020"
    type: "technical"
    question: "前端路由的 Hash 模式和 History 模式的核心实现原理有何不同？"
    tags: ["前端路由", "SPA", "BOM API"]
    difficulty: "medium"
    source: "RAG知识库重构" 
    key_points:
      - "Hash 模式依靠 URL 的 `#` 片段变化（hashchange 事件）驱动视图更新，无需服务器配合，兼容性极佳"
      - "History 模式基于 HTML5 的 pushState 和 replaceState API 修改 URL，配合 popstate 事件监听历史记录切换"
      - "History 模式需要后端 Nginx 等服务器配置 Fallback 路由（如 try_files 指向 index.html），否则刷新会导致 404 错误"
  - id: "FE-TQ-021"
    type: "technical"
    question: "简述 HTTPS 的握手过程及 TLS 加密原理。"
    tags: ["网络", "HTTPS", "加密"]
    difficulty: "hard"
    source: "RAG知识库重构" 
    key_points:
      - "采用混合加密机制：握手阶段使用非对称加密交换会话密钥，通信阶段使用对称加密传输数据以保障性能"
      - "客户端验证服务器发送的数字证书链（CA证书）以防止中间人攻击，并提取服务器公钥"
      - "双方通过 Client Hello / Server Hello 交换随机数，结合预主密钥（Pre-Master Secret）生成最终的对称会话密钥"
  - id: "FE-TQ-022"
    type: "technical"
    question: "虚拟 DOM（Virtual DOM）的设计哲学是什么？它真的比直接操作真实 DOM 快吗？"
    tags: ["前端框架", "Virtual DOM", "性能"]
    difficulty: "medium"
    source: "RAG知识库重构" 
    key_points:
      - "用轻量级的 JS 对象描述真实 DOM 结构，隔离了繁重的浏览器原生 DOM API 调用"
      - "核心价值在于跨平台能力（如 React Native）和提供声明式的 UI 编程范式，而非单纯的性能绝对领先"
      - "在大量零散更新时，通过 Diff 算法批量计算并合并补丁（Patch），能有效减少重排/重绘，但在极简场景下不如直接操作 DOM 高效"
  - id: "FE-TQ-023"
    type: "technical"
    question: "事件委托（Event Delegation）的原理是什么？它有哪些优缺点？"
    tags: ["JavaScript", "DOM事件", "性能优化"]
    difficulty: "easy"
    source: "RAG知识库重构" 
    key_points:
      - "基于 DOM 事件流的冒泡机制（Bubbling），将子元素的事件监听器绑定到共同的父级祖先元素上"
      - "优势：大幅减少内存消耗与事件绑定开销，且能天然支持动态添加的新子元素，无需重新绑定"
      - "缺点：不适合不支持冒泡的事件（如 blur/focus），且嵌套过深、层级结构复杂的 DOM 在处理 event.target 判别时可能增加负担"
  - id: "FE-TQ-024"
    type: "technical"
    question: "在前端状态管理选型中，Redux、MobX 和 Zustand 各自的设计理念和适用场景是什么？"
    tags: ["状态管理", "React", "架构"]
    difficulty: "medium"
    source: "RAG知识库重构" 
    key_points:
      - "Redux 遵循单一数据源和不可变数据（Immutable），数据流清晰可追溯，适合大型复杂项目，但样板代码多"
      - "MobX 基于响应式原理（Observable），允许直接修改可变状态，心智负担低、性能粒度细，适合面向对象范式的项目"
      - "Zustand 极简且基于 Hooks 构建，避免了 Context 的额外渲染性能问题，API 轻量，是当下中小型项目的首选替代方案"
  - id: "FE-TQ-025"
    type: "technical"
    question: "什么是 PWA (Progressive Web App)？其核心技术 Service Worker 具备哪些能力？"
    tags: ["PWA", "Service Worker", "离线缓存"]
    difficulty: "medium"
    source: "RAG知识库重构" 
    key_points:
      - "PWA 旨在通过现代 Web 能力提供类原生 App 的体验（包含离线访问、桌面安装、后台通知等）"
      - "Service Worker 充当浏览器与网络的独立代理线程，可拦截请求（fetch）并调度 Cache Storage 实现离线资源缓存"
      - "它运行在主线程之外，不阻塞 UI，且必须在 HTTPS 环境下工作以确保安全性，支持后台同步与推送通知"
  - id: "FE-TQ-026"
    type: "technical"
    question: "WebAssembly (Wasm) 的出现解决了前端的什么痛点？主要适用哪些场景？"
    tags: ["WebAssembly", "底层技术", "性能"]
    difficulty: "hard"
    source: "RAG知识库重构" 
    key_points:
      - "打破了 JavaScript 作为浏览器唯一执行语言的性能瓶颈，提供接近原生的底层二进制执行效率"
      - "允许开发者使用 C++、Rust、Go 等静态语言编写代码并编译至浏览器运行，实现旧生态的平滑复用"
      - "典型应用场景涵盖：浏览器端音视频处理、复杂3D渲染（游戏引擎）、CAD 制图以及密集型数据计算等领域"
  - id: "FE-TQ-027"
    type: "technical"
    question: "CSS 预处理器（如 Sass/Less）与原生 CSS 变量（CSS Variables / Custom Properties）的核心差异在哪？"
    tags: ["CSS", "样式方案"]
    difficulty: "easy"
    source: "RAG知识库重构" 
    key_points:
      - "Sass/Less 的变量在编译构建时会被解析为静态值，无法在浏览器运行时动态修改"
      - "原生 CSS 变量存在于 DOM 树中（可被继承），可通过 JavaScript 运行时即时读取和修改（setProperty），是实现动态主题切换的最佳实践"
      - "预处理器目前更多用于提供 Mixin、嵌套规则和复杂工程化计算功能，而基础变量管理正逐步向原生能力迁移"
  - id: "FE-TQ-028"
    type: "technical"
    question: "简述 XSS（跨站脚本攻击）与 CSRF（跨站请求伪造）的原理及其主流防御手段。"
    tags: ["安全", "XSS", "CSRF"]
    difficulty: "medium"
    source: "RAG知识库重构" 
    key_points:
      - "XSS 是通过注入恶意脚本盗取信息。防御：转义用户输入（HTML 实体）、开启 CSP（内容安全策略）以及设置 Cookie 的 HttpOnly 属性。"
      - "CSRF 是利用用户已登录的凭证，诱导发起恶意请求。防御：采用 SameSite Cookie 策略、验证 Referer/Origin 头，以及使用单次有效的 Anti-CSRF Token。"
      - "两者根本区别：XSS 侧重于利用网站本身的信任漏洞执行代码；CSRF 侧重于利用浏览器的自动携带 Cookie 机制伪造身份操作。"
  - id: "FE-TQ-029"
    type: "technical"
    question: "TCP 的三次握手与四次挥手过程是怎样的？为什么挥手需要四次？"
    tags: ["网络", "TCP协议"]
    difficulty: "medium"
    source: "RAG知识库重构" 
    key_points:
      - "三次握手（SYN -> SYN-ACK -> ACK）确立双方收发能力的双向对等并同步序列号，防止失效的连接请求突然到达"
      - "四次挥手（FIN -> ACK ... FIN -> ACK）实现全双工连接的优雅关闭"
