  - id: "CV-PQ-ZJ-011"
    type: "project_deep_dive"
    question: "在你的项目中做CTR/CVR联合建模时，ESMM（或ESMM2）模型是如何推导并在工程上落地的？最终带来了怎样的线上收益？"
