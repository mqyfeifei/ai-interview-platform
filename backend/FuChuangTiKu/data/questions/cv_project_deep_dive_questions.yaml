      - "阐述环境反馈（Observation）如何回传给模型并维持多轮对话上下文。"

  - id: "CV-PQ-ZJ-010"
    type: "project_deep_dive"
    question: "在你的实际算法项目中，是否遇到过模型过拟合的问题？你是如何发现的？具体用了哪些手段解决？"
