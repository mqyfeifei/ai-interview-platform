items:
  - id: "BE-BQ-001"
    type: "behavioral"
    question: "讲一次你推动跨团队协作并最终落地的经历。"
    tags: ["协作", "沟通"]
    difficulty: "medium"
    source: "Interview_Bank" 
    key_points:
      - "沟通强调寻找双赢局面的共赢心智"
      - "主动承担串联职责与组织推进的领导力"
      - "遇卡点能快速升级并合理撬动周边资源"
  - id: "BE-BQ-002"
    type: "behavioral"
    question: "讲一次你在高压下处理线上故障的经历。"
    tags: ["抗压", "应急响应"]
    difficulty: "medium"
    source: "Interview_Bank" 
  - id: "BE-BQ-003"
    type: "behavioral"
    question: "讲一次你做技术决策被质疑，最后如何达成一致。"
    tags: ["技术决策", "影响力"]
    difficulty: "medium"
    source: "Interview_Bank" 
  - id: "BE-BQ-004"
    type: "behavioral"
    question: "讲一次你主导代码重构并显著改善质量的经历。"
    tags: ["代码质量", "重构"]
    difficulty: "medium"
    source: "Interview_Bank" 
  - id: "BE-BQ-005"
    type: "behavioral"
    question: "讲一次项目延期风险出现后，你如何纠偏并按期交付。"
    tags: ["项目管理", "风险控制"]
    difficulty: "medium"
    source: "Interview_Bank" 
  - id: "BE-BQ-006"
    type: "behavioral"
    question: "讲一次你在信息不完整情况下做判断的经历。"
    tags: ["不确定性", "决策"]
    difficulty: "hard"
    source: "Interview_Bank" 
  - id: "BE-BQ-007"
    type: "behavioral"
    question: "讲一次你帮助低绩效同事成长的经历。"
    tags: ["辅导", "团队建设"]
    difficulty: "medium"
    source: "Interview_Bank" 
  - id: "BE-BQ-008"
    type: "behavioral"
    question: "讲一次你在需求频繁变动中仍保持稳定交付的经历。"
    tags: ["需求管理", "交付"]
    difficulty: "medium"
    source: "Interview_Bank" 
  - id: "BE-BQ-009"
    type: "behavioral"
    question: "讲一次你主动承担非职责范围工作并产生价值的经历。"
    tags: ["主人翁精神", "责任心"]
    difficulty: "easy"
    source: "Interview_Bank" 
  - id: "BE-BQ-010"
    type: "behavioral"
    question: "讲一次失败经历，你如何复盘并避免再次发生。"
    tags: ["复盘", "成长"]
    difficulty: "easy"
    source: "Interview_Bank" 

  - id: "BE-BQ-AL-001"
    type: "behavioral"
    question: "在过去的项目或经历中，有什么让你感受到自豪的事情？"
    tags: ["自我认知", "成就动机", "沟通表达"]
    difficulty: "easy"
    source: "阿里巴巴"
    key_points:
      - "采用 STAR 法则清晰描述具体情境与面临的挑战"
      - "明确自身在其中发挥的关键作用及解决问题的核心思路"
      - "总结该事件带来的技术收获与业务价值"

  - id: "BE-BQ-AL-002"
    type: "behavioral"
    question: "需求做到一半发生变化时，你应该如何应对？"
    tags: ["项目管理", "沟通协作", "抗压能力"]
    difficulty: "medium"
    source: "阿里巴巴"
    key_points:
      - "理性评估需求变更的合理性及对当前架构、进度的影响程度"
      - "主动与产品经理及利益相关方沟通，重新明确优先级与排期"
      - "在技术实现上强调代码的扩展性，以包容未来的合理变更"

  - id: "BE-BQ-AL-003"
    type: "behavioral"
    question: "如果产品经理给了一个不太好的方案，你该怎么办？"
    tags: ["跨部门协作", "沟通技巧", "技术驱动"]
    difficulty: "medium"
    source: "阿里巴巴"
    key_points:
      - "先理解产品背后的真实业务痛点，而非直接否定方案"
      - "从技术可行性、系统性能、长期维护成本等角度给出客观数据或理由"
      - "主动提供一个能达成同样业务目标且技术更优的替代（折中）方案"

  - id: "BE-BQ-AL-004"
    type: "behavioral"
    question: "领导临时给你一个完成了一半的系统，后续工作全权交给你，你会怎么做？"
    tags: ["接手老旧项目", "工程能力", "风险管理"]
    difficulty: "hard"
    source: "阿里巴巴"
    key_points:
      - "第一步盘点资产：包括梳理业务流程、核心文档、系统架构及部署情况"
      - "第二步评估风险：跑通现有测试用例，排查隐藏 Bug、安全漏洞或未结技术债"
      - "第三步平稳过渡：制定分阶段接手计划，避免大幅重构导致业务停摆"

  - id: "BE-BQ-AL-005"
    type: "behavioral"
    question: "如果你自己去做一次 Code Review，你通常会重点注意哪些内容？"
    tags: ["代码质量", "工程规范", "团队协作"]
    difficulty: "medium"
    source: "阿里巴巴"
    key_points:
      - "规范性：命名规范、代码风格、有无硬编码、日志记录是否合理"
      - "健壮性：空指针处理、异常捕获机制、并发安全问题"
      - "性能与架构：循环内查库/RPC问题、慢 SQL 风险、设计模式是否被滥用"

  - id: "BE-TQ-AL-006"
    type: "technical"
    question: "请实现一个算法，将一个只包含 0 和 1 的单链表（代表一个二进制数）转换为对应的十进制整数。"
    tags: ["算法", "链表", "位运算"]
    difficulty: "medium"
    source: "阿里巴巴"
    key_points:
      - "通过遍历链表逐位累加计算结果"
      - "熟练使用位运算（如左移、或运算）以提高运算效率"
      - "在实际应用中需考虑到链表过长可能导致的大数溢出问题"

  - id: "BE-TQ-AL-007"
    type: "technical"
    question: "给定一个整数数组，请根据数字的二进制表示中 1 的数目进行升序排序。如果 1 的数目相同，则根据数字本身大小进行排序，该如何实现？"
    tags: ["算法", "排序", "位运算"]
    difficulty: "medium"
    source: "阿里巴巴"
    key_points:
      - "能够正确编写统计整数二进制中 1 数量的函数（如 Brian Kernighan 算法 `n & (n - 1)`）"
      - "掌握自定义排序比较规则的实现方式"
      - "评估并优化位运算操作的时间复杂度"

  - id: "BE-TQ-AL-008"
    type: "technical"
    question: "请设计并实现一个算法来计算单支股票价格的跨度。股票价格跨度定义为：从今天开始往回数，连续的、价格小于或等于今天价格的日数。"
    tags: ["算法", "栈", "单调栈"]
    difficulty: "medium"
    source: "阿里巴巴"
    key_points:
      - "识别出可以使用单调栈结构来优化寻找最近大于当前值元素的时间复杂度"
      - "避免使用暴力的 O(n^2) 遍历方案，实现 O(1) 的均摊时间复杂度"
      - "正确维护栈内元素的递减顺序并累加跨度值状态"

  - id: "BE-TQ-AL-009"
    type: "technical"
    question: "在进行链表相关操作时，什么情况下会推荐使用哨兵节点（dummy node）？使用它有什么具体好处？"
    tags: ["数据结构", "链表", "边界处理"]
    difficulty: "easy"
    source: "阿里巴巴"
    key_points:
      - "说明哨兵节点主要用于处理头节点可能被修改、删除或频繁变动的场景"
      - "解释它能够避免对真正的头节点进行特殊的判空和冗余的分支处理"
      - "哨兵节点能够极大简化代码逻辑，降低边界情况处理出错的概率"

  - id: "BE-TQ-AL-010"
    type: "technical"
    question: "给定一个无向图的节点和边集，以及一个起点和终点，请描述并编写算法判断该图中是否存在从起点到终点的有效路径。"
    tags: ["算法", "图", "BFS", "DFS", "并查集"]
    difficulty: "medium"
    source: "阿里巴巴"
    key_points:
      - "可使用广度优先搜索(BFS)或深度优先搜索(DFS)遍历图节点"
      - "能够结合并查集算法(Disjoint Set)在连通性问题上做出时间层面的优化"
      - "必须考虑到图中存在环路的情况，使用 visited 数组或集合防止死循环"

  - id: "BE-TQ-AL-011"
    type: "technical"
    question: "给定一个非负整数数组和一个起始位置，每次跳跃可以向左或向右移动当前元素值指定的步数。请判断是否能到达数组中值为 0 的元素位置？"
    tags: ["算法", "BFS", "DFS", "数组"]
    difficulty: "medium"
    source: "阿里巴巴"
    key_points:
      - "将问题抽象为图的遍历，使用 DFS 或 BFS 探索所有可能到达的下标"
      - "需要记录已访问过的下标路径，避免在两个相同值之间陷入无限循环跳跃"
      - "给出正确的边界越界判断，确保左右跳跃后的下标在数组有效范围内"

  - id: "BE-TQ-AL-012"
    type: "technical"
    question: "给定一个单链表，请找出一个数组，该数组记录了链表中每个节点的“下一个具有更大值的节点”。如果不存在更大值，则对应位置返回 0。"
    tags: ["算法", "链表", "单调栈"]
    difficulty: "medium"
    source: "阿里巴巴"
    key_points:
      - "由于单链表不可逆向遍历，可先将其转化为数组或结合递归处理"
      - "核心考点是使用单调递减栈来保存尚未找到最大值的节点信息"
      - "确保将问题处理在 O(N) 的时间复杂度与空间复杂度内"

  - id: "BE-TQ-AL-013"
    type: "technical"
    question: "请解释什么是汉明距离？并给出计算两个整数之间的汉明距离的最优算法实现。"
    tags: ["算法", "位运算", "基础知识"]
    difficulty: "easy"
    source: "阿里巴巴"
    key_points:
      - "准确解释汉明距离的概念：两个整数对应的二进制位不同的位置数目"
      - "对两个整数进行异或（XOR）操作，从而将问题转化为求异或结果中 1 的个数"
      - "使用位操作技巧（如 `n & (n - 1)`）快速统计 1 的个数"

  - id: "BE-TQ-AL-014"
    type: "technical"
    question: "在遍历单链表时，循环条件使用 `while (node != null)` 和 `while (node.next != null)` 有什么本质区别？分别适用于哪些经典场景？"
    tags: ["数据结构", "链表", "代码规范"]
    difficulty: "easy"
    source: "阿里巴巴"
    key_points:
      - "`node != null` 会遍历直到当前节点越过尾节点（变为null），适合求链表长度或进行全量遍历"
      - "`node.next != null` 会在尾节点处停下，适合需要操作或获取尾节点（如追加节点、删除倒数节点）的场景"
      - "需主动指出当链表初始为空 (`node == null`) 时，使用 `node.next != null` 会直接引发空指针异常（NPE）的风险"

  - id: "BE-TQ-AL-015"
    type: "technical"
    question: "给定一个不含重复元素的整数数组，请设计算法构建最大二叉树。规则是：根节点为数组最大值，左右子树分别为最大值左右部分的子数组递归构建的最大二叉树。"
    tags: ["算法", "二叉树", "分治法", "单调栈"]
    difficulty: "medium"
    source: "阿里巴巴"
    key_points:
      - "能提出基础的分治递归解法：每次遍历寻找当前区间最大值作为根节点"
      - "能够正确划分左右子树的数组边界并进行递归处理"
      - "能给出进阶优化方案：使用单调递减栈在线性 O(N) 时间内完成最大二叉树的构建"

  - id: "BE-BQ-TX-001"
    type: "behavioral"
    question: "请简单做一下自我介绍，重点介绍自己的技术栈、做过的核心项目及你在其中承担的职责。"
    tags: ["自我介绍", "软素质", "项目经验"]
    difficulty: "easy"
    source: "腾讯"
    key_points:
      - "结构清晰：基本信息 -> 核心技术栈 -> 重点项目及职责 -> 匹配该岗位的优势"
      - "时间控制在1-2分钟左右，突出与C++/后端岗位的契合度"
      - "陈述项目时能明确量化产出或解决的核心问题"

  - id: "BE-BQ-TX-002"
    type: "behavioral"
    question: "请讲一个你在实习或项目开发中遇到的最大技术难点，以及你是如何解决它的？"
    tags: ["问题解决能力", "软素质", "项目深挖"]
    difficulty: "medium"
    source: "腾讯"
    key_points:
      - "能够清晰描述问题的背景及引发的后果（STAR法则）"
      - "体现出严谨的排查思路（如：日志分析、性能监控、源码阅读）"
      - "最终的解决方案合理，且能总结出避免同类问题复发的经验"

  - id: "BE-BQ-TX-003"
    type: "behavioral"
    question: "请做一个简单的自我介绍，重点说明你的技术栈、做过的核心项目、承担的职责，以及与后端开发岗位相关的能力储备。"
    tags: ["自我介绍", "软素质", "项目总结"]
    difficulty: "easy"
    source: "腾讯"
    key_points:
      - "技术栈与岗位匹配度（如C++/Java/Go基础、数据库、中间件等）"
      - "项目经历的复杂度及个人承担的核心职责清晰度"
      - "表达流畅，重点突出，时长控制在合理范围（约1-2分钟）"

  - id: "BE-BQ-TX-004"
    type: "behavioral"
    question: "请讲一下你在之前的实习经历中主要负责了什么工作？取得了哪些具体成果或学到了哪些技术？"
    tags: ["实习经历", "软素质", "个人成长"]
    difficulty: "easy"
    source: "腾讯"
    key_points:
      - "能够清晰阐述实习期间的业务背景与核心任务"
      - "说明使用了哪些技术栈解决了什么实际工程问题"
      - "具有明确的产出指标或对团队的正向贡献"

  - id: "BE-BQ-TX-005"
    type: "behavioral"
    question: "在日常开发工作中，你是如何将AI工具（如Copilot、大模型等）应用于提高工作效率的？是否遇到过AI生成代码导致Bug的情况，你是如何解决的？"
    tags: ["AI辅助开发", "问题排查", "软素质"]
    difficulty: "medium"
    source: "腾讯"
    key_points:
      - "具备使用AI工具加速基础代码编写或辅助排错的意识与经验"
      - "强调AI仅作为辅助，对AI生成的代码有Code Review和单元测试的严谨态度"
      - "遇到Bug时能通过单步调试、日志分析等传统工程手段准确定位并修复"

  - id: "BE-BQ-TX-006"
    type: "behavioral"
    question: "平时除了工作和课业，你是如何了解和跟进前沿技术（如AI大模型的发展）的最新动向的？"
    tags: ["持续学习", "技术视野", "软素质"]
    difficulty: "medium"
    source: "腾讯"
    key_points:
      - "具备主动学习的习惯（如阅读官方文档、关注技术开源社区GitHub、阅读Tech_Blog等）"
      - "能说出几个具体的技术趋势或近期关注的技术点"
      - "有将新技术转化为个人实践（Demo或小工具）的经历加分"

  - id: "BE-BQ-TX-007"
    type: "behavioral"
    question: "请做一下自我介绍，并顺便介绍两个你的核心项目。"
    tags: ["自我介绍", "项目经验", "表达能力"]
    difficulty: "easy"
    source: "腾讯"
    key_points:
      - "表达清晰流畅，条理分明"
      - "能够简明扼要地突出核心项目的业务价值和个人贡献"
      - "技术栈和个人亮点总结到位"
  - id: "BE-BQ-TX-008"
    type: "behavioral"
    question: "在团队合作中，如果与同事的技术方案发生了冲突，你会如何沟通和解决？"
    tags: ["团队协作", "沟通能力", "冲突解决"]
    difficulty: "medium"
    source: "腾讯"
    key_points:
      - "保持客观，对事不对人，避免情绪化沟通"
      - "基于数据和业务场景进行对比分析（如性能、可维护性、工期评估）"
      - "向上汇报或寻求资深同事（Tech Lead）的评审与建议"
  - id: "BE-BQ-TX-009"
    type: "behavioral"
    question: "作为跨专业（或转码）的同学，你是如何规划自己的后端学习路径的？"
    tags: ["学习能力", "职业规划", "转码历程"]
    difficulty: "medium"
    source: "腾讯"
    key_points:
      - "具备清晰的学习路线（如基础语法 -> 数据结构与算法 -> 框架 -> 中间件 -> 项目实战）"
      - "展现出主观能动性和解决未知问题的能力"
      - "有明确的阶段性成果（如开源贡献、个人博客、上线的项目等）"
  - id: "BE-BQ-TX-010"
    type: "behavioral"
    question: "日常开发中，你是如何利用大模型或AI工具辅助工作的？遇到了AI写出bug的情况是如何排查的？"
    tags: ["AI工具", "效率提升", "问题排查"]
    difficulty: "medium"
    source: "腾讯"
    key_points:
      - "合理利用AI进行代码生成、单测编写或方案调研，提升开发效率"
      - "强调AI的辅助角色，具备Code Review意识，不盲目信任生成代码"
      - "遇到bug时，能够回归基础逻辑，利用打断点、日志等传统排查手段定位问题"
  - id: "BE-BQ-TX-011"
    type: "behavioral"
    question: "最近在学习什么后端的新技术或新方向？你是如何保持技术敏感度并了解最新技术发展动向的？"
    tags: ["技术前瞻", "持续学习", "技术视野"]
    difficulty: "medium"
    source: "腾讯"
    key_points:
      - "能够说出具体的新技术名称及应用场景（如云原生新组件、Agent开发、Rust等）"
      - "有固定的技术信息获取渠道（如GitHub趋势、技术社区、官方文档等）"
