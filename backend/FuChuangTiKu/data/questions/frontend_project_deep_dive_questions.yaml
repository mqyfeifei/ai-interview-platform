items:
  - id: "FE-PQ-001"
    type: "project_deep_dive"
    question: "这个前端项目的整体架构是如何设计的？你在其中承担了什么角色？"
    tags: ["项目架构", "职责"]
    difficulty: "easy"
    source: "Interview_Bank" 
    key_points:
      - "全面透析工程宏大选型及项目组织建构脉络与层次分隔艺术(基础组件/网络层/核心逻辑等)"
      - "突出自己在浩大多人协同场内发散的核心向导或者破局者的独立高亮角色感"

  - id: "FE-PQ-002"
    type: "project_deep_dive"
    question: "项目中的状态管理（如 Redux/Pinia）是如何划分的？遇到过什么痛点？"
    tags: ["状态管理", "架构"]
    difficulty: "medium"
    source: "Interview_Bank" 
    key_points:
      - "严苛区分局部私需与全域通告状态流不乱搅和泥巴"
      - "利用强力状态管理中枢化解超深渊多层无用传导以及异族组件孤岛联动痛击"
      - "吐诉并拆解过多黑盒嵌套模板毒瘤的恶心及其抽象钩子化轻量封装救赎路线"

  - id: "FE-PQ-003"
    type: "project_deep_dive"
    question: "你们项目中针对首屏或者长列表等特定场景做过哪些性能优化？效果如何？"
    tags: ["性能优化", "真实数据"]
    difficulty: "hard"
    source: "Interview_Bank" 
    key_points:
      - "抛弃空口套白狼必亮量化利器打底表成绩(如FP/LCP由某到某)"
      - "重型列表必交的虚拟长卷滚动按需绘制渲染减少万节点负担的标准答卷"
      - "精通使用Lighthouse等探查监控雷达寻热热点卡顿源或图体优化的实际工程手腕"

  - id: "FE-PQ-004"
    type: "project_deep_dive"
    question: "前后端接口联调时遇到过哪些沟通或数据格式上的问题，是如何解决的？"
    tags: ["联调", "协作"]
    difficulty: "medium"
    source: "Interview_Bank" 
    key_points:
      - "展示因格式断代/超长字段撕裂崩坏等高频现实惨剧的处理嗅觉"
      - "主打前浪基建破局法（引出Swagger协议契约/ApiFox等打通屏障阻滞）"
      - "运用Mock隔离护城河构建并行加速不受后端落后步调干涉之自主强效把控节奏"

  - id: "FE-PQ-005"
    type: "project_deep_dive"
    question: "项目中是否有自研或二次封装的组件库？讲讲你封装的最复杂的组件。"
    tags: ["组件封装", "复用性"]
    difficulty: "medium"
    source: "Interview_Bank" 
    key_points:
      - "打出复用生态体系、低耦合高包容且健造参数多端下放的标准工业级思维王牌"
      - "深虑配置入参、事件分层反射、插槽包容化的高级抽象形态结构规划"
      - "外拓边界兜底完善防雷以及全量组件维护体系与测试规约建构闭环沉淀展现"

  - id: "FE-PQ-006"
    type: "project_deep_dive"
    question: "你在项目中是如何进行版本控制和发布的？遇到过哪些挑战？"
    tags: ["版本控制", "发布流程"]
    difficulty: "medium"
    source: "Interview_Bank" 
    key_points:
      - "讲述分支管理策略（如Git Flow）或 trunk-based development 的实践经验"
      - "描述CI/CD流程（如使用Jenkins/GitHub Actions自动化测试和部署）的设计与实施"
      - "分享遇到的挑战（如合并冲突、回滚策略）以及解决方案的具体案例"

  - id: "FE-PQ-007"
    type: "project_deep_dive"
    question: "在项目中你是如何进行代码质量控制的？是否有引入静态分析工具或代码审查流程？"
    tags: ["代码质量", "静态分析"]
    difficulty: "medium"
    source: "Interview_Bank" 
    key_points:
      - "介绍使用的静态分析工具（如ESLint、Prettier）以及配置规范"
      - "描述代码审查流程（如Pull Request流程、Code Review标准）的实施细节"
      - "分享通过这些措施提升代码质量的实际效果和团队反馈"

  - id: "FE-PQ-008"
    type: "project_deep_dive"
    question: "你在项目中是否有过与后端或设计师等其他角色的跨部门协作经历？请举例说明一次成功的协作经历。"
    tags: ["跨部门协作", "沟通"]
    difficulty: "medium"
    source: "Interview_Bank" 
    key_points:
      - "描述与后端或设计师的具体协作场景（如接口设计、UI/UX讨论）"
      - "强调沟通技巧（如同理心、数据驱动的决策）在协作中的重要作用"
      - "分享协作成功的结果（如项目按时交付、用户体验提升）以及从中学到的经验教训"

  - id: "FE-PQ-009"
    type: "project_deep_dive"
    question: "你在项目中有没有遇到过“技术债务”？你是如何识别和管理它的？"
    tags: ["技术债务", "项目管理"]
    difficulty: "hard"
    source: "Interview_Bank" 
    key_points:
      - "识别技术债务的能力：如代码质量下降、模块耦合度增加、缺乏文档等"
      - "展现主动沟通和说服能力，向团队和管理层说明技术债务的风险和长期成本"
      - "制定清晰的偿还计划，如定期重构、引入自动化测试覆盖、优化数据管道等措施逐步消除技术债务"

  - id: "FE-PQ-010"
    type: "project_deep_dive"
    question: "你在项目中有没有遇到过“技术孤岛”？你是如何打破它的？"
    tags: ["技术孤岛", "跨部门协作"]
    difficulty: "hard"
    source: "Interview_Bank" 
    key_points:
      - "识别技术孤岛的能力：如某个模块或功能只有特定人员理解和维护，缺乏文档和知识共享"
      - "展现主动沟通和协作能力，推动团队内部的知识分享和交叉培训"
      - "引入代码审查、文档规范和定期技术分享会等机制促进团队整体技术水平的提升和信息流通"

  - id: "FE-PQ-011"
    type: "project_deep_dive"
    question: "在项目中遇到过最棘手的线上Bug是什么？你是如何进行排查和修复的？"
    tags: ["线上故障", "问题排查", "稳定性"]
    difficulty: "hard"
    source: "Interview_Bank" 
    key_points:
      - "清晰阐述排查链路：如利用 Sentry 分析报错堆栈、SourceMap 反解析、查阅用户行为轨迹日志等"
      - "分享具体的破局思路：针对内存泄漏检测、复杂竞态条件复现或第三方库底层的调试过程"
      - "总结复盘经验并落地预防机制：如补充边界单元测试、增加异常监控告警、优化错误兜底UI"

  - id: "FE-PQ-012"
    type: "project_deep_dive"
    question: "项目中有涉及到哪些前端安全方面的处理？你是如何防范常见的安全漏洞的？"
    tags: ["前端安全", "XSS", "CSRF"]
    difficulty: "medium"
    source: "Interview_Bank" 
    key_points:
      - "明确常见攻击面的防范手段：如防御 XSS 的转义机制、防 CSRF 的 Token 校验与 SameSite Cookie 策略"
      - "结合实际业务场景讲述安全改造：如敏感数据的前端加密传输逻辑、防止越权访问的路由守卫拦截"
      - "体现对安全红线的把控能力：分享自动化安全扫描工具的接入经历或参与安全审计的落地经验"

  - id: "FE-PQ-013"
    type: "project_deep_dive"
    question: "是否有过参与老旧巨石应用改造或重构的经历？在平滑迁移过程中踩过哪些坑？"
    tags: ["系统重构", "微前端", "技术演进"]
    difficulty: "hard"
    source: "Interview_Bank" 
    key_points:
      - "描述重构的背景与选型考量：如引入 qiankun / wujie 等微前端框架进行增量解耦升级"
      - "详述核心痛点及其解决方案：包括全局状态跨应用共享、路由劫持冲突、样式隔离与沙箱穿透问题"
      - "展示平滑过渡方案：灰度发布策略与新老系统并存期间的维稳手段，确保业务零中断"

  - id: "FE-PQ-014"
    type: "project_deep_dive"
    question: "你在项目中做过哪些提升团队研发效能的基建工作（如CLI工具、脚手架、构建提速）？"
    tags: ["工程化", "研发效能", "构建优化"]
    difficulty: "hard"
    source: "Interview_Bank" 
    key_points:
      - "切中团队研发痛点：如本地编译过慢、模板样板代码复制繁琐、规范对齐成本高"
      - "展示具体技术手段：如 Webpack 迁移 Vite 的改造实战、编写定制化 Vite 插件、开发 CLI 自动化生成代码基架"
      - "提供量化的工程收益：如构建时间缩短百分比、通过自动化收敛规范从而降低 Review 沟通成本"

  - id: "FE-PQ-015"
    type: "project_deep_dive"
    question: "你们项目是如何进行用户行为埋点和性能监控的？这套机制如何赋能实际业务？"
    tags: ["前端监控", "数据埋点", "业务赋能"]
    difficulty: "hard"
    source: "Interview_Bank" 
    key_points:
      - "阐述监控系统全貌：覆盖全局 JavaScript 错误上报、白屏检测、核心性能指标（Web Vitals）采集"
      - "解决代码侵入性高的痛点：分享采用无痕埋点、基于路由拦截或装饰器模式抽象埋点逻辑的设计方案"
      - "体现数据驱动业务思维：如何通过漏斗数据分析优化转化率，或根据错误大盘趋势指导后续的版本迭代优化"

  - id: "FE-PQ-AL-001"
    type: "project_deep_dive"
    question: "请详细介绍一下你简历中最满意的项目，你在其中承担了什么角色？遇到了哪些技术难点以及是如何解决的？"
    tags:
      - "项目经验"
      - "架构设计"
      - "难点解决"
    difficulty: "medium"
    source: "阿里巴巴"
    key_points:
      - "清晰阐述项目背景、核心业务逻辑与个人的具体贡献"
      - "详细说明遇到的关键技术难点（如性能优化、复杂逻辑处理等）及排查过程"
      - "总结解决方案的最终效果（如指标提升）以及个人的技术沉淀与反思"

