      - "阐述断点重连机制：利用Last-Event-ID进行消息补偿或自定义重连逻辑"

  - id: "FE-PD-TX-002"
    type: "project_deep_dive"
    question: "你提到了互斥锁，能详细聊聊你前端/Node项目里是如何使用互斥锁的吗？"
    tags: ["并发控制", "互斥锁", "多线程"]
    difficulty: "medium"
    source: "腾讯"
    key_points:
      - "阐明引入锁的具体业务场景（如高并发请求去重、资源竞争写入等）"
