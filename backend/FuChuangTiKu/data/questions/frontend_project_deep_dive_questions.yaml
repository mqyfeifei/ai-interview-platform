  - id: "FE-PD-TX-001"
    type: "project_deep_dive"
    question: "你在项目中使用了SSE（Server-Sent Events），请说说它是如何实现的？如何处理断点重连问题？"
    tags: ["SSE", "网络协议", "断点重连", "项目实战"]
