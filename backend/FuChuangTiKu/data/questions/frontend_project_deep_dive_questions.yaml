      - "结合自身项目特点分析选用或不选用某类算法的权衡（如计算资源、稳定性、实现成本）"

  - id: "FE-PQ-AL-005"
    type: "project_deep_dive"
    question: "请分享一个你在项目开发中遇到的最复杂的业务场景或技术难题，以及你是如何设计方案并最终解决的？"
