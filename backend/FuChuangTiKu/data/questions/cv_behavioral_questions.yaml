type: "cv_behavioral_questions"
source:
  - "Interview_Bank"
  - "Personal_Notes"
  - "字节跳动"
  - "旷视科技"
  - "商汤科技"
items:
  - id: "CV-BQ-001"
    type: "behavioral"
    question: "在复现某篇前沿CV论文时，如果你发现无论如何调参都达不到论文声称的精度，你会怎么处理？"
    tags: ["抗压", "问题解决"]
    difficulty: "medium"
    source: "Interview_Bank" 
    key_points:
      - "展现严谨的排查逻辑：核对数据集处理细节、损失函数实现及超参数设置"
      - "主动寻求突破：查看作者开源的Issue，或者发邮件向作者请教"
      - "妥协与产出：评估业务时间线，若无法复现则基于现有最优结果尝试引入业务Trick，不钻牛角尖"
  - id: "CV-BQ-002"
    type: "behavioral"
    question: "当产品经理要求模型精度达到99%，但受限于当前算力和数据质量，你认为最多只能做到95%时，你如何与PM沟通？"
    tags: ["跨部门沟通", "期望管理"]
    difficulty: "medium"
    source: "Interview_Bank" 
    key_points:
      - "避免纯技术视角的对抗，理解业务指标设定背后的商业逻辑"
      - "提供量化数据支撑：展示当前数据分布的bad case，说明数据标注瓶颈或模型天花板"
      - "提出折中或替代方案：例如在阈值策略上做权衡（保高召回或高准确），或引入人工兜底机制"
  - id: "CV-BQ-003"
    type: "behavioral"
    question: "讲一次你与数据标注团队在标注标准上产生严重分歧，最后如何解决的经历。"
    tags: ["团队协作", "数据管理"]
    difficulty: "medium"
    source: "Personal_Notes" 
    key_points:
      - "强调数据一致性对CV模型的重要性，不推诿责任"
      - "展现出制定清晰、量化的标注Rule（SOP）和Bad Case图谱的能力"
      - "引入预标注模型或交叉验证机制降低人工争议的闭环思维"
  - id: "CV-BQ-004"
    type: "behavioral"
    question: "当你在研究一个前沿CV算法但迟迟无法达到落地要求的FPS（帧率）时，你如何做取舍？"
    tags: ["工程落地", "权衡"]
    difficulty: "medium"
    source: "Personal_Notes" 
    key_points:
      - "展现学术研究与工业落地的思维转换（精度 vs 速度的权衡）"
      - "主动降级方案：如采用轻量级主干网络（MobileNet/ShuffleNet）或进行知识蒸馏"
      - "结合硬件侧优化（TensorRT/量化）寻找工程突破口的务实态度"
  - id: "CV-BQ-005"
    type: "behavioral"
    question: "讲一次模型在线上遇到“数据漂移”（Concept Drift）导致性能急剧下降，你的应急与修复过程。"
    tags: ["线上问题", "模型监控"]
    difficulty: "hard"
    source: "Personal_Notes" 
    key_points:
      - "建立线上输入分布监控与置信度异常告警机制的敏锐度"
      - "快速回滚或启用规则兜底止损的应急处理"
      - "建立影子模式（Shadow Mode）和数据飞轮，实现长尾数据的自动收集与模型迭代重训"
  - id: "CV-BQ-006"
    type: "behavioral"
    question: "你在CV项目中遇到过最棘手的团队冲突是什么？你是如何调解的？"
    tags: ["团队管理", "冲突调解"]
    difficulty: "hard"
    source: "Personal_Notes" 
    key_points:
      - "以身作则保持冷静，倾听双方诉求，避免情绪化对抗"
      - "引导回归问题本质，聚焦于数据和模型的客观事实而非个人观点"
      - "寻求双赢的解决方案，如引入第三方专家评审或制定新的实验验证方案打破僵局"
  - id: "CV-BQ-007"
    type: "behavioral"
    question: "你如何看待CV领域的伦理问题，比如隐私泄露、算法偏见等？你在项目中是如何应对这些挑战的？"
    tags: ["伦理", "社会责任"]
    difficulty: "hard"
    source: "Personal_Notes" 
    key_points:
      - "展现对CV技术潜在负面影响的敏感度和责任感"
      - "强调数据隐私保护措施（如数据脱敏、差分隐私）和算法公平性评估（如偏见检测工具Fairness Indicators）"
      - "主动推动团队建立伦理审查机制，确保技术发展与社会价值观的协调统一"
  - id: "CV-BQ-008"
    type: "behavioral"
    question: "你在CV项目中有没有遇到过“技术债务”？你是如何识别和管理它的？"
    tags: ["技术债务", "项目管理"]
    difficulty: "hard"
    source: "Personal_Notes" 
    key_points:
      - "识别技术债务的能力：如代码质量下降、模型复杂度过高、缺乏文档等"
      - "展现主动沟通和说服能力，向团队和管理层说明技术债务的风险和长期成本"
      - "制定清晰的偿还计划，如定期重构、引入自动化测试覆盖、优化数据管道等措施逐步消除技术债务"
  - id: "CV-BQ-009"
    type: "behavioral"
    question: "你在CV项目中有没有遇到过“技术孤岛”？你是如何打破它的？"
    tags: ["技术孤岛", "跨部门协作"]
    difficulty: "hard"
    source: "Personal_Notes" 
    key_points:
      - "识别技术孤岛的能力：如某个模块或算法只有特定人员理解和维护，缺乏文档和知识共享"
      - "展现主动沟通和协作能力，推动团队内部的知识分享和交叉培训"
      - "引入代码审查、文档规范和定期技术分享会等机制促进团队整体技术水平的提升和信息流通"
  - id: "CV-BQ-010"
    type: "behavioral"
    question: "你在CV项目中有没有遇到过“技术迷茫期”？你是如何走出它的？"
    tags: ["技术迷茫", "自我驱动"]
    difficulty: "hard"
    source: "Personal_Notes" 
    key_points:
      - "识别技术迷茫的能力：如对前沿算法缺乏清晰理解，或者面对复杂问题无从下手"
      - "展现自我驱动和学习能力，主动寻找资源（如论文、开源代码、社区讨论）来提升自己的技术水平"
      - "寻求导师或同事的指导，或者通过参与相关项目积累实战经验来逐步走出迷茫期"

  - id: "CV-BQ-ZJ-001"
    type: "behavioral"
    question: "请详细介绍一下你之前的实习经历，在这些经历中你分别主要做了哪些工作，以及承担了什么具体的角色？"
    tags: ["实习经历", "过往经验", "软素质"]
    difficulty: "easy"
    source: "字节跳动"
    key_points:
      - "清晰阐述实习期间的具体技术职责与项目产出"
      - "能体现出个人的主动思考、团队协作以及解决实际问题的能力"
      - "表达流畅，逻辑层次清晰，对自己的业务贡献有客观准确的评估"

  - id: "CV-BQ-ZJ-002"
    type: "behavioral"
    question: "目前的期望薪资是多少？手里还有其他的offer吗（比如华为给的薪资待遇如何）？"
    tags: ["意愿考察", "Offer对比", "薪资期望"]
    difficulty: "medium"
    source: "字节跳动"
    key_points:
      - "合理评估自身价值，给出符合市场行情的薪资区间"
      - "坦诚目前的Offer情况，但不泄露过多的保密细节"
      - "展现出对当前面试公司的强烈意向，说明选择该公司的核心原因（非纯薪资驱动）"

  - id: "CV-BQ-ZJ-003"
    type: "behavioral"
    question: "请谈谈你在研究生期间遇到过压力比较大的一件事，你是如何应对的？"
    tags: ["抗压能力", "问题解决", "自我调节"]
    difficulty: "medium"
    source: "通用"
    key_points:
      - "采用STAR法则描述具体的压力场景（如科研瓶颈、项目延期等）"
      - "重点阐述应对压力的具体行动，包括心态调整和寻求资源"
      - "总结从该事件中获得的成长与反思"

  - id: "CV-BQ-ZJ-004"
    type: "behavioral"
    question: "你的抗压能力强吗？你是如何看待996工作制的？能接受晚上11点正常下班的节奏吗？"
    tags: ["加班意愿", "抗压能力", "职场价值观"]
    difficulty: "hard"
    source: "字节跳动"
    key_points:
      - "表达对业务高峰期或紧急项目加班的理解与配合意愿"
      - "强调个人更注重在工作时间内提升效率，产出高质量结果"
      - "展示良好的精力管理与抗压能力方法"

  - id: "CV-BQ-ZJ-005"
    type: "behavioral"
    question: "你的项目经历中涉及语音、嵌入式方向的居多，为什么现在会想到转做NLP/CV方向？"
    tags: ["职业规划", "求职动机", "方向转型"]
    difficulty: "medium"
    source: "字节跳动"
    key_points:
      - "阐述对目标领域（CV/NLP）的强烈兴趣及行业前景的看好"
      - "说明过去经历与现在目标方向之间的迁移能力（如底层逻辑、工程能力）"
      - "展示为转型已经做出的具体努力和学习成果"

  - id: "CV-BQ-ZJ-006"
    type: "behavioral"
    question: "在当前AI时代，你认为后端开发工程师还有必要无脑转Agent/大模型方向吗？"
    tags: ["行业认知", "职业规划", "AI洞察"]
    difficulty: "hard"
    source: "字节跳动"
    key_points:
      - "客观分析后端与AI方向的核心壁垒与岗位供需关系"
      - "强调AI是赋能工具，后端工程能力（高并发、稳定性）依然是基石"
      - "提出‘后端+AI’的复合型人才路线比盲目转算法更具性价比"

  - id: "CV-BQ-ZJ-007"
    type: "behavioral"
    question: "请进行一下简单的自我介绍，并挑选一个你的核心项目进行详细说明。"
    tags: ["自我介绍", "项目陈述", "沟通表达"]
    difficulty: "easy"
    source: "字节跳动"
    key_points:
      - "逻辑清晰地梳理个人教育背景、实习经历和技术栈。"
      - "采用STAR法则（情境、任务、行动、结果）清晰描述核心项目。"
      - "突出个人在项目中的核心贡献与业务难点攻克。"

  - id: "CV-BQ-ZJ-008"
    type: "behavioral"
    question: "请总结一下你在实习期间主要完成了哪些核心工作？带来了哪些业务价值？"
    tags: ["实习经历", "价值驱动", "总结复盘"]
    difficulty: "medium"
    source: "字节跳动"
    key_points:
      - "能够量化地描述实习期间的产出（如性能提升百分比、模型精度提升等）。"
      - "体现出对所在部门业务链路的全局理解，而不仅仅是执行代码。"
      - "具备良好的工作复盘和沉淀能力。"

  - id: "CV-BQ-ZJ-009"
    type: "behavioral"
    question: "请问你目前对工作地点（Base地）有什么要求或偏好？"
    tags: ["求职意愿", "稳定性", "期望对齐"]
    difficulty: "easy"
    source: "字节跳动"
    key_points:
      - "诚实表达对城市的偏好及背后的原因（如定居意愿、家庭因素等）。"
      - "展现出一定的灵活性和对目标公司/岗位的向往。"

  - id: "CV-BQ-ZJ-010"
    type: "behavioral"
    question: "我看你的项目经历中语音、嵌入式方向的内容居多，为什么会想到来应聘CV/NLP算法方向的岗位？"
    tags: ["跨方向求职", "职业规划", "技术热情"]
    difficulty: "medium"
    source: "字节跳动"
    key_points:
      - "给出合理的职业规划和技术兴趣转移的动机。"
      - "强调过往经验（如信号处理、C++底座等）对目前投递岗位的正向迁移作用。"
      - "展示已经在CV/NLP方向做出的自主学习和积累（如相关竞赛、复现论文）。"

  - id: "CV-BQ-ZJ-011"
    type: "behavioral"
    question: "今天的面试就到这里，关于我们部门的业务方向或者实习生培养机制，你有什么想问我的吗？"
    tags: ["反问环节", "团队契合度", "求知欲"]
    difficulty: "easy"
    source: "字节跳动"
    key_points:
      - "提问内容需体现对该岗位和团队业务的关注与热情。"
      - "可以询问技术栈、新员工培养路径、核心业务难点等专业向问题。"

  - id: "CV-BQ-KS-001"
    type: "behavioral"
    question: "请先做一个简短的自我介绍。"
    tags: ["沟通表达", "个人经历"]
    difficulty: "easy"
    source: "旷视科技"
    key_points:
      - "语言表达流畅清晰，逻辑层次分明"
      - "突出自己的核心竞争力（论文发表、实习经历、竞赛名次等）"
      - "自我介绍内容与应聘岗位（CV算法）高度相关"

  - id: "CV-BQ-KS-002"
    type: "behavioral"
    question: "你的期望薪资是多少？目前手头有其他的 offer 吗？（如其他大厂给出了怎样的薪资水平？）"
    tags: ["薪资期望", "求职意向", "个人情况"]
    difficulty: "medium"
    source: "旷视科技"
    key_points:
      - "能合理表达自己的薪资预期及依据"
      - "真诚且有策略地同步竞品公司的 offer 进展"
      - "能体现出对本公司的核心意愿"

  - id: "CV-BQ-KS-003"
    type: "behavioral"
    question: "请分享一件你在研究生（或大学）期间遇到过压力比较大的事情，以及你是如何克服和应对的？"
    tags: ["抗压能力", "问题解决", "个人经历"]
    difficulty: "medium"
    source: "旷视科技"
    key_points:
      - "举例真实具体，最好与科研、学习或项目交付相关"
      - "展现出积极乐观的态度和逻辑清晰的排压/问题解决能力"
      - "事后能提炼出对个人的复盘与成长收获"

  - id: "CV-BQ-KS-004"
    type: "behavioral"
    question: "你平时生活中觉得最有成果的事情是什么？你的家庭情况如何，未来的职业规划是怎样的？"
    tags: ["职业规划", "个人情况", "成就感"]
    difficulty: "medium"
    source: "旷视科技"
    key_points:
      - "最有成果的事能够反映出个人的驱动力和价值观"
      - "职业规划清晰务实，与公司岗位发展路径有一定的契合度"
      - "展现出较高的稳定性和求职意愿"

  - id: "CV-BQ-KS-005"
    type: "behavioral"
    question: "你的抗压能力强吗？如何看待互联网行业的 996 工作节奏？能否接受有时晚上11点下班？"
    tags: ["抗压能力", "工作节奏", "价值观"]
    difficulty: "medium"
    source: "旷视科技"
    key_points:
      - "表达出较强的责任心和对业务目标的驱动"
      - "在合理范围内表达对加班的理解（为了攻坚或紧急发布可以接受，但看重效率）"
      - "情绪稳定，不抵触也不盲从"

  - id: "CV-BQ-KS-006"
    type: "behavioral"
    question: "你为什么会选择 CV（计算机视觉）作为研究/职业方向？你比较期待怎样的工作氛围？"
    tags: ["行业认知", "求职动机", "团队文化"]
    difficulty: "easy"
    source: "旷视科技"
    key_points:
      - "有自己对行业前景的独立思考和技术热情"
      - "期待的工作氛围积极向上，侧重技术交流和团队协作"
      - "没有表现出强烈的个人主义或与大厂文化冲突的观点"

  - id: "CV-BQ-KS-007"
    type: "behavioral"
    question: "今天的面试差不多到这里了，结合刚刚了解到的情况，你有什么想要向我了解或提问的吗？"
    tags: ["沟通表达", "反向提问", "求职意向"]
    difficulty: "easy"
    source: "旷视科技"
    key_points:
      - "能够问出有质量的问题，例如团队的技术栈、核心业务、新员工培养体系等"
      - "避免询问过于基础或可以在网上直接搜到的信息"
      - "展现出对加入团队的浓厚兴趣"

  - id: "CV-BQ-KS-008"
    type: "behavioral"
    question: "你的期望薪资是多少？目前手上有其他公司的offer吗？分别给到了多少薪资？"
    tags: ["期望薪资", "Offer情况", "个人意愿"]
    difficulty: "medium"
    source: "旷视科技"
    key_points:
      - "合理表达自己的薪资期望区间"
      - "诚实回答手上其他的Offer情况，作为议价参考"
      - "表达对当前公司岗位的强烈意愿及倾向性"

  - id: "CV-BQ-KS-009"
    type: "behavioral"
    question: "请分享一件你研究生期间遇到过的压力比较大的事情，以及你是如何克服的？"
    tags: ["抗压能力", "情绪管理", "问题解决"]
    difficulty: "medium"
    source: "旷视科技"
    key_points:
      - "使用STAR法则描述压力事件的背景及挑战"
      - "重点阐述化解压力的具体行动（例如时间管理、寻求导师/同学帮助、拆解任务等）"
      - "总结经验反思及取得的积极结果"

  - id: "CV-BQ-KS-010"
    type: "behavioral"
    question: "你的抗压能力如何？怎么看待996工作制？能否接受经常晚上11点正常下班？"
    tags: ["抗压能力", "加班意愿", "工作态度"]
    difficulty: "medium"
    source: "旷视科技"
    key_points:
      - "展现积极的抗压能力，给出实际案例证明"
      - "客观评估自己的工作节奏，强调以结果和效率为导向，但也接受因项目紧急而需要的加班"
      - "在表达接受度的同时关注个人健康与成长的平衡"

  - id: "CV-BQ-KS-011"
    type: "behavioral"
    question: "面试反问环节：关于公司或团队，你有什么想要了解和提问的吗？"
    tags: ["反问环节", "求职意向", "双向评估"]
    difficulty: "medium"
    source: "旷视科技"
    key_points:
      - "提出与业务部门强相关的问题（例如团队正在攻克的核心技术难题、CV算法落地场景等）"
