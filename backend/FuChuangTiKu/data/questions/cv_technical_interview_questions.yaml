      - "共享内存最快原因：直接将同一块物理内存映射到多个进程的虚拟地址空间，避免了内核态与用户态之间的数据拷贝。"
      - "附带说明：使用共享内存时必须配合信号量或互斥锁来控制同步与并发读写。"

  - id: "CV-TQ-ZJ-031"
    type: "technical"
    question: "在Transformer模型中，绝对位置编码、相对位置编码和RoPE（旋转位置编码）各自的设计思路、优势与局限是什么？"
    tags: ["Transformer", "大语言模型", "位置编码"]
    difficulty: "hard"
    source: "字节跳动"
    key_points:
      - "绝对PE：直接将位置信息加到输入上（如正弦波或可学习参数），缺点是对外推性（长文本）支持极差。"
      - "相对PE：在Attention计算时加入相对距离偏置，提升了平移不变性，但推理时不易利用KV Cache。"
      - "RoPE：通过复数旋转矩阵在绝对位置的基础上实现相对位置的注入，兼顾两者的优点，且外推性强，是当前大模型标配。"

  - id: "CV-TQ-ZJ-032"
    type: "technical"
    question: "请详细讲解Batch Normalization (BN) 的原理。它在训练期和推理期使用的统计量有何不同？与LN（LayerNorm）、GN相比各自的适用场景是什么？"
    tags: ["深度学习基础", "模型优化", "归一化"]
    difficulty: "medium"
    source: "字节跳动"
    key_points:
      - "原理：在Batch维度上对特征进行归一化，缓解内部协变量偏移，加速收敛并提供一定正则化。"
      - "阶段差异：训练期使用当前Mini-batch的均值和方差；推理期使用训练时维护的全局滑动平均统计量（EMA）。"
      - "对比：BN强依赖Batch Size，适用于CV；LN作用于单个样本的Feature维度，不依赖Batch，适用于NLP/Transformer；GN将通道分组归一化，适用于小Batch Size下的CV任务（如目标检测）。"

  - id: "CV-TQ-ZJ-033"
    type: "technical"
    question: "监督微调（SFT）和对齐算法（如RLHF、DPO等）在原理上有什么核心差异？"
    tags: ["大模型微调", "RLHF", "DPO"]
    difficulty: "hard"
    source: "字节跳动"
    key_points:
      - "SFT：基于极大似然估计（MLE）的自回归目标，让模型模仿人类的Demonstration数据，容易产生模型幻觉或陷入分布偏差。"
      - "对齐算法：旨在引入人类偏好奖励（Preferences），优化非可导目标。RLHF通过奖励模型和PPO算法进行强化学习；DPO则直接通过对比损失在偏好对数据上优化，省去了显式的奖励模型拟合。"

  - id: "CV-TQ-ZJ-034"
