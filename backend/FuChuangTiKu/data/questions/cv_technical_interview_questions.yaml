      - "解释样本点分配的状态总数是有限的（有限的组合数），由于目标函数单调递减且有下界，因此必然在有限步内收敛终止"

  - id: "CV-TQ-ST-014"
    type: "technical"
    question: "请解释一下矩阵特征值和特征向量的物理或几何意义是什么？"
    tags: ["线性代数", "数学基础", "特征提取"]
    difficulty: "medium"
    source: "商汤科技"
    key_points:
      - "几何意义：矩阵代表对空间的线性变换。特征向量是变换后方向保持不变的向量"
      - "物理意义：特征值表示特征向量在变换中的缩放比例（拉伸或压缩量），特征值越大说明数据在该特征向量方向上方差或能量越大"
      - "结合应用：在主成分分析（PCA）中，最大特征值对应的特征向量即为数据降维后的主成分方向"

