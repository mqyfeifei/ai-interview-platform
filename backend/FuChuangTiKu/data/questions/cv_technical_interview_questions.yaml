    source: "字节跳动"
    key_points:
      - "数学效果：L1正则化对应拉普拉斯先验，倾向于产生稀疏的权重矩阵；L2正则化对应高斯先验，倾向于让权重均匀变小但非零。"
      - "业务权衡：如果是高维稀疏特征场景（如推荐系统）需要做特征选择，倾向于L1；如果重点在于防止过拟合和提高模型泛化能力，倾向于L2。"

  - id: "CV-TQ-ZJ-035"
    type: "technical"
    question: "在Transformer的Scaled Dot-Product Attention公式中，为什么要在点积之后除以 sqrt(d_k) （即特征维度的平方根）？如果不除会出现什么问题？"
    tags: ["Transformer", "Attention机制", "数值稳定性"]
    difficulty: "medium"
    source: "字节跳动"
    key_points:
      - "理论基础：假设Q和K的元素独立且服从均值为0、方差为1的分布，其点积结果的方差会随着维度d_k的增大而线性放大。"
      - "不良后果：方差过大会导致点积结果的值域非常大，经过Softmax函数后，梯度趋近于0（进入Softmax饱和区），引发梯度消失现象。"
      - "缩放作用：除以 sqrt(d_k) 将点积结果的方差强行缩放回1，保证梯度的平稳传播。"

