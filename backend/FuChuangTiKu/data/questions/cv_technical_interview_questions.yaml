  - id: "CV-TQ-ST-020"
    type: "technical"
    question: "请详细对比分析ShuffleNet v1和v2的核心优点，以及它们各自提出的Motivation（动机）是什么？"
    tags: ["轻量级网络", "ShuffleNet", "模型压缩"]
    difficulty: "medium"
    source: "商汤科技"
    key_points:
      - "v1的Motivation是解决组卷积（Group Conv）带来的通道信息隔离问题，故引入Channel Shuffle操作"
      - "v2的Motivation指出FLOPs不能完全反映真实硬件推理速度（受内存访问成本MAC影响），提出了高效网络的四个实用设计准则"
      - "v2取消了v1中过多的密集碎片化操作（如过多Group Conv），在保持精度的前提下极大提高了实际硬件部署效率"

  - id: "CV-TQ-ST-021"
    type: "technical"
    question: "在目标检测的边界框回归任务中，Smooth L1 Loss的设计初衷是什么？相比于标准的L1 Loss和L2 Loss，它有哪些独特的优势？"
    tags: ["损失函数", "目标检测", "回归问题"]
    difficulty: "medium"
    source: "商汤科技"
    key_points:
      - "L2 Loss对异常值（Outliers）极度敏感，早期误差过大容易产生巨大梯度导致梯度爆炸"
      - "L1 Loss在误差接近零点处不可导，且在接近目标区域时梯度恒定，难以平滑收敛到极小值"
      - "Smooth L1 Loss是分段函数，完美结合两者：误差大时采用L1（梯度恒定防爆炸），误差小时采用L2（平滑稳定收敛）"

  - id: "CV-TQ-ST-022"
    type: "technical"
    question: "在MobileNet v2等轻量级网络的Inverted Residual（倒残差）块设计中，为什么要采用“先升维再降维”的策略？"
    tags: ["轻量级网络", "MobileNet", "网络结构"]
    difficulty: "hard"
    source: "商汤科技"
    key_points:
      - "Depthwise Conv（深度可分离卷积）自身提取跨通道特征的能力有限，升维可以在高维空间中进行，以保留更多的特征表达容量"
      - "低维特征经过ReLU等非线性激活函数极易造成信息坍塌（丢失），在高维做非线性变换后再线性降维（Linear Bottleneck）能最大限度保留有效信息"

