      - "结合定位置信度（如IoU-Aware机制），将模型预测的IoU质量分数与分类Score相乘进行综合评价排序"
      - "结合中心点距离罚项（如DIoU-NMS），对存在重叠遮挡但不共中心的场景具有更强的区分与鲁棒性"

  - id: "CV-TQ-ST-024"
    type: "technical"
    question: "主成分分析（PCA）是如何利用奇异值分解（SVD）来进行降维的？这种做法相比于传统计算方法有什么核心优势？"
    tags: ["机器学习", "降维算法", "数学基础"]
    difficulty: "medium"
    source: "商汤科技"
    key_points:
      - "PCA的核心是求解数据协方差矩阵的特征值分解。但计算高维数据的协方差矩阵（$X^T X$）计算量极大且易致数值溢出"
      - "利用SVD直接对中心化后的数据矩阵 $X$ 进行分解：$X = U \\Sigma V^T$，其右奇异矩阵 $V$ 的列向量即为协方差矩阵的特征向量"
      - "核心优势：规避了协方差矩阵的平方级运算开销，大幅降低计算复杂度，且保证了求解过程的数值稳定性"

  - id: "CV-TQ-ST-025"
    type: "technical"
    question: "请详细推导Batch Normalization的计算过程，并说明其可学习参数（γ 和 β）的必要性？"
    tags: ["BN", "深度学习基础", "模型优化"]
    difficulty: "medium"
    source: "商汤科技"
    key_points:
      - "计算过程包含四步：求Batch内的均值 -> 求方差 -> 数据标准化（减均值除标准差） -> 仿射变换（缩放和平移）"
      - "主要作用：缓解内部协变量偏移（ICS），平滑损失地形，允许使用更大学习率，自带隐式正则化效果"
      - "可学习参数必要性：强制将数据拉回正态分布可能会抹杀网络前面层学习到的特征分布，γ和β的存在使网络具备恢复原本非线性表达能力（恒等映射）的空间"