type: "qa_scenario_design_questions"
source:
  - "Tech_Blog"
  - "Personal_Notes"
  - "美团"
  - "字节跳动"
items:
  - id: "QA-SQ-001"
    type: "scenario_design"
    question: "如果让你对一个微信发红包的功能进行全面测试，你会从哪些维度设计测试点？"
    tags: ["场景测试", "用例设计"]
    difficulty: "medium"
    source: "Tech_Blog" 
    key_points:
      - "功能测试：拼手气/普通红包金额计算、最大最小金额/个数限制、退回逻辑"
      - "接口/并发测试：多人同时抢同一红包的超卖问题（并发锁验证）、幂等性"
      - "兼容与UI：不同机型屏幕适配、弱网环境断线重连体验"
      - "安全测试：抓包篡改金额、越权领取"
  - id: "QA-SQ-002"
    type: "scenario_design"
    question: "大促秒杀场景即将上线，请你设计一个全链路压测的方案。"
    tags: ["性能测试", "全链路压测"]
    difficulty: "hard"
    source: "Tech_Blog" 
    key_points:
      - "流量评估：与业务核对预期峰值，构建压测数据模型"
      - "数据隔离：压测标记透传，影子表与影子库建立，防止污染线上真实数据"
      - "演练执行：阶梯式加压探测极限，演练限流、熔断及降级预案是否生效"
      - "结果分析：监控系统资源利用率、响应时间分布，定位性能瓶颈并推动优化"
  - id: "QA-SQ-003"
    type: "scenario_design"
    question: "设计一个第三方支付（如支付宝/微信支付）接入模块的测试方案，如何保证资金安全与订单状态一致性？"
    tags: ["业务场景", "支付测试"]
    difficulty: "hard"
    source: "Tech_Blog" 
    key_points:
      - "状态流转验证：正向支付成功回调、用户取消支付、支付超时未支付"
      - "异常断网与重试：支付过程中断网、第三方异步回调延迟或失败、应用端主动发起查单补偿机制验证"
      - "资金安全与并发：支付金额防篡改（签名校验）、超付退款逻辑、高并发下防重复支付（幂等性）"
  - id: "QA-SQ-004"
    type: "scenario_design"
    question: "设计针对一款短视频流媒体 App 的专项测试方案。"
    tags: ["客户端测试", "专项测试"]
    difficulty: "medium"
    source: "Tech_Blog" 
    key_points:
      - "弱网测试：利用 Charles/QNET 模拟 3G/2G、高丢包、高延迟网络下的首屏加载、卡顿率及断点续传表现"
      - "耗电量与内存：长时间播放下的 CPU 占用、内存泄漏（OOM）、机身发热与耗电量监控（PerfDog）"
      - "兼容性测试：覆盖不同分辨率、不同系统版本（iOS/Android）、刘海屏/折叠屏适配、以及音视频解码器的兼容"
  - id: "QA-SQ-005"
    type: "scenario_design"
    question: "如果让你负责测试一个接入了大语言模型（LLM）的智能客服对话框，你会从哪些维度开展？"
    tags: ["AI测试", "前沿场景"]
    difficulty: "hard"
    source: "Personal_Notes" 
    key_points:
      - "基础交互：长文本输入限制、Markdown富文本渲染、多轮对话的上下文记忆能力"
      - "鲁棒性与安全（红蓝对抗）：提示词注入攻击（Prompt Injection）、涉黄涉政暴恐等敏感词拦截监控"
      - "准确性评估：构建涵盖业务知识库的 Ground Truth 评测集，验证幻觉率（Hallucination）和回答准确率"
      - "性能与可用性：响应时间监控、并发对话压力测试、以及模型升级迭代后的回归验证"
  - id: "QA-SQ-006"
    type: "scenario_design"
    question: "设计一个电商平台的订单系统测试方案，如何覆盖订单全生命周期的关键场景？"
    tags: ["订单系统", "场景测试"]
    difficulty: "medium"
    source: "Tech_Blog" 
    key_points:
      - "订单创建：正常下单、库存不足、优惠券使用、地址验证等场景"
      - "订单支付：支付成功、支付失败、支付超时、用户取消支付等场景"
      - "订单履约：发货流程、物流跟踪、退换货流程等场景"
      - "订单关闭：用户主动取消、系统自动关闭（如超时未支付）、售后服务等场景"
  - id: "QA-SQ-007"
    type: "scenario_design"
    question: "设计一个在线教育平台的直播课程系统测试方案，如何保证直播质量与用户体验？"
    tags: ["直播系统", "场景测试"]
    difficulty: "medium"
    source: "Tech_Blog" 
    key_points:
      - "直播稳定性：弱网环境下的流畅度、断线重连机制、以及直播过程中切换网络的表现"
      - "互动功能：弹幕发送与展示、举手发言、以及师生互动的实时性和可靠性"
      - "兼容性测试：不同设备（PC/移动端）、不同操作系统（Windows/iOS/Android）的适配情况"
      - "安全与隐私：直播内容的敏感词过滤、用户隐私信息保护，以及防止恶意攻击（如DDOS）对直播的影响"
  - id: "QA-SQ-008"
    type: "scenario_design"
    question: "设计一个基于云原生架构的微服务系统的测试方案，如何覆盖服务间调用、容器编排和弹性伸缩等场景？"
    tags: ["云原生", "微服务", "场景测试"]
    difficulty: "hard"
    source: "Tech_Blog" 
    key_points:
      - "服务间调用：模拟高并发请求验证服务发现、负载均衡和熔断机制的有效性"
      - "容器编排：验证Kubernetes等编排平台的部署、滚动更新和回滚功能是否正常工作"
      - "弹性伸缩：通过压力测试触发自动伸缩，验证系统在资源扩展和收缩过程中的稳定性和性能表现"
      - "监控与日志：确保分布式追踪、日志聚合和监控系统能够正确捕获和分析微服务的运行状态和异常情况"
  - id: "QA-SQ-009"
    type: "scenario_design"
    question: "设计一个社交媒体平台的内容审核系统测试方案，如何覆盖敏感内容识别、用户举报处理和审核效率等场景？"
    tags: ["内容审核", "场景测试"]
    difficulty: "medium"
    source: "Tech_Blog" 
    key_points:
      - "敏感内容识别：构建包含涉黄、涉政、暴恐等敏感内容的测试集，验证自动审核模型的准确率和召回率"
      - "用户举报处理：模拟用户举报流程，验证举报信息的传递、处理时效和结果反馈机制"
      - "审核效率：通过压力测试评估审核系统在高并发情况下的处理能力和响应时间，确保用户体验不受影响"
      - "误判与漏判：设计边界测试用例验证审核系统的鲁棒性，确保误判率和漏判率在可接受范围内"
  - id: "QA-SQ-010"
    type: "scenario_design"
    question: "设计一个基于计算机视觉的智能垃圾分类系统，如何处理垃圾种类繁多且外观相似的挑战？"
    tags: ["垃圾分类", "细粒度识别"]
    difficulty: "medium"
    source: "Personal_Notes" 
    key_points:
      - "细粒度分类：引入注意力机制（如SE模块）聚焦于区分性特征，提升相似类别的辨识度"
      - "多模态融合：结合重量传感器等非视觉信息辅助分类决策"
      - "数据增强与迁移学习：利用GAN生成稀缺类别样本，或从相关领域（如食品识别）迁移预训练模型提升泛化能力"

  - id: "QA-SD-011"
    type: "scenario_design"
    question: "作为高级测试开发工程师，如果要求你脱离简单的增删改查业务，从零到一设计一个能够支撑高并发和复杂业务链路的自动化测试平台，你会如何规划其核心架构和关键模块？"
    tags: ["自动化测试平台", "架构设计", "系统高可用"]
    difficulty: "hard"
    source: "Personal_Notes"
    key_points:
      - "具备清晰的平台分层架构设计思维（用例管理层、执行引擎层、节点调度层、报告统计层）。"
      - "提供针对高并发执行场景的解决方案（如分布式调度引擎、消息队列解耦）。"
      - "阐述平台如何与现有的CI/CD流水线无缝集成，实现数据驱动闭环。"

  - id: "QA-SD-012"
    type: "scenario_design"
    question: "结合当前新能源及智能网联汽车的发展，你认为车载测试（如智能座舱测试、自动驾驶测试）与传统互联网软件测试在流程和技术手段上有哪些核心差异？"
    tags: ["车载测试", "智能座舱", "硬件在环(HIL)"]
    difficulty: "medium"
    source: "Personal_Notes"
    key_points:
      - "理解软硬件结合的复杂性，能够提及硬件在环（HIL）或台架测试的必要性。"
      - "强调对系统实时性和功能安全性（如ISO 26262标准）的极高要求。"
      - "提及车载特有协议（如CAN/LIN总线协议）的抓包、仿真与信号分析。"

  - id: "QA-SQ-MT-001"
    type: "scenario_design"
    question: "假设现在在测一个秒杀系统，有三种并发来源（移动端、小程序、服务号），你如何设计性能测试场景来覆盖最真实的用户行为比例？"
    tags: ["性能测试", "流量模型", "高并发"]
    difficulty: "hard"
    source: "美团"
    key_points:
      - "数据收集分析：基于历史大促或线上日志提取各端流量占比（如APP 60%, 小程序 30%, 服务号 10%）"
      - "压测模型构建：使用JMeter/LoadRunner设置多线程组或吞吐量控制器，严格按比例分配并发数"
      - "特殊场景覆盖：除了混合压测，还需考虑单点突发峰值、弱网环境及降级策略的性能验证"

  - id: "QA-SQ-MT-002"
    type: "scenario_design"
    question: "如果要在已有微信支付的基础上引入一个红包抵扣功能，你要考虑订单金额、多支付方式、活动逻辑等，测试点怎么拆解？"
    tags: ["业务测试", "支付链路", "用例设计"]
    difficulty: "hard"
    source: "美团"
    key_points:
      - "正向链路：红包足够抵扣、红包部分抵扣混合支付，确保实付金额+红包金额=订单总额"
      - "异常链路：支付中断后红包退回机制、并发支付同一订单、并发使用同一红包防超卖"
      - "兼容与限制：红包有效期边界测试、互斥活动叠加规则、跨端（iOS/Android）一致性"

  - id: "QA-SQ-MT-003"
    type: "scenario_design"
    question: "你们系统使用Kafka做消息队列，假设Kafka挂了，你们推荐链路会怎么受影响？你会测哪些降级场景？"
    tags: ["中间件测试", "容灾降级", "系统稳定性"]
    difficulty: "hard"
    source: "美团"
    key_points:
      - "影响面分析：阐明消息积压或丢失会导致数据延迟、推荐内容不更新等业务后果"
      - "降级测试设计：验证熔断机制是否生效，系统是否平滑切换至同步兜底逻辑或默认静态推荐"
      - "恢复测试：Kafka重启后，验证消息重试机制、幂等性以及积压消费是否会导致系统OOM"

  - id: "QA-SQ-MT-004"
    type: "scenario_design"
    question: "如果一个请求过来从客户端点击到服务端处理，再到日志入库，一共经历5个环节。如果最终结果报错了，你怎么一层层验证到底哪一环出了问题？"
    tags: ["全链路排查", "网络协议", "微服务定位"]
    difficulty: "medium"
    source: "美团"
    key_points:
      - "端侧抓包排查：使用Charles/Fiddler查看客户端是否正确发出请求，参数是否合规"
      - "网关层分析：查看Nginx/API Gateway日志，确认请求是否成功路由，排查4xx/5xx状态码"
      - "服务层Trace追踪：利用SkyWalking/Arthas等链路追踪工具追踪RPC调用，查看各微服务节点报错及入库SQL执行情况"

  - id: "QA-SQ-MT-005"
    type: "scenario_design"
    question: "现在有100个接口需要做自动化覆盖，但人力严重不足，你作为质量把控者怎么排优先级？如何说服老板你的选择是合理的？"
    tags: ["质量策略", "优先级规划", "沟通技巧"]
    difficulty: "medium"
    source: "美团"
    key_points:
      - "分级策略：优先覆盖核心主交易链路（P0接口）及高频调用接口，延后覆盖低频或边缘查询接口"
      - "数据驱动说服：拉取线上接口调用量排行（QPS）和客诉关联数据作为依据，用ROI（投资回报率）来说服老板"
      - "分期交付：提出一期交付核心30个接口实现收益，后续随迭代逐步补全的敏捷演进方案"

  - id: "QA-SQ-MT-006"
    type: "scenario_design"
    question: "假设后台使用了Redis缓存，但用户总反映商品价格显示不对，你怎么判断这是缓存问题还是数据库问题？怎么设计测试用例模拟该场景？"
    tags: ["缓存测试", "数据一致性", "架构理解"]
    difficulty: "medium"
    source: "美团"
    key_points:
      - "定位方式：直连DB查真实价格，直连Redis查缓存价格，对比业务接口返回，定位脏数据来源"
      - "根因假设：是否是并发更新时缓存双删失败、缓存过期时间设置错误，或主从延迟导致"
      - "用例模拟：设计高并发读写商品价格的脚本，强制断开Redis观察缓存击穿穿透处理，以及过期时间临界点的边界测试"

  - id: "QA-SQ-MT-007"
    type: "scenario_design"
    question: "假设你们最近引入了策略灰度发布平台，策略上线是动态流控的，这种情况下你怎么做测试验证和覆盖？"
    tags: ["灰度发布", "策略测试", "流量回放"]
    difficulty: "hard"
    source: "美团"
    key_points:
      - "验证分流准确性：检查特定标签、白名单或哈希规则的用户是否准确命中灰度桶"
      - "双线验证：同时验证灰度版本（新策略）和全量版本（老策略）的逻辑，确保线上老用户不受影响"
      - "异常处理与回滚：测试在灰度配置异常或紧急叫停时，系统能否平滑降级并快速回滚"

  - id: "QA-SQ-MT-008"
    type: "scenario_design"
    question: "假设现在在测一个秒杀系统，有移动端、小程序、服务号三种并发来源，你如何设计性能测试场景以覆盖最真实的用户行为比例？"
    tags: ["性能测试", "场景设计", "高并发", "全链路压测"]
    difficulty: "hard"
    source: "美团"
    key_points:
      - "数据收集：通过生产环境的历史监控或日志分析，提取三种端的真实流量配比（如6:3:1）"
      - "流量构造：在JMeter或压测平台中，通过线程组权重或步长控制器，按比例下发不同Header/UA的请求"
      - "链路差异化：考虑不同端在网关层的鉴权逻辑、链路长度和缓存策略的差异，分别设定SLA指标"

  - id: "QA-SQ-MT-009"
    type: "scenario_design"
    question: "如果你上线当天发现核心接口错误率飙升，但没有报错日志，你怎么定位？你第一时间会看什么？"
    tags: ["线上排查", "异常定位", "应急响应"]
    difficulty: "hard"
    source: "美团"
    key_points:
      - "止血优先：第一时间评估影响面，考虑是否需要限流、降级或回滚版本"
      - "监控大盘排查：查看网络流量、CPU/内存指标、DB连接数、下游中间件（如Redis/Kafka）的健康度，判断是否为基础设施瓶颈"
      - "无日志的可能原因排查：考虑是不是网关层直接拒绝（如Nginx限流/413错误）、JVM OOM导致进程假死，或日志框架自身阻塞/丢列"

  - id: "QA-SQ-MT-010"
    type: "scenario_design"
    question: "面对一个你完全不熟悉的业务模块，限你两天内写出全覆盖的测试方案，你会怎么做？靠什么判断是否测全了？"
    tags: ["测试策略", "快速学习", "覆盖率"]
    difficulty: "medium"
    source: "美团"
    key_points:
      - "快速梳理：抓核心链路，向PD拿PRD，向开发拿接口文档和架构图，梳理核心状态机和数据流转"
      - "分层设计：使用思维导图拆解功能，分为主流程（P0）、异常分支（P1/P2）、兼容性及性能指标"
      - "覆盖度评估：事前通过开发和产品的评审拉齐认知；事后结合代码染色工具（如JaCoCo）查看增量代码覆盖率来兜底"

  - id: "QA-SQ-MT-011"
    type: "scenario_design"
    question: "如果你们后台使用到缓存，但用户总反映价格显示不对，你怎么判断是缓存问题还是数据库问题？怎么设计测试用例模拟？"
    tags: ["缓存测试", "数据一致性", "排查思路"]
    difficulty: "medium"
    source: "美团"
    key_points:
      - "排查思路：直接查询底层DB中的价格数据，再查询Redis中的缓存数据进行比对；如果DB是对的而Redis是错的，则为缓存更新不及时或脏读"
      - "测试用例设计：模拟高并发下先更新DB后更新/删除缓存失败的场景；模拟缓存击穿、穿透时的数据回写逻辑"
      - "验证分布式事务或最终一致性补偿机制是否生效"

  - id: "QA-SQ-MT-012"
    type: "scenario_design"
    question: "当你发现一个很难稳定复现的Bug时，你会怎么做？如何推动开发同学一起排查和修复？"
    tags: ["Bug生命周期管理", "沟通协作", "问题攻坚"]
    difficulty: "medium"
    source: "美团"
    key_points:
      - "保留现场：保存发生Bug时的入参、设备信息、网络环境、时间戳和TraceID，禁止重启相关Pod"
      - "缩小范围：通过二分法或改变单一变量（如切换网络、清除缓存）进行多次尝试，寻找触发规律"
      - "协助排查：通过梳理完整调用链，提供清晰的复现路径和线索，而非单纯丢掷问题给开发，降低沟通成本"

