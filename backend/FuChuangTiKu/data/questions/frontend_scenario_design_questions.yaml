  - "字节跳动"
items:
  - id: "FE-SQ-001"
    type: "scenario_design"
    question: "设计一个前端埋点与监控SDK，如何保证不上报脏数据、防串报、并降低性能消耗？"
    tags: ["工程设计", "监控 SDK"]
    difficulty: "hard"
    source: "Tech_Blog" 
    key_points:
      - "无感埋藏流与强制手动全包裹体系互补交错捕捉全盘图景"
      - "核心借助Navigator.sendBeacon/fetch keepalive坚固护航关闭页面终局发送不丢失不截断"
      - "使用本地全缓存与闲置帧（requestIdleCallback）的柔性排队补发打赢不卡UI无卡死消耗狙击战"
  - id: "FE-SQ-002"
    type: "scenario_design"
    question: "设计一个高可用的大文件分片上传组件，需要支持断点续传、并发控制及错误重试。"
    tags: ["文件上传", "并发控制"]
    difficulty: "hard"
    source: "Tech_Blog" 
    key_points:
      - "巧用WebWorker另起灶台开动分片大哈希规避主脑阻塞定格"
      - "严控并发高并发水闸（Promise机制节流并发量）打赢全频塞死僵局痛点"
      - "断点续传历史缓存查验以及拼图聚合失败大超重构及重试防崩溃铁链式双保险设计"
  - id: "FE-SQ-003"
    type: "scenario_design"
    question: "设计方案实现单点登录 (SSO)，如果是跨主域的情况，前端应该如何配合？"
    tags: ["安全设计", "SSO", "跨域"]
    difficulty: "medium"
    source: "Tech_Blog" 
    key_points:
      - "单中心CAS登录全域核发强信行流枢纽中心建立"
      - "运用跨界票据传递术（携卷URL跳转或内嵌信道连通认证法）打破同源墙城"
      - "熟练管控浏览器cookie异地传发令牌认证特性以及JWT授权护照凭据防泄漏机制网"
  - id: "FE-SQ-004"
    type: "scenario_design"
    question: "如果让你开发一个基于 Web IDE 的代码高亮编辑器，你会如何选型和架构？"
    tags: ["组件架构", "Web IDE"]
    difficulty: "hard"
    source: "Tech_Blog" 
    key_points:
      - "极道基床核心强硬依托Monaco Editor引擎支撑等霸主生态压顶降维化解重任"
      - "主架构全依托AST剖心剥离辅以Worker强行渲染隔离计算实现长段重排毒打抵抗"
      - "视口虚拟化DOM和极致canvas绘板加速防死拉跨的抗重型渲染能力护城河展现"
  - id: "FE-SQ-005"
    type: "scenario_design"
    question: "针对复杂表单（例如近 100 项带联动的配置项），如何设计能避免卡顿并具有良好可维护性？"
    tags: ["性能优化", "复杂表单"]
    difficulty: "medium"
    source: "Tech_Blog" 
    key_points:
      - "杜绝大水漫灌重排渲染采用极致颗粒响应分拆只点阵渲染防爆"
      - "抽取元级强引擎联动Schema外挂控制取代杂乱盘布于原身面条级无脑控制代码"
      - "强加消隐懒化加载视觉及重重交叠下的复杂事件单流响应提速设计解耦"
  - id: "FE-SQ-006"
    type: "scenario_design"
    question: "设计一个前端自动化测试框架，如何支持多浏览器兼容性测试和持续集成？"
    tags: ["自动化测试", "持续集成"]
    difficulty: "medium"
    source: "Tech_Blog" 
    key_points:
      - "选型强大跨平台的测试引擎（如Playwright）打通多浏览器兼容性测试的壁垒"
      - "架构层面设计分布式执行环境（如Selenium Grid或云测试服务）实现并行加速"
      - "与CI/CD工具链（如Jenkins/GitHub Actions）无缝集成实现自动触发和结果反馈闭环"
  - id: "FE-SQ-007"
    type: "scenario_design"
    question: "设计一个前端性能监控系统，如何收集关键性能指标（KPI）并进行分析和报警？"
    tags: ["性能监控", "KPI", "报警"]
    difficulty: "medium"
    source: "Tech_Blog" 
    key_points:
      - "选取核心KPI指标（如FCP、LCP、CLS等）并利用Performance API精准采集"
      - "架构设计分布式数据收集与处理管道（如使用Kafka和Elasticsearch）实现大规模数据分析"
      - "配置智能报警规则（如基于阈值或异常检测）及时通知相关人员并提供可操作的洞察报告"
  - id: "FE-SQ-008"
    type: "scenario_design"
    question: "设计一个前端国际化（i18n）解决方案，如何支持多语言切换和动态内容翻译？"
    tags: ["国际化", "i18n", "多语言"]
    difficulty: "medium"
    source: "Tech_Blog" 
    key_points:
      - "选型成熟的国际化库（如i18next或Vue I18n）提供基础的多语言支持"
      - "架构设计动态加载语言包和基于上下文的翻译机制实现高效切换和内容翻译"
      - "考虑文化差异和格式化需求（如日期、数字等）提供全面的国际化支持"
  - id: "FE-SQ-009"
    type: "scenario_design"
    question: "设计一个前端状态管理方案，如何处理复杂组件之间的状态共享和更新？"
    tags: ["状态管理", "组件通信"]
    difficulty: "medium"
    source: "Tech_Blog" 
    key_points:
      - "选型适合项目需求的状态管理库（如Redux、MobX或Vuex）提供全局状态管理能力"
      - "架构设计模块化状态切片和基于事件的更新机制实现组件间高效共享和解耦"
      - "利用中间件（如Redux Thunk或Saga）处理异步操作和复杂业务逻辑提升可维护性"
  - id: "FE-SQ-010"
    type: "scenario_design"
    question: "设计一个前端安全防护方案，如何防止常见的安全漏洞（如XSS、CSRF）？"
    tags: ["安全防护", "XSS", "CSRF"]
    difficulty: "medium"
    source: "Tech_Blog" 
    key_points:
      - "采用内容安全策略（CSP）限制资源加载和执行来源防止XSS攻击"
      - "实现CSRF令牌机制确保请求合法性并防止跨站请求伪造"
      - "定期进行安全审计和使用自动化工具（如OWASP ZAP）检测潜在漏洞并及时修复"

  - id: "BE-SD-011"
    type: "scenario_design"
    question: "请问如何设计一个秒杀系统来处理高并发请求，以及如何有效防止超卖现象？"
    tags: ["系统设计", "高并发", "分布式锁", "Redis"]
    difficulty: "hard"
    source: "Personal_Notes"
    key_points:
      - "前端限流（按钮置灰防抖）与网关层拦截（恶意IP限流）。"
      - "利用Redis缓存预热商品库存，承担绝大部分读写流量，避免直接打穿DB。"
      - "防超卖核心：使用Redis Lua脚本或Redisson分布式锁保证扣减库存操作的原子性。"
      - "引入消息队列（MQ）异步处理订单落库，实现请求的削峰填谷。"

  - id: "BE-SD-012"
    type: "scenario_design"
    question: "请问如何设计一个能够根据任务的优先级来执行的线程池？"
    tags: ["系统设计", "多线程", "并发编程"]
    difficulty: "hard"
    source: "Personal_Notes"
    key_points:
      - "核心思路：替换线程池默认的阻塞队列，改用优先级队列 PriorityBlockingQueue。"
      - "任务封装：提交的任务需要实现 Comparable 接口，重写 compareTo 方法以定义具体的优先级权重规则。"
      - "防饥饿策略：需要引入动态权重调整（如等待时间越长优先级越高），避免低优先级任务长时间得不到执行。"

  - id: "FE-SQ-AL-001"
    type: "scenario_design"
    question: "在实际场景中，除了分布式锁，你还会使用 Redis 来解决哪些问题？"
    tags: ["Redis", "应用场景", "缓存"]
    difficulty: "medium"
    source: "阿里巴巴"
    key_points:
      - "缓存热点数据以降低数据库压力"
      - "利用特定数据结构解决业务问题（如 ZSet 做排行榜，Set 做交并集、去重，List 做消息队列）"
      - "计数器、限流（Rate Limiting）、会话管理（Session）"

  - id: "FE-SQ-AL-002"
    type: "scenario_design"
    question: "如何设计一个高效的 Agent 上下文维护方案？"
    tags: ["AI Agent", "上下文管理", "架构设计"]
    difficulty: "hard"
    source: "阿里巴巴"
    key_points:
      - "长短记忆分离机制（短记忆用滑动窗口或Token截断，长记忆用向量数据库存储与检索）"
      - "上下文压缩技术（如文本摘要、关键实体提取）"
      - "状态机驱动或多轮对话状态追踪（DST）机制"

  - id: "FE-SQ-AL-003"
    type: "scenario_design"
    question: "在你的项目中，是如何设计并实现防止超卖现象的？"
    tags: ["高并发", "防超卖", "分布式事务"]
    difficulty: "medium"
    source: "阿里巴巴"
    key_points:
      - "数据库层面使用乐观锁（版本号机制或依靠库存大于0的条件）"
      - "使用 Redis 预扣减库存并结合 Lua 脚本保证原子性"
      - "消息队列异步削峰填谷落库"

  - id: "FE-SQ-AL-004"
    type: "scenario_design"
    question: "在实际业务中，如何保证数据库与缓存（如 Redis）之间的数据一致性？"
    tags: ["Redis", "数据一致性", "缓存架构"]
    difficulty: "hard"
    source: "阿里巴巴"
    key_points:
      - "旁路缓存模式（Cache Aside）：先更新数据库，再删除缓存"
      - "延迟双删策略解决并发引起的不一致问题"
      - "结合 Canal 等中间件监听 MySQL Binlog 异步更新缓存，保证最终一致性"

  - id: "FE-SQ-AL-005"
    type: "scenario_design"
    question: "如果项目中 Redis 突然遇到极高并发（如瞬间一万个请求）导致服务不可用，你会如何排查和解决？"
    tags: ["高可用", "Redis", "故障排查"]
    difficulty: "hard"
    source: "阿里巴巴"
    key_points:
      - "快速止损手段：限流、降级、熔断"
      - "排查原因：是否发生缓存雪崩、缓存击穿、缓存穿透或大Key/热Key问题"
      - "根治方案：Redis集群扩容、热点数据本地缓存（如 Guava/Caffeine）、优化慢查询"

  - id: "FE-SQ-AL-006"
    type: "scenario_design"
    question: "如果要在系统中实现生成式召回，你需要对现有的模型结构做哪些具体的修改和调整？"
    tags: ["推荐系统", "生成式召回", "架构演进"]
    difficulty: "hard"
    source: "阿里巴巴"
    key_points:
      - "从传统的双塔向量召回转变为基于序列生成（Seq2Seq）的架构"
      - "构建统一的 ID 体系或语义表示以便于 LLM 理解"
      - "引入 Beam Search 或其他受限解码策略以保证生成的 Item ID 合法且高效"

  - id: "FE-SD-TX-001"
    type: "scenario_design"
    question: "假如有一个调用后台接口的场景：前端需要跨域调用B系统接口，但该接口不支持OPTIONS预检请求，你会怎么绕过去？"
    tags: ["跨域", "OPTIONS", "网络代理"]
    difficulty: "hard"
    source: "腾讯"
    key_points:
      - "理解CORS跨域和简单请求/复杂请求的区别，明白为何会发出OPTIONS"
      - "提出解决方案1：避免触发复杂请求（降级为简单请求如GET/POST，去除自定义Header）"
      - "提出解决方案2：使用BFF层代理、Nginx反向代理或DevServer Proxy来解决跨域"

  - id: "FE-SD-TX-002"
    type: "scenario_design"
    question: "如果生产环境中遇到用户打开页面直接白屏的情况，你会第一时间怎么排查和处理？"
    tags: ["异常排查", "白屏监控", "性能监控"]
    difficulty: "medium"
    source: "腾讯"
    key_points:
      - "沟通定位法：确认白屏现象的范围（机型、网络环境、App版本）"
      - "数据排查法：查看Sentry等前端异常监控报警，排查JS语法报错或资源加载失败"
      - "降级与恢复：回滚最新发布的静态资源，或者利用兜底缓存页面保证可用性"

  - id: "FE-SD-TX-003"
    type: "scenario_design"
    question: "假设用户一次性粘贴了一万行Markdown文本进入编辑器，导致页面滚动时出现卡顿，你会如何设计方案来优化？"
    tags: ["性能优化", "大文本处理", "虚拟列表"]
    difficulty: "hard"
    source: "腾讯"
    key_points:
      - "解释卡顿原因：瞬间触发大量语法解析与DOM重绘"
      - "优化方案1：Web Worker分离解析逻辑，避免阻塞主线程"
      - "优化方案2：渲染层应用虚拟列表/可视区域渲染技术（DOM节点回收）"

  - id: "FE-SD-TX-004"
    type: "scenario_design"
    question: "算法场景题：假设一栋楼有100层，你有两个玻璃球，有些楼层扔下去球会碎，有些不会碎。你需要利用这两个球找到临界楼层，最优解法是什么？"
    tags: ["算法应用", "动态规划", "逻辑思维"]
    difficulty: "hard"
    source: "腾讯"
    key_points:
      - "能够指出不能用简单的二分法（因为球只有两个，碎了就没了）"
      - "提出基于数学/动态规划的解法：假设第一次在第k层扔，最优策略应保证最坏情况下扔的次数相等"
      - "得出方程 k + (k-1) + (k-2) + ... + 1 >= 100，算出最少次数为14次"

  - id: "FE-SQ-TX-005"
    type: "scenario_design"
    question: "假设用户一次性粘贴了一万行Markdown内容，导致页面在滚动时发生卡顿，你会如何排查和优化处理这个问题？"
    tags: ["性能优化", "大数据量渲染", "虚拟列表", "Markdown"]
    difficulty: "hard"
    source: "腾讯"
    key_points:
      - "排查思路：使用Chrome Performance工具定位Long Task（如解析耗时或DOM渲染耗时）"
      - "优化解析：采用Web Worker将Markdown转HTML的解析过程移出主线程"
      - "优化渲染：采用分块渲染（Chunking）或虚拟滚动（Virtual Scrolling）机制，仅渲染可视区域内的DOM节点"

  - id: "FE-SQ-TX-006"
    type: "scenario_design"
    question: "思考题：有100层楼和两个一模一样的玻璃球，有些楼层扔下去球会碎，有些不会。你需要找到那个刚好能让球碎的临界楼层，最优解法是什么？最少尝试次数是多少？"
    tags: ["算法与数据结构", "逻辑思维", "动态规划"]
    difficulty: "hard"
    source: "腾讯"
    key_points:
      - "识别题目本质为经典的双蛋问题（动态规划或数学方程求解）"
      - "解释不能简单使用二分法的原因为球数受限（只有两个）"
      - "推导最优步长方程 x + (x-1) + ... + 1 >= 100，得出最少尝试次数为14次"

  - id: "FE-SQ-TX-007"
    type: "scenario_design"
    question: "如果现在有一批10万条视频数据，你会如何设计一个系统流程来完成从本地转移到云端，并在前端页面实现截帧、文字描述和数据存储？"
    tags: ["系统设计", "大文件上传", "视频处理"]
    difficulty: "hard"
    source: "腾讯"
    key_points:
      - "上传方案：分片上传、断点续传、并发控制处理海量文件"
      - "截帧处理：前端利用 Canvas + Video 标签进行抽帧，或由服务端利用 FFmpeg 异步截帧"
      - "数据流转：设计合理的状态机跟踪单条视频的处理进度（上传中、截帧中、完成）"

  - id: "FE-SQ-TX-008"
    type: "scenario_design"
    question: "假若有个调用后台接口的场景：前端调B系统接口，但接口不支持OPTIONS预检请求导致跨域失败，你怎么绕过去？"
    tags: ["跨域问题", "CORS", "网络协议"]
    difficulty: "medium"
    source: "腾讯"
    key_points:
      - "方案一：使用前端代理（如Webpack/Vite DevServer Proxy 或 Nginx 反向代理）"
      - "方案二：将请求改为简单请求（Simple Request），避免触发预检（如仅使用 GET/POST，避免自定义Header，设置 Content-Type 为 application/x-www-form-urlencoded 等）"

  - id: "FE-SQ-TX-009"
    type: "scenario_design"
    question: "你是如何设计JWT权限分级管控的？具体做了哪些前端与后端的权限隔离细节？"
    tags: ["权限管理", "安全控制", "JWT"]
    difficulty: "medium"
    source: "腾讯"
    key_points:
      - "前端层面：基于JWT中的Role或Permission字段做路由拦截（Router Guard）和组件/按钮级别的显隐控制"
      - "后端层面：网关层验证JWT有效性，业务服务拦截器验证角色是否拥有具体接口调用权限"
      - "安全细节：Token防重放、Token刷新机制（Access Token + Refresh Token）、敏感操作二次验证"

  - id: "FE-SQ-TX-010"
    type: "scenario_design"
    question: "你是如何设计 JWT 权限分级管控的？在前端路由、组件渲染以及接口请求拦截层面，具体做了哪些权限隔离的细节？"
    tags: ["权限管理", "JWT", "系统设计"]
    difficulty: "hard"
    source: "腾讯"
    key_points:
      - "阐述前端路由动态挂载（动态路由）的实现原理"
      - "说明细粒度权限控制（如按钮级、组件级显示隐藏）的设计方案"
      - "讲解 Axios 拦截器中对无权限或 Token 过期的优雅处理机制"

  - id: "FE-SQ-TX-011"
    type: "scenario_design"
    question: "如果要设计一套高并发的票务系统，如何确保前端界面的高吞吐响应，同时配合后端确保稳定性和绝对防止超卖？"
    tags: ["高并发", "防超卖", "前端架构"]
    difficulty: "hard"
    source: "腾讯"
    key_points:
      - "前端请求层的削峰填谷（如答题验证码、按钮防抖与冷却倒计时）"
      - "利用 CDN 缓存静态资源，动静分离"
      - "配合后端理解乐观锁、Redis预扣减、MQ异步排队等机制，并在前端做相应的加载状态或轮询处理"

