    difficulty: "medium"
    source: "Personal_Notes"
    key_points:
      - "能够列举常见数据结构（如哈希表、树结构）和基础算法。"
      - "能结合实际测试场景说明应用（如利用图算法解析微服务依赖链路、利用字符串匹配进行海量日志监控去重）。"
      - "理解算法在提升自动化执行效率和平台性能中的核心作用。"

  - id: "QA-TQ-032"
    type: "technical"
    question: "在搭建UI或接口自动化测试框架时，你是如何处理测试数据的隔离、多环境依赖以及用例之间的数据传递问题的？"
    tags: ["自动化测试", "测试数据管理", "环境解耦"]
    difficulty: "medium"
