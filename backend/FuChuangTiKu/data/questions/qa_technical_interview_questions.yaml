  - id: "QA-TQ-ZJ-044"
    type: "technical"
    question: "UI自动化测试中，Playwright框架和Selenium框架的区别是什么？"
    tags: ["自动化框架", "Playwright", "Selenium"]
    difficulty: "medium"
    source: "字节跳动"
    key_points:
      - "架构区别：Selenium基于WebDriver协议与浏览器通信，Playwright直接通过DevTools协议与浏览器内核交互，速度更快"
      - "稳定性：Playwright内置自动等待（Auto-waiting）机制，减少Flaky tests，而Selenium常需手动编写显式等待"
      - "多页面支持：Playwright对多Tab页签、IFrame及浏览器上下文（Browser Context）的支持更原生理性且开销极低"

