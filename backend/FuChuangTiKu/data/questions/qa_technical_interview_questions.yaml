    tags: ["MySQL", "索引原理", "数据结构"]
    difficulty: "medium"
    source: "美团"
    key_points:
      - "B+树：非叶子节点不存数据只存主键索引，数据全在叶子节点并形成有序双向链表。适合范围查询（>、<、between）、排序和精确匹配"
      - "Hash索引：基于哈希表实现，等值查询极快（O(1)），但数据无序存放"
      - "缺点对比：Hash索引不支持范围查询，不支持索引的最左前缀匹配规则，且存在哈希冲突的问题。InnoDB默认使用B+树，但内部有自适应哈希索引优化"

