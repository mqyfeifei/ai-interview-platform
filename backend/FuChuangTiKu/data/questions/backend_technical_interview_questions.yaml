    question: "Spring IOC 与 AOP 的核心实现机制分别是什么？"
    tags: ["Spring", "IOC", "AOP"]
    difficulty: "medium"
    source: "CSDN" 
    key_points:
      - "IOC通过反射和控制反转解耦，配合三级缓存解决循环依赖机制"
      - "AOP通过动态代理(JDK代理/CGLIB)实现非侵入式的切面增强"
  - id: "BE-TQ-023"
    type: "technical"
    question: "Spring 事务传播行为有哪些？实际开发最常见坑是什么？"
    tags: ["Spring", "事务"]
    difficulty: "hard"
    source: "Nowcoder" 
    key_points:
      - "REQUIRED(默认,加入当前事务)"
      - "REQUIRES_NEW(挂起当前,新建独立事务)"
      - "常见坑：内部方法调用((this.调用))导致代理失效事务不生效"
      - "异常被catch吞掉未向外抛出"
  - id: "BE-TQ-024"
    type: "technical"
    question: "Spring Boot 自动配置原理（`@EnableAutoConfiguration`）是什么？"
    tags: ["SpringBoot", "自动配置"]
    difficulty: "medium"
    source: "CSDN" 
    key_points:
      - "核心注解@EnableAutoConfiguration"
      - "通过@Import加载SPI机制定义的类"
      - "扫描META-INF/spring.factories或依赖加载按条件(@ConditionalOnClass等)装配"
  - id: "BE-TQ-025"
    type: "technical"
    question: "你如何设计幂等接口，防止重复提交？"
    tags: ["系统设计", "幂等"]
    difficulty: "medium"
    source: "Nowcoder" 
    key_points:
      - "数据库建立唯一索引兜底"
      - "利用Redis的SETNX(互斥锁)检查防重"
      - "前端防抖及Token票据流机制(申请Token->带Token提交->服务端销毁票据)"
  - id: "BE-TQ-026"
    type: "technical"
    question: "分布式锁常见实现（Redis、数据库、ZK）及优缺点？"
    tags: ["分布式", "锁"]
    difficulty: "hard"
    source: "CSDN" 
    key_points:
      - "Redis：性能极高，配合Redisson看门狗解决超时问题"
      - "ZK：基于临时顺序节点与Watch机制，可靠性高但有网络开销"
      - "数据库：实现简单(排他锁/唯一键)，并发性能差不易做高可用"
  - id: "BE-TQ-027"
    type: "technical"
    question: "消息队列如何保证消息不丢失、不重复、顺序消费？"
    tags: ["MQ", "一致性"]
    difficulty: "hard"
    source: "Nowcoder" 
    key_points:
      - "不丢失：生产者确认机制(Confirm)、MQ持久化存储、消费者手动ACK验证"
      - "不重复：下游消费者业务端实现强幂等性防范"
      - "顺序：保证数据发往同一分区(Partition)及单线程顺序消费"
  - id: "BE-TQ-028" 
    type: "technical"
    question: "微服务中如何实现服务注册发现与负载均衡？"
    tags: ["微服务", "服务治理"]
    difficulty: "medium"
    source: "CSDN" 
    key_points:
      - "服务注册发现：通过注册中心(Nacos/Eureka)及其心跳和健康检查机制"
      - "负载均衡：通过客户端(Ribbon/LoadBalancer)从服务列表获取后执行轮询/随机/一致性Hash策略选取"
  - id: "BE-TQ-029"
    type: "technical"
    question: "API 网关在后端架构中的作用是什么？"
    tags: ["微服务", "网关"]
    difficulty: "easy"
    source: "Nowcoder" 
    key_points:
      - "统一请求入口及路由转发"
      - "统一鉴权(JWT/OAuth2)拦截"
      - "全局限流、熔断及参数校验控制"
      - "协议转换(如HTTP代理到内网RPC通讯)"
  - id: "BE-TQ-030"
    type: "technical"
    question: "线上 Full GC 频繁时，你的排查和优化步骤是什么？"
    tags: ["JVM", "线上排障"]
    difficulty: "hard"
    source: "CSDN" 
    key_points:
      - "排查内存泄漏风险(ThreadLocal/静态集合没清理)"
      - "利用Arthas/jmap定位是否有大对象突发"
      - "MetaSpace元空间是否被打满"
      - "检查System.gc()现象或结合监控优化堆内外大小比"

  - id: "BE-TQ-AL-001"
    type: "technical"
    question: "假设 Maven 引入了两个包，存在版本冲突问题。我们可以用哪些解决方案，使两个版本的包都能在工程中被使用？"
    tags: ["Maven", "包冲突", "类加载机制"]
    difficulty: "hard"
    source: "阿里巴巴"
    key_points:
      - "常规排包：通过 <exclusions> 排除掉不兼容的低版本"
      - "环境隔离：借助 OSGi 等模块化框架隔离类加载器"
      - "重命名/阴影技术（Shading）：使用 Maven Shade Plugin 对其中一个包重新打包并修改包路径（如 com.google -> repackaged.com.google），从而实现双版本共存"

  - id: "BE-TQ-AL-002"
    type: "technical"
    question: "什么是策略模式？它主要适用于哪些业务场景？"
    tags: ["设计模式", "架构设计", "代码重构"]
    difficulty: "medium"
    source: "阿里巴巴"
    key_points:
      - "定义：将一系列算法分别封装起来，让它们之间可以互相替换，使算法的变化独立于使用算法的客户"
      - "适用场景：代替复杂的 if-else 或 switch-case 逻辑（如不同的支付方式、不同的会员折扣计算）"
      - "扩展：结合工厂模式或 Spring 依赖注入（@Autowired 注入 Map）进行策略路由配置"

  - id: "BE-TQ-AL-003"
    type: "technical"
    question: "HashMap 在多线程场景下使用要注意什么？在只读并发场景下可以直接使用吗？"
    tags: ["HashMap", "并发编程", "集合框架"]
    difficulty: "medium"
    source: "阿里巴巴"
    key_points:
      - "多线程更新问题：JDK7可能出现环形链表死循环，JDK8可能出现数据覆盖（丢失更新）和 Size 统计不准"
      - "替代方案：并发更新必须使用 ConcurrentHashMap"
      - "只读并发场景：如果 HashMap 在初始化完成后绝对不会再有 put/remove 操作，只读情况下是线程安全的，可以直接使用"

  - id: "BE-TQ-AL-004"
    type: "technical"
    question: "创建数据库联合索引时需要注意什么？哪些情况下会导致索引失效？"
    tags: ["MySQL", "数据库索引", "性能调优"]
    difficulty: "medium"
    source: "阿里巴巴"
    key_points:
      - "最左前缀法则：联合索引遵循最左匹配，跳过首列或中间列会导致后续索引失效"
      - "列选择性：应将区分度高、查询频繁的列放在联合索引的前面"
      - "失效场景：范围查询（>、<）其右侧列失效；对索引列使用函数或计算；LIKE 以 `%` 开头；隐式类型转换"

  - id: "BE-TQ-AL-005"
    type: "technical"
    question: "Redis 怎样实现分布式锁？Redisson 实现分布式锁的底层原理是什么？"
    tags: ["Redis", "分布式锁", "Redisson"]
    difficulty: "medium"
    source: "阿里巴巴"
    key_points:
      - "基础实现：SET resource_name my_random_value NX PX 30000 保证互斥性和防死锁，释放锁需用 Lua 脚本校验 Value 防止误删"
      - "Redisson 原理：底层大量使用 Lua 脚本保证指令原子性"
      - "Redisson 看门狗机制：后台开启定时任务（Watchdog），如果业务未执行完则自动为锁续期，防止锁提前超时释放"

  - id: "BE-TQ-TX-001"
    type: "technical"
    question: "Redis的发布订阅（Pub/Sub）机制除了Redis还可以用什么技术替代？你当时为什么选择使用Redis做？"
    tags: ["Redis", "消息队列", "技术选型"]
    difficulty: "medium"
    source: "腾讯"
    key_points:
      - "替代方案：Kafka, RabbitMQ, RocketMQ等专业消息中间件，或本地事件总线"
      - "Redis优势：系统复杂度低，无需引入额外重型组件，轻量且延迟低"
      - "Redis劣势：消息无法持久化，没有ACK机制，断线可能丢失消息"

  - id: "BE-TQ-TX-002"
    type: "technical"
    question: "Redis有事务机制吗？它跟MySQL的事务有什么本质上的区别？"
    tags: ["Redis", "MySQL", "事务"]
    difficulty: "medium"
    source: "腾讯"
    key_points:
      - "Redis通过MULTI, EXEC, DISCARD, WATCH实现事务，但不支持回滚机制"
      - "区别于MySQL：MySQL满足严格的ACID特性，支持Undo Log回滚"
      - "Redis事务执行中报错会继续执行后续命令（除非入队前存在语法错误）"

  - id: "BE-TQ-TX-003"
    type: "technical"
    question: "Redis的线程模型是单线程的吗？为什么早期版本坚持使用单线程结构？"
    tags: ["Redis", "线程模型", "高并发"]
    difficulty: "medium"
    source: "腾讯"
    key_points:
      - "Redis 6.0前核心工作线程（网络IO和键值对读写）是单线程的"
      - "单线程优势：避免上下文切换开销，避免多线程锁竞争，简化数据结构设计"
      - "Redis性能瓶颈通常在网络带宽和内存，而非CPU，通过IO多路复用已能满足高并发读写"

  - id: "BE-TQ-TX-004"
    type: "technical"
    question: "在接口开发中，你是如何实现防重和幂等性设计的？"
