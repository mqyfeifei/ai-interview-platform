      - "B+树叶子节点形成双向链表，极大地优化了范围查询的性能；红黑树高度太高，磁盘I/O太频繁"
      - "联合索引依据定义的字段顺序构建索引树，查询必须包含最左边的字段才能利用索引树进行搜索，否则将回退到全表扫描"

