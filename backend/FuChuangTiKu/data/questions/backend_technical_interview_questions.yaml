  - id: "BE-TQ-ZJ-026"
    type: "technical"
    question: "在微服务架构中，为了提升性能通常会引入Redis缓存，那么如何保证Redis缓存和数据库（如MySQL）之间的数据一致性？如果缓存删除失败了怎么办？"
    tags: ["Redis", "数据库", "双写一致性", "架构设计"]
    difficulty: "hard"
    source: "字节跳动"
    key_points:
      - "读操作：先读缓存，命中则返回；未命中查DB并回写缓存"
      - "写操作首选策略：先更新数据库，再删除缓存（Cache Aside Pattern）。这种方案产生并发不一致的概率极低"
      - "兜底保障机制（缓存删除失败）：引入消息队列（MQ）或者订阅MySQL的Binlog（如使用Canal组件），异步重试执行缓存清理操作，直到成功为止"