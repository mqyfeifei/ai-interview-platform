      - "重载（Overload）：发生在同一个类中，方法名相同，参数列表（类型、个数、顺序）不同。编译期绑定。"
      - "重写（Override）：发生在子类继承父类或实现接口时，方法名、参数列表必须完全相同，返回值类型需兼容。运行期多态绑定。"
  - id: "BE-TQ-MT-011"
    type: "technical"
    question: "请解释Redis中缓存穿透、缓存击穿和缓存雪崩的区别，并说明各自的解决方案。"
    tags: ["Redis", "缓存异常", "高可用"]
    difficulty: "medium"
    source: "美团"
    key_points:
      - "缓存穿透：请求不存在的数据。解决：布隆过滤器拦截、缓存空值。"
      - "缓存击穿：热点Key过期，瞬间高并发打满DB。解决：互斥锁（如Redisson）、热点Key永不过期或逻辑过期。"
      - "缓存雪崩：大量Key同时过期或Redis宕机。解决：过期时间加随机值、搭建高可用集群（Sentinel/Cluster）、多级缓存与限流降级。"
  - id: "BE-TQ-MT-012"
    type: "technical"
    question: "请简述你对JVM架构和垃圾回收（GC）机制的理解，G1垃圾回收器相较于CMS有哪些核心提升？"
