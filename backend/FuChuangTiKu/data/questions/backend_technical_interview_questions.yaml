      - "丰富了合并策略（Compaction Style）：支持Leveled Compaction和Universal Compaction等多种策略以适应不同读写场景"
      - "增加了列族（Column Family）支持，允许多个数据集共享同一个WAL但拥有独立的MemTable和SSTable体系"

