    tags: ["Java基础", "多线程", "ThreadLocal"]
    difficulty: "medium"
    source: "京东"
    key_points:
      - "ThreadLocal用于实现线程间的数据隔离，避免多线程下的资源竞争"
      - "普通的ThreadLocal在子线程中无法获取父线程设置的值"
