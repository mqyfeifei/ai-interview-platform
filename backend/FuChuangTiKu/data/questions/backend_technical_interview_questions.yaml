      - "检查队列长度与线程数配置是否合理"
      - "临时扩容或服务降级"
  - id: "BE-TQ-011"
    type: "technical"
    question: "`HashMap` 在 JDK1.7 与 JDK1.8 的实现差异有哪些？"
    tags: ["集合", "HashMap"]
    difficulty: "medium"
    source: "Nowcoder" 
    key_points:
      - "1.8底层变为数组+链表+红黑树(提速查询)"
      - "头插法改为尾插法(杜绝多线程死链)"
      - "扩容时通过高低位重新散列，无须重新计算hash"
  - id: "BE-TQ-012"
    type: "technical"
    question: "`ConcurrentHashMap` 如何保证并发安全与性能平衡？"
    tags: ["集合", "并发"]
    difficulty: "hard"
    source: "CSDN" 
    key_points:
      - "1.7使用分段锁(Segment)降低冲突"
      - "1.8使用Node数组+CAS+Synchronized，锁粒度细化到拉链头结点"
      - "大幅提升并发写性能"
  - id: "BE-TQ-013"
    type: "technical"
    question: "为什么重写了 `equals` 必须重写 `hashCode`？"
    tags: ["Java基础", "集合"]
    difficulty: "easy"
    source: "Nowcoder" 
    key_points:
      - "为了保证对象放入基于Hash的集合(如HashMap/HashSet)时能正确定位"
      - "确保逻辑上相等的对象拥有相同的散列值以便及时覆盖或去重"
  - id: "BE-TQ-014"
    type: "technical"
    question: "MySQL InnoDB 的聚簇索引和二级索引有什么区别？"
    tags: ["MySQL", "索引"]
    difficulty: "medium"
    source: "CSDN" 
    key_points:
      - "聚簇索引(主键索引)叶子节点存储完整的数据行"
      - "二级索引(非主键索引)叶子节点仅存储对应的主键值"
      - "二级索引查询可能需要进行回表操作(扫两次B+树)"
  - id: "BE-TQ-015"
    type: "technical"
    question: "索引失效常见场景有哪些？如何规避？"
    tags: ["MySQL", "SQL优化"]
    difficulty: "medium"
    source: "Nowcoder" 
    key_points:
