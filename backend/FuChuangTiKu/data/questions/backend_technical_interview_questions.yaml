    source: "字节跳动"
    key_points:
      - "三次握手：SYN -> SYN+ACK -> ACK。目的是同步双方的序列号，并防止失效的连接请求突然传到服务端造成资源浪费"
      - "四次挥手：FIN -> ACK -> (数据传输完毕) -> FIN -> ACK"
      - "四次的原因：TCP是全双工的。客户端发FIN只代表客户端不再发送数据，但服务端可能还有数据未发完，所以先回ACK，等发完数据再发FIN，导致中间两次无法像握手那样合并"

