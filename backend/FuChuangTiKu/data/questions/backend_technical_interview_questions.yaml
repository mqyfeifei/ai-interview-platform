    key_points:
      - "直接设置固定的过期时间无法兼顾所有业务的执行时长"
      - "标准解决方案是引入看门狗机制（Watch Dog），如Redisson的实现"
      - "加锁成功后开启一个后台定时任务（看门狗），在业务尚未执行完成前，周期性地自动为锁续期（重置过期时间）"
      - "业务执行完毕或节点宕机后看门狗停止续期，确保锁能安全释放"

  - id: "BE-TQ-PDD-006"
    type: "technical"
    question: "请解释TCP四次挥手中，客户端为什么会进入TIME_WAIT状态并等待2MSL？"
    tags: ["计算机网络", "TCP协议", "状态机"]
    difficulty: "medium"
    source: "拼多多"
    key_points:
      - "确保服务端能够正常关闭：如果客户端发送的最后一个ACK丢失，服务端会重发FIN，TIME_WAIT状态允许客户端接收重传并再次回复ACK"
      - "防止旧连接的数据包干扰新连接：等待2MSL（报文最大生存时间的2倍）足以让本次连接在网络中残留的所有数据包都自然消亡，避免被后续使用相同端口的新连接错误接收"

  - id: "BE-TQ-ZJ-001"
    type: "technical"
    question: "请解释一下数据库并发事务中脏读、不可重复读和幻读的区别是什么？MySQL的四种隔离级别分别是如何解决这些问题的？"
    tags: ["MySQL", "事务隔离", "并发控制"]
    difficulty: "medium"
    source: "字节跳动"
    key_points:
      - "脏读是读到未提交数据；不可重复读是同事务内两次读取结果不同（因Update）；幻读是范围查询时结果数量集改变（因Insert/Delete）"
      - "Read Committed解决脏读，Repeatable Read（MySQL默认）利用MVCC解决不可重复读"
      - "InnoDB在RR级别下，通过Next-Key Lock（间隙锁+行锁）很大程度上解决了幻读问题"

  - id: "BE-TQ-ZJ-002"
    type: "technical"
    question: "为什么MySQL的InnoDB引擎选择使用B+树作为索引结构，而不是B树或红黑树？请简述联合索引的最左前缀匹配原理。"
    tags: ["MySQL", "底层数据结构", "索引优化"]
    difficulty: "medium"
    source: "字节跳动"
    key_points:
