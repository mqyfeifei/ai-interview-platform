    difficulty: "medium"
    source: "字节跳动"
    key_points:
      - "缓存穿透（查不存在的数据）：解决方案是缓存空对象（设较短过期时间）或使用布隆过滤器拦截"
      - "缓存击穿（热点Key突然过期）：解决方案是使用互斥锁（如Redisson）只让一个线程去查DB重建缓存，或者设置热点数据逻辑上永不过期"
      - "缓存雪崩（大量Key同时过期或Redis宕机）：解决方案是打散Key的过期时间（加随机值）、配置Redis高可用集群、服务限流降级"

