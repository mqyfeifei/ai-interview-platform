  - id: "BE-TQ-MT-001"
    type: "technical"
    question: "请解释缓存穿透、缓存击穿和缓存雪崩的概念与区别，并分别说明各自的常见解决方案。"
    tags: ["Redis", "缓存架构", "高并发"]
    difficulty: "medium"
    source: "美团"
    key_points:
      - "缓存穿透（请求不存在的数据）：使用布隆过滤器拦截，或缓存空对象并设置较短过期时间"
      - "缓存击穿（单点热点Key失效导致穿透）：使用互斥锁（如分布式锁）只允许一个线程去查DB，或设置热点数据逻辑永不过期"
      - "缓存雪崩（大量Key同时失效或Redis宕机）：对过期时间加上随机数打散，使用高可用集群（哨兵/Cluster），以及开启限流降级"

  - id: "BE-TQ-MT-002"
    type: "technical"
    question: "请比较Redis的RDB和AOF两种持久化机制，分别阐述它们的原理、优势及适用场景。"
    tags: ["Redis", "持久化", "原理分析"]
    difficulty: "medium"
    source: "美团"
    key_points:
      - "RDB是快照持久化，通过fork子进程并利用写时复制生成全量数据文件；优势是恢复速度快，适合灾备；劣势是可能会丢失最后一次快照后的数据"
      - "AOF是追加日志持久化，记录每条写命令；优势是数据安全性高（最多丢1秒）；劣势是文件体积大，恢复速度慢"
      - "适用场景：推荐Redis 4.0之后的混合持久化，结合RDB的快速恢复和AOF的数据安全性"

  - id: "BE-TQ-MT-003"
    type: "technical"
    question: "请简述Java中创建线程的方式、线程的生命周期状态，比较sleep()和wait()的区别，并说明产生死锁的四个必要条件。"
