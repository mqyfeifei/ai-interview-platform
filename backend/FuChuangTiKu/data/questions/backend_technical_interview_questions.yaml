  - id: "BE-TQ-MT-008"
    type: "technical"
    question: "请详细讲一下Redis的持久化机制（RDB和AOF）有哪些，各自的原理、优缺点是什么？"
    tags: ["Redis", "持久化", "高可用"]
    difficulty: "medium"
    source: "美团"
    key_points:
      - "RDB：内存快照，二进制文件。优点是恢复速度快，文件体积小；缺点是存在丢失数据的风险（取决于备份频率），BGSAVE耗时且耗费CPU。"
      - "AOF：追加命令日志。优点是数据安全性高（可秒级或每次写入同步）；缺点是文件体积大，恢复速度慢，高并发下对性能有一定影响。"
      - "混合持久化：结合两者优点，RDB做全量，AOF做增量。"
  - id: "BE-TQ-MT-009"
