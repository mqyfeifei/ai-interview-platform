      - "使用EXPLAIN分析执行计划(关注type, key, extra等字段)"
      - "检查是否发生全表扫描、未使用索引或文件排序现象"
      - "针对性加联合索引或重写SQL"
  - id: "BE-TQ-019"
    type: "technical"
    question: "Redis 常见数据结构及典型业务场景是什么？"
    tags: ["Redis", "缓存"]
    difficulty: "easy"
    source: "Nowcoder" 
    key_points:
      - "String(缓存/计数/分布式锁)"
      - "Hash(对象存储/购物车)"
      - "List(消息队列/最新列表)"
      - "Set(去重/标签/交并补集)"
      - "ZSet(排行榜/延时队列)"
  - id: "BE-TQ-020"
    type: "technical"
    question: "Redis 缓存击穿、穿透、雪崩分别如何解决？"
    tags: ["Redis", "高并发"]
    difficulty: "medium"
    source: "CSDN" 
    key_points:
      - "缓存击穿：热点Key失效导致穿透(方案：互斥锁或逻辑过期)"
      - "缓存穿透：查不存在的数据(方案：布隆过滤器或缓存空对象)"
      - "缓存雪崩：大面积失效(方案：TTL加随机值/集群高可用/限流降级)"
  - id: "BE-TQ-021"
    type: "technical"
    question: "Redis 持久化 RDB 与 AOF 的区别与取舍？"
    tags: ["Redis", "持久化"]
    difficulty: "medium"
    source: "Nowcoder" 
    key_points:
      - "RDB生成快照体量小、恢复快，但会丢失最近数据"
      - "AOF记录命令完整性高，但文件大、重写开销大、恢复慢"
      - "推荐混合持久化架构结合两者优点"
  - id: "BE-TQ-022"
