      - "索引列发生隐式类型转换或使用了函数"
      - "LIKE使用了模糊的左前缀(如'%abc')"
      - "OR条件中包含非索引列"
  - id: "BE-TQ-016"
    type: "technical"
    question: "事务隔离级别及其可能出现的并发问题（脏读、不可重复读、幻读）。"
