    tags: ["网络编程", "Reactor", "高并发"]
    difficulty: "hard"
    source: "腾讯"
    key_points:
      - "Reactor是一种基于事件驱动模式的IO分发模型，利用IO多路复用监听事件，并将不同事件分发给对应的Handler"
      - "单线程模型：接收连接与业务处理都在同一线程（如Redis 6之前），不适合耗时业务"
      - "多线程模型：主线程只负责接收连接与IO读写，业务处理交给线程池（解决CPU计算瓶颈）"
      - "主从多线程：MainReactor只负责接收连接建立请求，SubReactor池负责已建立连接的IO读写，业务处理依然由线程池负责（如Netty标准架构）"

