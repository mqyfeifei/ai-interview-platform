    tags: ["多线程", "并发编程", "锁机制"]
    difficulty: "medium"
    source: "京东"
    key_points:
      - "准确定义悲观锁（假定冲突大概率发生，加排他锁）和乐观锁（假定冲突小概率发生，无锁重试）"
      - "悲观锁（如 synchronized, For Update）缺点是容易阻塞、性能开销大；优点是数据绝对安全"
      - "乐观锁（如 CAS, 版本号机制）缺点是高并发下自旋开销大（ABA问题）；优点是读多场景并发度高"

  - id: "BE-TQ-JD-040"
    type: "technical"
    question: "为什么创建MySQL数据表时，推荐将主键设置为自增ID？"
    tags: ["MySQL", "数据库索引", "底层原理"]
    difficulty: "medium"
    source: "京东"
    key_points:
      - "MySQL InnoDB引擎使用B+树组织聚簇索引，数据按主键顺序存储"
      - "自增主键可以保证新插入的记录顺序追加在当前页的尾部，减少页分裂和数据移动的开销"
      - "UUID等无序主键会导致大量的随机IO和页分裂，产生空间碎片，降低写入性能"

