  - id: "BE-TQ-ZJ-014"
    type: "technical"
    question: "介绍一下CAS（Compare And Swap）机制的原理及其优缺点。CAS典型的ABA问题是什么，应该如何解决？"
    tags: ["并发编程", "CAS", "ABA问题"]
    difficulty: "medium"
    source: "字节跳动"
    key_points:
      - "CAS原理：比较内存值与预期值，若相等则替换为新值，依靠CPU硬件原语（如cmpxchg）保证原子性"
      - "优缺点：优点是无锁并发性能好；缺点是在高并发下自旋可能带来高CPU开销，且只能保证一个共享变量的原子操作"
      - "ABA问题与解决：值从A变B又变回A，CAS会误以为没被修改过。解决方式是引入版本号（AtomicStampedReference），每次修改版本号加1"

