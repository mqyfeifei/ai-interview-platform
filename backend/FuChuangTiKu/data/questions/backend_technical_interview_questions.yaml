  - id: "BE-TQ-JD-044"
    type: "technical"
    question: "MySQL索引的数据结构为什么是B+树？什么是回表操作？什么是联合索引的最左匹配原则？"
    tags: ["MySQL", "索引", "B+树"]
    difficulty: "medium"
    source: "京东"
    key_points:
      - "B+树非叶子节点不存数据，使得单个节点能容纳更多索引，树层级更低，减少磁盘IO"
      - "回表：通过二级索引查到主键ID后，再回聚簇索引树查找完整行数据的过程"
      - "最左匹配原则：复合索引的使用必须从最左边的列开始按顺序匹配，中间不能跳过，否则索引失效"

