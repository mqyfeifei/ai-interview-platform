  - id: "BE-TQ-TX-035"
    type: "technical"
    question: "在操作系统理论中，进程与线程的核心区别是什么？在资源分配、上下文切换和通信方式上有何不同？"
    tags: ["操作系统", "进程管理", "多线程"]
    difficulty: "easy"
    source: "腾讯"
    key_points:
      - "资源分配：进程是资源分配的基本单位（拥有独立的内存地址空间），线程是CPU调度的基本单位（共享所属进程的内存和文件句柄）"
      - "上下文切换：进程切换涉及虚拟地址空间的切换（如页表），开销巨大；同进程的线程切换只保存/恢复少量的寄存器和栈帧，开销较小"
      - "通信方式：进程间通信（IPC）需要借助管道、消息队列、共享内存或Socket；线程间通信可以直接通过共享内存变量读写（需同步锁处理）"

