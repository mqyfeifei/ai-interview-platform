  - id: "BE-TQ-PDD-003"
    type: "technical"
    question: "在Java 8的HashMap中，为什么当链表长度大于等于8时会转化为红黑树？为什么树化退化阈值设置为6而不是7？"
    tags: ["Java集合", "HashMap", "红黑树"]
    difficulty: "hard"
    source: "拼多多"
    key_points:
      - "设计原则基于泊松分布，在理想的哈希算法下，链表长度达到8的概率极小（千万分之一），转化为红黑树是一种极端哈希冲突下的兜底策略以保证O(logN)查询效率"
      - "退化阈值设为6而不是7，是为了形成缓冲区间，防止当哈希桶中的节点在8附近徘徊时，导致频繁发生树化和链表化的相互转换，引起严重的性能损耗"

  - id: "BE-TQ-PDD-004"
    type: "technical"
    question: "为什么ConcurrentHashMap的size()方法在并发环境下可能不精确？在JDK 1.8中有什么替代方案或优化实现？"
    tags: ["Java并发", "ConcurrentHashMap", "源码解析"]
    difficulty: "hard"
    source: "拼多多"
    key_points:
      - "在并发环境下，元素不断插入和删除，size处于动态变化中。如果采用强一致性加锁会导致性能断崖"
      - "JDK 1.8中采用了类似LongAdder的分段思想，通过 baseCount 和 CounterCell 数组分别记录，最后累加得出结果，这种最终一致性设计牺牲了瞬时的精准度换取了高并发性能"
      - "官方建议使用 mappingCount() 方法替代 size()，因为它返回的是 long 类型，能防止超出 int 上限"

  - id: "BE-TQ-PDD-005"
    type: "technical"
    question: "使用Redis实现库存扣减的分布式锁时，如何有效解决业务未执行完但锁超时的安全问题？"
    tags: ["Redis", "分布式锁", "Redisson"]
