  - id: "BE-TQ-HW-006"
    type: "technical"
    question: "LSM-Tree（日志结构合并树）是读写均衡、写优先还是读优先的数据结构？为什么？业界对其读取性能做了哪些优化方案？"
    tags: ["存储引擎", "LSM-Tree", "底层结构"]
    difficulty: "hard"
    source: "华为"
    key_points:
      - "LSM-Tree是典型的高性能写优先（Write-Optimized）数据结构。它将随机写转化为顺序追加写操作（先写内存MemTable和WAL，然后批量刷盘为SSTable）"
      - "读取较慢是因为可能需要从新到旧遍历多个SSTable层次进行归并"
      - "读优化方案包括：引入布隆过滤器（快速判断数据是否存在）、Block Cache（内存缓存数据块）、后台持续的Compaction（压实归并）减小文件层级"

  - id: "BE-TQ-HW-007"
