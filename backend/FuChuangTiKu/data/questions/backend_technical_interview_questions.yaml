    key_points:
      - "简述JVM内存划分（堆、栈、方法区等）及可达性分析算法。"
      - "CMS的缺点：采用标记-清除算法容易产生内存碎片，且在并发清理阶段遇到浮动垃圾可能触发Full GC（Concurrent Mode Failure）。"
      - "G1的提升：采用Region内存划分，基于标记-整理算法（局部复制），避免内存碎片；并建立了可预测的停顿时间模型。"
  - id: "BE-TQ-MT-013"
    type: "technical"
    question: "在MySQL的InnoDB引擎中，主键使用自增BigInt和使用UUID，在性能和底层存储上有什么差异？"
    tags: ["MySQL", "InnoDB", "索引原理"]
    difficulty: "medium"
    source: "美团"
    key_points:
      - "InnoDB使用聚簇索引（B+树），数据按主键顺序物理存储。"
      - "自增BigInt：插入时按顺序追加，不会导致频繁的页分裂（Page Split），空间利用率高，查询效率高且占用空间小。"
      - "UUID：无序的字符串，插入时会导致频繁的B+树节点分裂和页合并，产生大量内存碎片和磁盘随机I/O，且占用空间比BigInt大，导致单页存储的数据量变少。"
  - id: "BE-TQ-MT-014"
    type: "technical"
    question: "在Spring框架中，使用依赖注入时，@Autowired和@Resource注解有什么区别？"
    tags: ["Spring", "IOC", "依赖注入"]
    difficulty: "medium"
    source: "美团"
    key_points:
      - "来源不同：@Autowired是Spring提供的注解；@Resource是JDK/J2EE标准（JSR-250）提供的注解。"
      - "注入规则不同：@Autowired默认按Type（类型）注入，如果存在多个同类型Bean需配合@Qualifier；@Resource默认按Name（名称）注入，找不到时再回退到按Type注入。"
  - id: "BE-TQ-MT-015"
    type: "technical"
    question: "在操作系统中，“并发（Concurrency）”和“并行（Parallelism）”有什么区别？"
    tags: ["操作系统", "多线程", "并发编程"]
    difficulty: "easy"
    source: "美团"
    key_points:
      - "并发（Concurrency）：宏观上多个任务同时推进，微观上由于CPU时间片轮转，同一时刻只有一个任务在执行（单核环境下的多任务）。"
      - "并行（Parallelism）：微观和宏观上均同时执行，依赖于多核CPU资源，多个任务在同一时刻被多个CPU核心分别执行。"
  - id: "BE-TQ-MT-016"
    type: "technical"
    question: "请简述Java多线程中wait()方法和Thread.sleep()方法的区别。"
    tags: ["Java基础", "多线程", "并发控制"]
    difficulty: "easy"
    source: "美团"
    key_points:
      - "归属不同：wait()是Object类的方法，sleep()是Thread类的静态方法。"
      - "锁释放机制不同（核心）：wait()会释放持有的对象锁，而sleep()不会释放锁。"
      - "唤醒机制不同：wait()需要被notify()/notifyAll()唤醒（或超时），sleep()会在指定时间后自动苏醒。"
      - "使用场景：wait()用于线程间通信，必须在同步块/方法中调用；sleep()用于暂停当前线程执行。"

  - id: "BE-TQ-PDD-001"
    type: "technical"
    question: "请简述MySQL的事务特性（ACID），并分别说明它们在底层是如何实现的？"
    tags: ["MySQL", "数据库事务", "InnoDB"]
    difficulty: "medium"
    source: "拼多多"
    key_points:
      - "原子性（Atomicity）：基于 undo log（回滚日志）实现，保证操作失败时能够回滚"
      - "持久性（Durability）：基于 redo log（重做日志）实现，保证宕机不丢数据（WAL机制）"
      - "隔离性（Isolation）：基于 锁机制 和 MVCC（多版本并发控制）实现"
      - "一致性（Consistency）：是最终目的，由业务代码保障以及上述三大特性共同维持"

