  - id: "NW-PQ-HW-001"
    type: "project_deep_dive"
    question: "请详细讲讲你在安全项目中遇到的Shiro漏洞原理，以及高版本中AES Oracle Padding的具体利用方式？"
    tags: ["项目经历", "网络安全", "Shiro反序列化", "密码学"]
    difficulty: "hard"
    source: "华为"
    key_points:
      - "阐述Shiro 550漏洞的本质：RememberMe Cookie使用默认硬编码AES密钥导致反序列化RCE"
      - "阐述Shiro 721漏洞的机制：利用Padding Oracle Attack（填充提示攻击）构造有效的RememberMe Cookie"
      - "说明高版本AES Oracle Padding攻击无需知道密钥，只需利用服务器对解密失败和反序列化失败的响应差异，逐字节猜解明文或伪造密文"

  - id: "NW-PQ-HW-002"
    type: "project_deep_dive"
    question: "在你的渗透项目中，对安卓应用进行抓包的具体细节是怎样的？另外，OSS任意文件上传如果仅仅限制后缀名，能够完全防护吗？为什么？"
    tags: ["渗透项目", "移动端抓包", "文件上传漏洞", "OSS"]
    difficulty: "medium"
    source: "华为"
    key_points:
      - "安卓抓包细节需提及：证书安装（高版本安卓需将证书导入系统目录）、绕过SSL Pinning（如使用Frida/Xposed模块）"
      - "限制后缀名不能完全防护文件上传漏洞，可能存在黑名单被绕过（如PHP3、PHTML等冷门后缀）"
      - "可能存在中间件解析漏洞（如Apache多后缀解析、IIS解析漏洞），或者结合文件包含漏洞进行利用"

  - id: "NW-PQ-HW-003"
    type: "project_deep_dive"
    question: "讲讲你在实习期间，主要负责了哪些工作？解决了什么实际问题？"
