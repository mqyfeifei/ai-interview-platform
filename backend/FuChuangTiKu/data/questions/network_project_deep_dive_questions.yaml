  - id: "NW-PQ-ZX-001"
    type: "project_deep_dive"
    question: "在你的项目里，如果一个任务既要保证实时性，又要避免占用过多CPU，你会怎么设计？"
    tags: ["实时系统", "CPU优化", "架构设计"]
    difficulty: "hard"
