    difficulty: "hard"
    source: "字节跳动"
    key_points:
      - "接入层：DNS轮询、CDN加速、Nginx集群与限流降级"
      - "应用层：微服务无状态化设计、异地多活、熔断隔离机制（Sentinel/Hystrix）"
      - "数据层：MySQL主从同步与分库分表、Redis集群哨兵模式、MQ防消息丢失机制"

  - id: "BE-SQ-ZJ-008"
    type: "scenario_design"
    question: "针对像微博、抖音这样具有几亿用户量级的国民级App，如果你来设计其核心数据（如用户关注关系或内容流），应该如何进行分库分表与高效查询方案设计？"
    tags: ["海量数据", "分库分表", "查询优化"]
    difficulty: "hard"
    source: "字节跳动"
    key_points:
      - "分片键（Sharding Key）的选择：通常以 UserID 作为分表键，采用 Hash 取模或一致性 Hash 算法"
      - "读写扩散问题的处理：关注关系往往需要“发件箱”和“收件箱”双写，或采用推拉结合（Push & Pull）架构"
      - "复杂查询：非分片键查询需引入 ES (ElasticSearch) 或宽表构建二级索引"

  - id: "BE-SQ-ZJ-009"
    type: "scenario_design"
    question: "在高并发场景下，如果更新数据库后，Redis缓存删除操作失败了，会导致双写不一致。这种情况下应该怎么办？有哪些兜底机制？"
    tags: ["缓存一致性", "Redis", "高并发兜底"]
    difficulty: "medium"
    source: "字节跳动"
    key_points:
      - "利用消息队列（MQ）重试机制：将删除缓存任务放入MQ，保证At Least Once消费重试"
      - "利用Canal订阅MySQL Binlog机制：业务代码不感知缓存，由Canal监听数据变更异步更新/删除Redis，实现解耦"
      - "设置合理的缓存TTL（过期时间）作为最终的兜底防线"

  - id: "BE-SQ-ZJ-010"
