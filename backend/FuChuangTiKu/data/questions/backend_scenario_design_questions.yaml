      - "全面考虑降级（非核心链路剥离）、熔断（异常时快速失败保护）、限流（压垮系统前拦截）及异地多活灾备方案"

  - id: "BE-SQ-ZJ-013"
    type: "scenario_design"
    question: "假设线上分析发现，使用的Seata分布式事务机制导致了严重的性能瓶颈，大量高并发请求阻塞在等待全局锁上。你会如何设计方案来优化或替代？"
