    source: "美团"
    key_points:
      - "固定加锁顺序（按 ID 大小排序加锁）"
      - "死锁检测与超时回滚机制"
      - "将同步转账异步化，通过消息队列保证最终一致性"
  
  - id: "BE-SQ-MT-007"
    type: "scenario_design"
    question: "在高并发的分布式场景下，如何设计防重机制和幂等处理，防止用户连续两次提交订单请求？"
    tags: ["高并发", "幂等性", "防重设计"]
    difficulty: "hard"
    source: "美团"
    key_points:
      - "前端层面：按钮置灰、防抖处理"
      - "网关/接口层：Token机制（防重Token，提交前获取，提交后核销）"
      - "存储层：利用Redis的SETNX实现分布式锁，或者数据库唯一索引防止重复插入"
  - id: "BE-SQ-MT-008"
    type: "scenario_design"
    question: "在使用消息队列时，如果有多个分区（Partition），但在某些场景下必须保证业务消息的“顺序消费”，应该如何实现？"
    tags: ["消息队列", "顺序消费", "Kafka/RocketMQ"]
    difficulty: "hard"
    source: "美团"
    key_points:
      - "局部顺序：通过指定Message Key（如订单ID），利用Hash算法确保同一业务实体投递到同一个Partition"
      - "消费端保证：单一消费者线程处理，或内部使用有边界的内存队列（如队列按Key分配对应线程）"
      - "处理重试时的顺序乱序问题：失败时需阻塞同Key的后续消息，或者进入专门的顺序死信处理"
  - id: "BE-SQ-MT-009"
    type: "scenario_design"
    question: "在微服务架构中，熔断规则通常是如何配置的（如慢调用比例、异常率）？触发熔断后系统是如何恢复的？"
    tags: ["服务治理", "熔断降级", "Spring Cloud Alibaba"]
    difficulty: "medium"
    source: "美团"
    key_points:
      - "说明熔断指标的统计维度（如滑动窗口时间内的错误比例阈值、慢调用阈值）"
      - "解释熔断器的状态转换机制：Closed（关闭） -> Open（打开） -> Half-Open（半开）"
      - "说明Half-Open状态下的探针机制，若请求成功则恢复Closed，失败则重置Open的时间窗口"
  - id: "BE-SQ-MT-010"
    type: "scenario_design"
    question: "请设计一个话费充值功能的MySQL表结构，实现核心功能最少需要设计几张表？请简述表结构和关联关系。"
    tags: ["数据库设计", "MySQL", "业务建模"]
    difficulty: "medium"
    source: "美团"
    key_points:
      - "用户/账户表：记录用户余额和基础信息"
      - "充值套餐/商品表：配置可选的充值面额及优惠策略"
      - "充值订单流水表：记录订单号、用户ID、金额、支付状态（待支付、已支付、充值成功、失败退款）等，需强调幂等性和防并发控制（如状态机乐观锁）"
  - id: "BE-SQ-MT-011"
    type: "scenario_design"
    question: "如何使用Redis的ZSet（有序集合）数据结构实现热点商品的实时排行？ZSet的Key应该如何设计？"
    tags: ["Redis", "ZSet", "排行榜"]
    difficulty: "medium"
    source: "美团"
    key_points:
      - "解释ZSet的数据结构特性，基于Score进行排序"
      - "Key设计：按业务和时间维度设计（如 `hot_goods:rank:20260414`）"
      - "Score设计：可以是销量、浏览量或综合热度值；Value为商品ID"
      - "更新与查询操作：通过ZINCRBY累加分数，ZREVRANGE获取TopN"
  - id: "BE-SQ-MT-012"
    type: "scenario_design"
    question: "如果上线一个新需求，数据结构和量级均已确定，你会如何评估存储这些数据所需的Redis内存空间是否充足？"
    tags: ["Redis", "容量评估", "架构设计"]
    difficulty: "hard"
    source: "美团"
    key_points:
      - "计算单个KV占用的内存：分析Key长度、Value的数据类型及序列化后的字节大小"
      - "考虑Redis的底层数据结构开销（如dictEntry、redisObject头信息等元数据开销）"
      - "结合数据总量计算总内存，并预留足够的缓冲空间（如内存碎片的开销、BGSAVE时的写时复制内存冗余，通常预留30%-50%）"

  - id: "BE-SQ-PDD-001"
    type: "scenario_design"
    question: "请详细设计并描述一下高并发秒杀系统的整体架构方案。核心优化的重点应该放在哪里？"
    tags: ["高并发", "秒杀系统", "架构设计"]
    difficulty: "hard"
    source: "拼多多"
    key_points:
      - "前端优化：防抖、页面静态化（CDN隔离）"
      - "网络层/网关层：限流（令牌桶/漏桶）、黑名单拦截、恶意请求过滤"
      - "应用层：Redis缓存预热、利用Lua脚本或Redis单线程特性处理库存扣减"
      - "异步削峰：通过MQ将订单请求异步化，缓解数据库写压力"

  - id: "BE-SQ-PDD-002"
    type: "scenario_design"
    question: "在优惠券秒杀场景中，大量用户发起订单但未支付导致库存被无效占用，该如何设计架构来解决这个问题？"
    tags: ["延迟队列", "库存一致性", "订单中心"]
    difficulty: "hard"
    source: "拼多多"
    key_points:
      - "引入延迟队列机制（如RabbitMQ的死信队列/延迟插件，或Redis的ZSet）"
      - "设置订单支付超时时间（例如15或30分钟）"
      - "超时未支付后，消费延迟消息，触发取消订单并归还库存的逻辑"
      - "做好幂等性控制，防止库存的重复归还"

  - id: "BE-SQ-PDD-003"
    type: "scenario_design"
    question: "在大促高并发场景下，你会如何合理设置 ThreadPoolExecutor 的各项核心参数？如果采用动态线程池方案该如何设计？"
    tags: ["线程池优化", "高并发", "动态调参"]
    difficulty: "medium"
    source: "拼多多"
    key_points:
      - "根据任务类型区分：CPU密集型（N+1）和 IO密集型（2N或更高配置）"
      - "结合压测数据，合理设置 corePoolSize、maximumPoolSize 以及阻塞队列的长度，坚决避免使用无界队列"
      - "大促期间可参考拼多多的动态线程池方案，基于配置中心（如Apollo/Nacos）动态下发参数并实时生效，配合监控告警"

  - id: "BE-SQ-PDD-004"
    type: "scenario_design"
    question: "在缓存架构中，为什么使用分布式锁能够避免回源风暴（缓存击穿）？如何防止恶意请求击穿缓存？"
    tags: ["缓存击穿", "分布式锁", "布隆过滤器"]
    difficulty: "medium"
    source: "拼多多"
    key_points:
      - "对于热点Key过期（缓存击穿），使用分布式锁确保同一时刻只有一个线程能够去数据库查询并重建缓存，其他线程等待"
      - "对于防范恶意请求（缓存穿透），采用布隆过滤器（Bloom Filter）提前拦截不存在的Key"
      - "或者对查询不到的数据在缓存中存入一个带较短过期时间的空值（Null/特定标识）"
  
  - id: "BE-SQ-ZJ-001"
    type: "scenario_design"
    question: "在缓存和数据库双写一致性的场景中，如果你采用先更新数据库再删除缓存的方案，要是缓存删除失败了应该怎么办？"
    tags: ["缓存一致性", "Redis", "高并发设计"]
    difficulty: "hard"
    source: "字节跳动"
    key_points:
      - "引入消息队列（MQ）进行异步重试删除"
      - "使用Canal监听MySQL的Binlog，在下游消费Binlog进行缓存的精确清理"
      - "结合缓存自身的TTL过期时间作为最终兜底机制"

  - id: "BE-SQ-ZJ-002"
    type: "scenario_design"
    question: "在使用MinIO进行大文件分片上传时，如果遇到网络波动导致分片合并失败应该如何处理？残余的临时分片文件的清理机制应该如何设计？"
    tags: ["分布式存储", "断点续传", "异常处理"]
    difficulty: "medium"
    source: "字节跳动"
    key_points:
      - "利用MD5校验分片完整性，提供重试合并机制"
      - "记录每个分片的上传状态（Redis/DB），客户端重启后可以查询进度进行续传"
      - "使用定时任务（如XXL-Job）定期扫描过期未合并的临时文件夹，或利用MinIO自身的生命周期管理（Lifecycle）自动清理"

  - id: "BE-SQ-ZJ-003"
    type: "scenario_design"
    question: "场景设计：假设系统中有两个账户进行并发互相转账操作，如何设计代码或数据库机制来避免死锁？这种方案可能会引入什么新的风险？"
