      - "热点数据（大V动态）需做读扩散或写扩散优化，并结合多级缓存进行抵挡"

  - id: "BE-SQ-ZJ-005"
    type: "scenario_design"
    question: "在RAG（检索增强生成）知识库系统中，如何设计一套机制来保证大规模私有化数据的持续更新和知识“保鲜”？"
