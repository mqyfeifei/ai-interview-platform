    source: "美团"
    key_points:
      - "前端 Loading 状态置灰与 Token 机制（防重放）"
      - "后端基于分布式锁（Redis SETNX）的防并发处理"
      - "数据库层面唯一索引做兜底幂等"

  - id: "BE-SQ-MT-006"
    type: "scenario_design"
    question: "假如账户互相转账产生死锁，在不影响用户体验的前提下，有哪些成熟的解决方案及潜在风险？"
    tags: ["死锁", "分布式事务", "MySQL"]
