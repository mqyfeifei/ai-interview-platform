    difficulty: "hard"
    source: "字节跳动"
    key_points:
      - "按照固定的顺序进行加锁（例如总是先锁账户ID较小的一方，再锁较大的），打破环路等待条件"
      - "使用分布式事务或利用Redis/ZooKeeper实现分布式排他锁来控制转账串行化"
      - "风险认知：强行排队串行化会降低系统并发吞吐量，需权衡锁粒度和性能"

  - id: "BE-SQ-ZJ-004"
