    difficulty: "hard"
    source: "字节跳动"
    key_points:
      - "降级一致性要求，从强一致性（AT模式全局锁）改为最终一致性（BASE理论）"
      - "采用基于MQ的可靠消息最终一致性方案或最大努力通知型方案解耦链路"
      - "针对必须同步的场景，优化锁粒度、调整隔离级别或转为利用TCC模式提高并发度"

  - id: "BE-SQ-ZJ-014"
