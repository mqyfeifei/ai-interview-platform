      - "设计合理的Sharding Key避免数据倾斜，并结合ClickHouse/ES等大数据OLAP组件处理历史复杂分析查询"

  - id: "BE-SQ-ZJ-015"
    type: "scenario_design"
    question: "在账户互相转账场景中，如何通过代码级锁或DB锁控制解决死锁问题？你的方案可能会引入什么新的风险？"
