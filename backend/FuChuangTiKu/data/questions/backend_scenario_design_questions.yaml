      - "若使用数据库行锁，由于网络或事务处理延迟可能降低吞吐量，带来高并发下的性能急剧下降"
      - "引入风险解决方案：可改为基于状态机和MQ的异步转账清算系统，提高吞吐并保证最终一致"

