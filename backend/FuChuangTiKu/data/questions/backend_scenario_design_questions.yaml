  - id: "BE-SQ-ZJ-006"
    type: "scenario_design"
    question: "场景设计：如果需要实现系统内账户之间的互相转账功能，如何避免产生死锁问题？你的方案可能会引入哪些新的技术风险？"
    tags: ["并发编程", "死锁防范", "分布式事务"]
    difficulty: "hard"
    source: "字节跳动"
    key_points:
      - "识别死锁原因：高并发下交叉加锁（A转B锁A再锁B，B转A锁B再锁A）"
      - "防死锁方案：对锁资源进行全局排序（如按账户ID从小到大加锁），确保加锁顺序一致"
      - "风险认知：大事务可能导致数据库连接池被占满，性能下降，需考虑拆分事务或引入分布式事务/消息队列异步记账"

  - id: "BE-SQ-ZJ-007"
    type: "scenario_design"
    question: "如果让你从零设计一个高可用的分布式旅游订单系统，你会重点考虑哪些维度的容灾与高可用方案？"
