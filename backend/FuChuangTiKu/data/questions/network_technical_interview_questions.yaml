    key_points:
      - "IS-IS和OSPF同属链路状态路由协议，均使用SPF算法计算最短路径"
      - "工作层级不同：IS-IS工作在数据链路层（基于CLNS），而OSPF工作在网络层（基于IP，协议号89）"
      - "区域划分机制不同：IS-IS的区域边界在链路上（路由器属Level-1或Level-2等），OSPF的区域边界在路由器上（ABR）"
      - "扩展性：IS-IS采用TLV（Type-Length-Value）结构，支持IPv6等新协议更容易，常用于大型运营商网络"

