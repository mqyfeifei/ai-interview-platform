      - "IGMP（组播网关管理协议）：运行在终端接收者与最后一跳路由器之间，用于终端加组、退组及维护成员关系"
      - "PIM（协议无关组播）：运行在组播路由器之间（如 PIM-SM/PIM-DM），负责构建跨网段的组播分发树，实现组播数据包的路由分发"

