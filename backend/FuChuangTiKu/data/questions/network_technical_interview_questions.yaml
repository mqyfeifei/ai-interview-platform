  - id: "NW-TQ-HW-007"
    type: "technical"
    question: "请简述前端内容安全策略（CSP）的原理。常见的CSP绕过方式有哪些？请重点讲一下如何利用iframe进行绕过。"
    tags: ["前端安全", "CSP", "漏洞绕过", "XSS防护"]
    difficulty: "hard"
    source: "华为"
    key_points:
      - "CSP原理：通过HTTP响应头（Content-Security-Policy）定义信任源，限制页面能够加载或执行的外部资源（脚本、样式、图片等），从而缓解XSS等攻击"
      - "常见绕过方式：利用JSONP劫持、URL跳转漏洞绕过、不安全的配置（如 unsafe-inline 滥用）、文件上传（如上传含恶意代码的SVG文件）等"
      - "iframe绕过：如果在同源策略下，A页面有严格的CSP，但同源的B页面没有CSP限制，攻击者可以在B页面中利用iframe嵌入并操作A页面的DOM，或者利用没有受到CSP限制的iframe执行恶意代码获取凭据"

  - id: "NW-TQ-HW-008"
    type: "technical"
    question: "请简述SSRF（服务器端请求伪造）漏洞的形成原理。在遇到黑名单防御时有哪些常见的绕过手段？如果使用DNS重绑定（DNS Rebinding）进行绕过，需要设置什么？"
    tags: ["SSRF", "漏洞原理", "网络安全", "DNS重绑定"]
    difficulty: "hard"
    source: "华为"
    key_points:
      - "原理：服务端提供了从外部获取数据的功能但未对目标地址进行严格限制，导致攻击者能以服务器身份向内网或外部发起任意请求"
      - "黑名单绕过手段：使用不同的进制表示IP（如八进制、十六进制）、利用@符号、利用短网址跳转、利用特殊域名（如 xip.io、nip.io）指向内网IP等"
      - "DNS重绑定设置：需要攻击者控制一个恶意DNS服务器，配置域名的TTL极短（如0）。当受害服务器第一次解析时返回一个允许的合法外网IP（通过校验）；随后的实际请求发出前触发第二次解析，恶意DNS将解析结果切换为内网靶机IP，从而绕过检测"

  - id: "NW-TQ-HW-009"
    type: "technical"
    question: "在前端开发或渗透测试中，如果通过 innerHTML 将字符串 `<script>alert(1)</script>` 动态插入到页面中，这段代码能执行吗？为什么？"
    tags: ["前端安全", "XSS", "DOM操作", "JavaScript"]
    difficulty: "medium"
    source: "华为"
    key_points:
      - "结论：直接通过 innerHTML 插入的 `<script>` 标签内的代码**不会**执行"
      - "原因：W3C标准规定，为防范XSS攻击，通过 innerHTML 插入的 script 标签被认为是异步的、非执行的DOM节点，浏览器解析器不会触发执行"
      - "扩展（如何执行）：需要使用带有事件处理的标签（如 `<img src=x onerror=alert(1)>`），或者通过 document.createElement('script') 动态创建并插入节点才能执行"

