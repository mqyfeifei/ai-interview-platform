items:
  - id: "NW-TQ-001"
    type: "technical"
    question: "详细阐述 TCP 三次握手与四次挥手的过程。为什么挥手需要四次？操作系统中大量出现 TIME_WAIT 状态怎么处理？"
    tags: ["网络基础", "TCP/IP", "OS底层"]
    difficulty: "medium"
    source: "Nowcoder" 
    key_points:
      - "握手建立双向序列号同步，挥手因 TCP 全双工特性需分别关闭发送和接收通道"
      - "TIME_WAIT 的两大作用：保证最后 ACK 到达、防止旧连接报文混入新连接（2MSL机制）"
      - "OS层面优化：调整内核参数如 tcp_tw_reuse，开启 syncookies 防御半连接攻击，优化应用程序连接池"

  - id: "NW-TQ-002"
    type: "technical"
    question: "OSPF 和 BGP 的本质区别是什么？在大型网络架构中应该如何组合使用？"
    tags: ["路由协议", "架构选型"]
    difficulty: "medium"
    source: "Classics" 
    key_points:
      - "OSPF 是 IGP（内部网关协议），基于链路状态算法，重在发现拓扑、快速收敛；BGP 是 EGP（外部网关协议），基于路径矢量，重在路由策略控制与大规模路由承载"
      - "组合应用：OSPF 作为底层 Underlay 打通环回口 IP 的连通性，BGP 承载海量业务网段或 VPNv4 路由进行灵活选路"

  - id: "NW-TQ-003"
    type: "technical"
    question: "简述 ARP 协议的工作原理，以及什么是 Proxy ARP 和免费 ARP (Gratuitous ARP)？"
    tags: ["网络基础", "二层协议"]
    difficulty: "easy"
    source: "Nowcoder" 
    key_points:
      - "ARP 通过广播请求、单播应答实现 IP 到 MAC 的地址映射"
      - "免费 ARP：设备主动发送宣告自己的 IP-MAC 映射，常用于 IP 冲突检测或 HA 故障切换时的网关 MAC 刷新"
      - "Proxy ARP：路由器代替目的主机回应 ARP 请求，使不在同物理网段但子网配置错误的主机能够跨路由通信"

  - id: "NW-TQ-004"
    type: "technical"
    question: "深入理解 STP（生成树协议），RSTP 相比传统 STP 做了哪些优化实现了快速收敛？"
    tags: ["交换技术", "防环机制"]
    difficulty: "hard"
    source: "Classics" 
    key_points:
      - "传统 STP 依赖定时器（Max Age/Forward Delay）导致拓扑收敛极慢（30s-50s）"
      - "RSTP 引入了 P/A（Proposal/Agreement）握手协商机制，实现极速端口状态切换"
      - "增加 Alternate 端口（根端口备份）和 Backup 端口（指定端口备份），边缘端口（Edge Port）机制避免接入终端引起拓扑震荡"

  - id: "NW-TQ-005"
    type: "technical"
    question: "解释 IPsec VPN 中的 IKE 阶段一与阶段二分别承担什么任务？"
    tags: ["网络安全", "VPN"]
    difficulty: "medium"
    source: "Nowcoder" 
    key_points:
      - "阶段一（Main/Aggressive Mode）：建立 ISAKMP SA，完成对等体身份双向认证，并通过 DH 算法安全交换密钥素材，构建一个安全的保护隧道"
      - "阶段二（Quick Mode）：在阶段一的安全隧道内协商 IPsec SA 参数（如加密算法 AES、认证算法 SHA），定义要保护的感兴趣数据流"

  - id: "NW-TQ-006"
    type: "technical"
    question: "Ping 和 Traceroute 的底层实现原理是什么？"
    tags: ["网络基础", "故障排查"]
    difficulty: "easy"
    source: "Classics" 
    key_points:
      - "Ping 发送 ICMP Echo Request 并等待 Echo Reply 计算时延与连通性"
      - "Traceroute（Windows的tracert）通过递增 IP 报文的 TTL 值，促使沿途路由器返回 ICMP Time Exceeded 报文，从而描绘出完整的数据包转发跳数路径"

  - id: "NW-TQ-007"
    type: "technical"
    question: "什么是 BGP 路由黑洞问题？有哪些常用的解决方案？"
    tags: ["BGP", "疑难排障"]
    difficulty: "hard"
    source: "Classics" 
    key_points:
      - "产生原因：BGP 路由已跨越非 BGP 路由器传递，导致中间路由器收到数据包时查无匹配路由直接丢弃"
      - "传统方案：路由重分发（将 BGP 引入 OSPF，有极大的路由表膨胀风险）或 BGP 全连接（Full Mesh）"
      - "现代最佳实践：引入 MPLS LDP 构建标签交换隧道，数据包通过标签栈跨越中间设备（无需查找 IP 路由表）"

  - id: "NW-TQ-008"
    type: "technical"
    question: "描述一个数据包从 PC（局域网）发送到外网服务器，最终收到响应的完整生命周期（涉及 DNS、ARP、NAT、路由寻址）。"
    tags: ["综合题", "数据流向"]
    difficulty: "hard"
    source: "Personal_Notes" 
    key_points:
      - "DNS 解析：检查本地/OS缓存，无缓存则向 DNS 服务器发 UDP 请求获取服务器 IP"
      - "封装与 ARP：判断目的 IP 非同网段，查找默认网关 MAC 封装二层帧（缺网关 MAC 时发 ARP 请求）"
      - "路由转发：网关解封装二层，查路由表选路，途经 NAT 网关替换源 IP/端口记录会话映射"
      - "TCP通信：三次握手建立后传输数据，回程包经 NAT 解码转换回局域网 IP，最终由网关投递至 PC"

  - id: "NW-TQ-009"
    type: "technical"
    question: "详细描述 TCP 的拥塞控制机制，包括慢启动、拥塞避免、快速重传和快速恢复阶段。"
    tags: ["网络基础", "TCP/IP"]
    difficulty: "hard"
    source: "Classics" 
    key_points:
      - "慢启动：拥塞窗口(cwnd)指数级增长，直到达到慢启动阈值(ssthresh)"
      - "拥塞避免：到达阈值后cwnd呈线性增长，避免网络过载"
      - "快速重传：收到3个重复的ACK时，不等待超时直接重传丢失的报文段"
      - "快速恢复：将ssthresh减半，cwnd设为新的ssthresh，然后执行拥塞避免算法"

  - id: "NW-TQ-010"
    type: "technical"
    question: "VLAN 和 VXLAN 有什么区别？为什么在现代数据中心网络中普遍采用 VXLAN？"
    tags: ["数据中心", "虚拟化网络", "VXLAN"]
    difficulty: "medium"
    source: "Nowcoder" 
    key_points:
      - "规模限制：VLAN 的 ID 只有 12 位（最多 4096 个），而 VXLAN 的 VNI 有 24 位（支持千万级别），满足多租户隔离需求"
      - "底层网络：VLAN 依赖二层 STP 树，容易出现广播风暴；VXLAN 基于 MAC-in-UDP 封装，可以跨越三层网络实现大二层互通（Overlay）"
      - "多路径：VXLAN 利用 UDP 源端口哈希可以在底层 IP 网络中实现 ECMP（等价多路径），极大提高带宽利用率"

  - id: "NW-TQ-011"
    type: "technical"
    question: "简述 HTTP/1.1、HTTP/2 和 HTTP/3 的演进过程及其核心优化点。"
    tags: ["应用层协议", "HTTP"]
    difficulty: "medium"
    source: "Personal_Notes" 
    key_points:
      - "HTTP/1.1：引入长连接(Keep-Alive)和管道化，但存在队头阻塞(Head-of-Line Blocking)问题"
      - "HTTP/2：采用二进制分帧、多路复用（解决HTTP层队头阻塞）、头部压缩(HPACK)和服务器推送"
      - "HTTP/3：弃用 TCP，底层改用基于 UDP 的 QUIC 协议，彻底解决 TCP 层面的队头阻塞，并实现了更快的连接建立（0-RTT）"

  - id: "NW-TQ-012"
    type: "technical"
    question: "四层负载均衡与七层负载均衡的原理有何不同？各自的适用场景是什么？"
    tags: ["架构设计", "负载均衡"]
    difficulty: "medium"
    source: "Classics" 
    key_points:
      - "四层基于 IP + 端口进行转发（如 LVS、HAProxy），不解析应用层数据，仅修改报文目标地址/MAC，性能极高"
      - "七层基于应用层内容（如 HTTP URL、Cookie、头部信息）进行路由（如 Nginx），需建立完整 TCP 连接，功能丰富但消耗 CPU"
      - "适用场景：四层适合承受大流量的基础网关入口；七层适合微服务网关、API 路由分发及需要 WAF 过滤的场景"

  - id: "NW-TQ-013"
    type: "technical"
    question: "详细剖析 HTTPS/TLS 1.2 的握手过程，对称加密与非对称加密是如何配合使用的？"
    tags: ["网络安全", "HTTPS", "TLS"]
    difficulty: "hard"
    source: "Nowcoder" 
    key_points:
      - "ClientHello/ServerHello：协商 TLS 版本号、加密套件（Cipher Suite）及交换随机数"
      - "证书验证：服务器发送数字证书，客户端验证证书链的合法性并提取公钥"
      - "密钥交换：利用非对称加密（如 RSA）或 DH 算法安全交换密钥素材，随后双方结合之前的随机数生成相同的对称加密密钥（会话密钥）"
      - "后续通信：握手完成后，数据传输阶段全面采用生成的对称密钥进行加密，兼顾安全与性能"

  - id: "NW-TQ-014"
    type: "technical"
    question: "在 BGP 网络中，为什么需要引入路由反射器（Route Reflector，RR）？它如何防环？"
    tags: ["路由协议", "BGP"]
    difficulty: "hard"
    source: "Classics" 
    key_points:
      - "背景：IBGP 为了防环默认存在“水平分割”原则，导致 IBGP 节点间需要建立全连接（Full-Mesh），扩展性极差"
      - "作用：路由反射器允许将学习到的 IBGP 路由反射给其他客户端，打破水平分割限制，大幅降低 TCP 连接数量"
      - "防环机制：引入了 Originator_ID（路由始发者 Router ID）和 Cluster_List（经过的反射器簇列表）两个 BGP 路径属性来检测和防止路由环路"

  - id: "NW-TQ-015"
    type: "technical"
    question: "简述 DHCP 协议分配 IP 地址的 DORA 过程。如果客户端与 DHCP 服务器不在同一个网段怎么办？"
    tags: ["网络基础", "应用层协议"]
    difficulty: "easy"
    source: "Nowcoder" 
    key_points:
      - "DORA 过程：Discover（广播寻找） -> Offer（服务器提供IP） -> Request（客户端请求确认） -> ACK（服务器最终确认）"
      - "跨网段解决：使用 DHCP Relay（DHCP 中继），将客户端的广播 Discover 报文转换为单播报文发送给目标服务器，跨越路由器边界"

  - id: "NW-TQ-016"
    type: "technical"
    question: "IPv4 向 IPv6 过渡的技术主要分为哪几类？简述双栈、隧道和 NAT64 技术。"
    tags: ["网络层协议", "IPv6"]
    difficulty: "medium"
    source: "Classics" 
    key_points:
      - "双栈技术（Dual Stack）：节点同时运行 IPv4 和 IPv6 协议栈，兼容性最好，但仍然需要消耗公共 IPv4 地址"
      - "隧道技术（Tunneling）：将 IPv6 数据包封装在 IPv4 报文中穿越 IPv4 网络（如 GRE 隧道、6to4 隧道）"
      - "协议转换（NAT64/DNS64）：在 IPv6 孤岛和 IPv4 网络之间进行地址和协议层的动态转换，解决纯 IPv6 主机访问 IPv4 资源的问题"

  - id: "NW-TQ-017"
    type: "technical"
    question: "SD-WAN（软件定义广域网）相比传统专线网络（如 MPLS VPN）有哪些核心优势？"
    tags: ["SDN", "广域网架构"]
    difficulty: "medium"
    source: "Personal_Notes" 
    key_points:
      - "控制与转发分离：通过集中式的控制器进行全局策略下发，简化分支站点的部署与运维（支持零接触部署 ZTP）"
      - "混合链路与智能选路：整合 MPLS、Internet、5G 多种链路，根据应用的 SLA（时延、丢包率）动态进行应用层感知选路"
      - "成本与安全：利用廉价的 Internet 替代部分昂贵专线带宽，并内置全网自动化 IPsec 保障数据安全"

  - id: "NW-TQ-018"
    type: "technical"
    question: "在网络 QoS（服务质量）中，流量监管（Policing）和流量整形（Shaping）有什么区别？"
    tags: ["网络优化", "QoS"]
    difficulty: "medium"
    source: "Classics" 
    key_points:
      - "流量监管（Policing）：对超出约定速率的流量直接丢弃或重标记，不引入额外延迟，通常应用于网络入方向（Ingress）"
      - "流量整形（Shaping）：将超出约定速率的流量缓存到队列中，使流量输出平滑，会引入缓冲延迟，必须且只能应用于网络出方向（Egress）"
      - "实现机制：两者通常都基于令牌桶算法（Token Bucket，如单速单桶、双速双桶）来进行流量速率评估"

  - id: "NW-TQ-019"
    type: "technical"
    question: "什么是 MTU 和 MSS？如果 MTU 设置不合理会导致什么网络问题？"
    tags: ["网络基础", "疑难排障"]
    difficulty: "medium"
    source: "Nowcoder" 
    key_points:
      - "MTU（最大传输单元）：数据链路层对载荷的限制。MSS（最大报文段长度）：TCP 层协商的单次最大数据量，通常为 MTU - IP头(20) - TCP头(20)"
      - "黑洞问题：如果中间链路存在较小的 MTU 且报文设置了 DF（不分片），设备会丢弃报文。若 ICMP 报错被防火墙拦截，会导致 TCP 握手成功但无法传输数据"
      - "解决思路：在网络设备上开启 TCP MSS Clamping，动态修改 TCP SYN 包中的 MSS 值，避免底层 IP 分片或丢包"

  - id: "NW-TQ-020"
    type: "technical"
    question: "简述 VRRP（虚拟路由冗余协议）的工作原理及其在网关高可用中的作用。"
    tags: ["高可用机制", "冗余协议"]
    difficulty: "easy"
    source: "Classics" 
    key_points:
      - "将多台物理路由器组合成一台虚拟路由器，对外提供一个统一的虚拟 IP (VIP) 和虚拟 MAC，作为局域网主机的默认网关"
      - "Master 路由器承担数据转发并定期发 VRRP 组播报文，Backup 监听；Master 宕机时，Backup 快速接管 VIP"
      - "支持与上行链路探测（如 Track/BFD）联动，实现因上层链路故障时的主备快速倒换"

  - id: "NW-TQ-021"
    type: "technical"
    question: "交换机的 MAC 地址表、主机的 ARP 表以及路由器的路由表分别记录什么信息？有何协作联系？"
    tags: ["网络基础", "数据转发"]
    difficulty: "easy"
    source: "Personal_Notes" 
    key_points:
      - "MAC地址表：记录目标 MAC 地址与交换机物理接口的映射关系，用于二层局域网内帧的精确转发"
      - "ARP表：记录同一网段内 IP 地址与 MAC 地址的映射关系，主要用于封装二层帧头"
      - "路由表：记录目的网段与下一跳 IP 及出接口的映射，用于跨网段的三层路径选择"
      - "协作：跨网段通信时，先查路由表确定下一跳 IP，再查 ARP 表获取下一跳 MAC，最后经交换机查 MAC 表送达硬件设备"

  - id: "NW-TQ-022"
    type: "technical"
    question: "状态检测防火墙（Stateful Firewall）与传统包过滤防火墙相比，优势在哪里？"
    tags: ["网络安全", "防火墙"]
    difficulty: "medium"
    source: "Nowcoder" 
    key_points:
      - "包过滤防火墙：仅基于五元组静态检查每个数据包，无法感知 TCP 会话状态，配置复杂且易被伪造包绕过"
      - "状态检测：监控并维护连接状态表（Session Table），首包验证建立会话后，后续报文只需快速匹配状态表即可放行"
      - "优势：极大提升了吞吐性能，同时能有效防范非法的状态报文攻击（如无握手的 ACK/RST 报文注入），安全性更高"

  - id: "NW-TQ-023"
    type: "technical"
    question: "常见的网络层 DDoS 攻击有哪些？针对 SYN Flood 攻击，目前主流的防御手段有哪些？"
    tags: ["网络安全", "DDoS防御"]
    difficulty: "hard"
    source: "Personal_Notes" 
    key_points:
      - "常见攻击：SYN Flood、UDP Flood、ICMP Flood，以及基于 UDP 的反射放大攻击（如 DNS/NTP 反射）"
      - "SYN Flood 原理：黑客伪造源 IP 狂发 SYN 包，耗尽目标服务器的半连接队列（SYN Queue），导致正常用户无法建连"
      - "防御手段：服务器开启 TCP SYN Cookies（推迟分配资源）；前置 DDoS 流量清洗设备（首包丢弃验证、源认证反向探测）"

  - id: "NW-TQ-024"
    type: "technical"
    question: "如何理解“零信任网络（Zero Trust Network）”架构？它与传统边界安全模型有何本质区别？"
    tags: ["前沿技术", "网络安全", "零信任"]
    difficulty: "medium"
    source: "Personal_Notes" 
    key_points:
      - "传统边界安全：基于“内网即安全”理念，一旦通过边界 VPN 接入内网，即获得广泛的横向访问权限"
      - "零信任核心：持续验证，永不信任（Never trust, always verify），不再以网络 IP 位置作为信任依据"
      - "关键机制：身份认证（IAM）、细粒度微隔离（Micro-segmentation）、设备终端状态评估及持续的动态访问控制"

  - id: "NW-TQ-025"
    type: "technical"
    question: "简述 OSPF 路由协议中常见的几种 LSA（链路状态通告）类型及其作用。"
    tags: ["路由协议", "OSPF"]
    difficulty: "hard"
    source: "Classics" 
    key_points:
      - "Type 1 (Router LSA)：每台路由器产生，描述自身接口状态与开销，仅在本区域泛洪"
      - "Type 2 (Network LSA)：由 DR 产生，描述多路访问网段的拓扑，仅在本区域泛洪"
      - "Type 3 (Summary LSA)：由 ABR 产生，将某个区域的路由汇总通告给其他区域，实现跨区传递"
      - "Type 4 & Type 5：描述到达 ASBR 的路径，以及 ASBR 引入的外部协议路由（如静态/BGP）"

  - id: "NW-TQ-026"
    type: "technical"
    question: "在双出口或多出口网络架构中，什么是“来回路径不一致（非对称路由）”？会导致什么问题，如何解决？"
    tags: ["架构设计", "疑难排障"]
    difficulty: "hard"
    source: "Personal_Notes" 
    key_points:
      - "现象：报文从接口 A 发出，但响应报文从接口 B 接收，导致请求和回程路径不同"
      - "导致的问题：若途径状态检测防火墙或 NAT 设备，回程包会因无法匹配本地 Session 表项被直接丢弃，导致网络不通"
      - "解决方案：通过 BGP MED/Local Pref 调整选路；或在防火墙开启非对称路由放行（牺牲安全性）；最佳为应用策略路由（PBR）强制源进源出"

  - id: "NW-TQ-027"
    type: "technical"
    question: "BGP 属性中，Local Preference (本地优先级) 和 MED (多出口鉴别器) 在控制流量走向时的区别是什么？"
    tags: ["BGP", "路由策略"]
    difficulty: "medium"
    source: "Classics" 
    key_points:
      - "Local Preference：控制 AS 内部路由器如何离开本 AS（控制出站流量），值越大越优，仅在 IBGP 邻居间传递"
      - "MED：相当于路由的 Metric，用于建议相邻外部 AS 如何进入本 AS（控制入站流量），值越小越优，在相邻 AS 间起作用"
      - "选路原则：在 BGP 十三条选路规则中，Local Preference 的比较优先级（第2步）远高于 MED（第6步）"

  - id: "NW-TQ-028"
    type: "technical"
    question: "简述 IPSec VPN 中的 NAT 穿越（NAT-T）技术解决的是什么问题？"
    tags: ["网络安全", "VPN", "IPSec"]
    difficulty: "hard"
    source: "Personal_Notes" 
    key_points:
      - "冲突原因：IPSec ESP 协议没有端口号概念，传统 PAT（端口地址转换）无法对其做源端口转换；且 NAT 修改外层 IP 会破坏 ESP 完整性校验"
      - "NAT-T原理：在 IKE 协商阶段检测沿途是否存在 NAT。若存在，则在 ESP 报文外部额外封装一层 UDP 头部（默认端口 4500）"
      - "效果：通过 UDP 封装，中间的 NAT 设备可以基于 UDP 端口进行正常的 PAT 转换，使 IPSec 流量顺利穿越"

  - id: "NW-TQ-029"
    type: "technical"
    question: "在企业网中，什么是生成树（STP）的 BPDU Guard（BPDU 保护）和 Root Guard（根保护）机制？"
    tags: ["交换技术", "网络安全"]
    difficulty: "medium"
    source: "Personal_Notes" 
    key_points:
      - "BPDU Guard：配置在接入层边缘端口上，当该端口收到恶意的 BPDU 报文时，直接将其置为 Error-Down 状态，防止伪造交换机接入引发拓扑震荡"
      - "Root Guard：配置在指定的下联端口上，若收到更优的 BPDU 试图抢占根桥，端口会进入 Inconsistent 状态，保护核心层根桥地位不被剥夺"

  - id: "NW-TQ-030"
