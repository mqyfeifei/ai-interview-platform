      - "写SSH公钥：条件是Redis运行在root权限且开启了SSH服务。流程：将本地公钥写入Redis的某个Key，通过 `config set dir /root/.ssh` 和 `config set dbfilename authorized_keys`，最后 `save` 实现免密登录"
