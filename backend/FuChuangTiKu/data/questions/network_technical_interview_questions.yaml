  - id: "NW-TQ-052"
    type: "technical"
    question: "请分别解释一下短轮询（Short Polling）和长轮询（Long Polling）的概念，并比较它们的优缺点。"
    tags: ["HTTP", "网络通信", "轮询机制"]
    difficulty: "medium"
    source: "Personal_Notes"
    key_points:
      - "短轮询是客户端定时向服务端发起请求，无论有无新数据，服务端都会立刻响应，容易造成网络带宽和服务器资源的浪费。"
      - "长轮询是客户端发起请求后，如果没有数据，服务端会挂起请求保持连接，直到有新数据或到达超时时间才返回。"
      - "长轮询减少了无效的网络交互，但在高并发且长时间无数据的情况下会占用大量服务器连接数。"

