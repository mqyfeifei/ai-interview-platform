    key_points:
      - "安全隔离：如果 Root CA 直接签发，一旦其私钥泄露，整个信任体系崩溃。通过中间 CA 签发，可以缩小安全风险范围"
      - "中间 CA 私钥泄露只需吊销中间证书，根证书仍然安全"
      - "层级化管理：减轻根 CA 的压力，提高签发效率"

