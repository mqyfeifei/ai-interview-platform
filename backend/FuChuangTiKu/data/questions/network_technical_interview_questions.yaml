      - "TCP：面向连接、可靠传输、有流量控制和拥塞控制。适用于对数据准确性要求高的场景（如HTTP请求、文件传输）"
      - "UDP：无连接、不可靠、头部开销小、传输速度快。适用于对实时性要求高的场景（如视频通话、直播、在线游戏）"

  - id: "NW-TQ-ZX-017"
    type: "technical"
    question: "请谈谈你了解的软件测试方法有哪些？（如黑盒测试、白盒测试等）"
    tags: ["软件测试", "工程方法", "测试理论"]
    difficulty: "easy"
    source: "中兴通讯"
    key_points:
      - "黑盒测试：不关注内部代码逻辑，仅通过输入输出来验证功能需求（如等价类划分、边界值分析）"
      - "白盒测试：深入代码内部，测试内部逻辑结构和执行路径（如语句覆盖、分支覆盖）"
      - "其他分类方式：单元测试、集成测试、系统测试、性能/压力测试等"

  - id: "NW-TQ-ZX-018"
    type: "technical"
    question: "如果有一个输入框要求输入姓名为1-20个字母，你会如何设计测试用例来验证其功能？"
    tags: ["软件测试", "测试用例设计", "边界值分析"]
    difficulty: "medium"
    source: "中兴通讯"
    key_points:
      - "等价类验证：输入合法长度的字母（如5个字母），非字母字符（数字、符号、中文）"
      - "边界值验证：输入1个字母、20个字母（边界内合法）；输入0个、21个字母（越界拦截）"
      - "异常用例：输入空字符串、包含空格、首尾带空格等场景的健壮性验证"

  - id: "NW-TQ-ZX-019"
    type: "technical"
    question: "请简述后端服务与数据库建立连接的常见原理及方式，并谈谈连接池的作用？"
    tags: ["数据库", "连接池", "后端开发"]
    difficulty: "medium"
    source: "中兴通讯"
    key_points:
      - "底层依赖TCP网络连接及数据库专属协议（如MySQL基于JDBC驱动）进行通信"
      - "直连方式在每次请求时都进行TCP三次握手和连接销毁，开销极大"
      - "连接池的作用：预先创建并复用数据库连接，避免频繁创建销毁造成的性能损耗，同时支持连接数量控制防止数据库被打挂"

  - id: "NW-TQ-ZX-020"
    type: "technical"
    question: "请谈谈你对线程安全的理解？在多线程环境下如何保证线程安全？"
    tags: ["多线程", "并发编程", "线程安全"]
    difficulty: "medium"
    source: "中兴通讯"
    key_points:
      - "理解定义：多个线程同时访问共享资源时，系统仍能保证数据状态的正确性和一致性"
      - "保证机制1：互斥同步，使用锁机制（如 synchronized、ReentrantLock）"
      - "保证机制2：非阻塞同步，使用CAS无锁操作（如 Atomic 类）"
      - "保证机制3：避免共享状态，使用 ThreadLocal 实现线程内的数据隔离"

  - id: "NW-TQ-ZX-021"
    type: "technical"
    question: "什么是等价类划分测试法？请举例说明其在实际测试中的应用。"
    tags: ["软件测试", "测试方法", "等价类"]
    difficulty: "easy"
    source: "中兴通讯"
    key_points:
      - "定义：将输入数据的范围划分为若干个等价类，每个等价类中选取少数代表性数据进行测试"
      - "分类：包含有效等价类（符合业务规则的合理输入）和无效等价类（不合理的非法输入）"
      - "举例：要求输入0-100的分数。有效等价类为 [0,100] 中的任意值；无效等价类为 <0 的数和 >100 的数"

  - id: "NW-TQ-ZX-022"
    type: "technical"
    question: "你在平时的开发或学习中经常使用Linux吗？常用的Linux命令有哪些？"
    tags: ["Linux", "基础命令", "操作系统"]
    difficulty: "easy"
    source: "中兴通讯"
    key_points:
      - "文件与目录操作：ls, cd, pwd, mkdir, rm, cp, mv"
      - "系统状态与进程排查：top, ps, kill, free, df"
      - "网络与日志排查：ping, netstat, tail, grep, awk"

  - id: "NW-TQ-ZX-023"
    type: "technical"
    question: "线程不安全会导致哪些不良影响或具体问题？请举例说明。"
    tags: ["多线程", "并发编程", "线程安全"]
    difficulty: "medium"
    source: "中兴通讯"
    key_points:
      - "数据脏读或更新丢失（如多个线程同时累加计数器，导致最终数值偏小）"
      - "数据状态不一致（如并发扣减库存导致超卖现象）"
      - "死锁问题导致系统线程阻塞，资源耗尽，服务不可用"

  - id: "NW-TQ-ZX-024"
    type: "technical"
    question: "在开发或部署环境中为什么要使用虚拟机（或容器化技术）？它能带来哪些好处？"
    tags: ["运维", "虚拟机", "容器化"]
    difficulty: "medium"
    source: "中兴通讯"
    key_points:
      - "环境隔离：避免不同应用间的依赖冲突，保证测试与生产环境的一致性"
      - "资源利用率高：将一台物理机抽象为多个隔离实例，最大化利用硬件资源"
      - "快速部署与恢复：虚拟机/容器镜像方便复制、迁移和快速扩缩容"

  - id: "NW-TQ-ZX-025"
    type: "technical"
    question: "你认为像微信视频电话这样的实时音视频通信，底层主要使用的是什么网络协议？为什么？"
    tags: ["计算机网络", "UDP协议", "流媒体通信"]
    difficulty: "medium"
    source: "中兴通讯"
    key_points:
      - "核心底层主要基于 UDP 协议进行传输"
      - "原因在于音视频通信对低延迟和实时性要求极高，TCP的握手和拥塞重传机制会导致严重的延迟和卡顿"
      - "丢掉少量的音视频帧（UDP不可靠的特性）通常不会严重影响用户的主观体验"

  - id: "NW-TQ-ZX-026"
    type: "technical"
    question: "在网络传输中，直接明文传输JSON数据（即“裸奔”）会有什么安全隐患？应该如何防范？"
    tags: ["网络安全", "数据加密", "HTTPS"]
    difficulty: "medium"
    source: "中兴通讯"
    key_points:
      - "隐患：容易遭受中间人攻击（MITM），导致敏感数据（如密码、个人隐私）被窃听、篡改或重放攻击"
      - "网络层防范：全面升级并使用 HTTPS 协议进行传输（TLS/SSL加密通信隧道）"
      - "应用层防范：对核心敏感字段（如密码、身份证）在前端进行不可逆哈希或非对称加密后再包裹进JSON传输"

  - id: "NW-TQ-ZX-027"
    type: "technical"
    question: "请简述DC-DC（直流-直流转换器）和LDO（低压差线性稳压器）的基本原理以及它们之间的主要区别？"
    tags: ["硬件基础", "通信电子", "电源管理"]
    difficulty: "medium"
    source: "中兴通讯"
    key_points:
      - "LDO：通过调整内部晶体管的压降来稳定输出电压。优点是纹波小、外围电路简单；缺点是效率低，主要用于降压且压差较小的场景"
      - "DC-DC：通过高频开关动作配合电感、电容储能来转换电压。优点是效率高、支持升压/降压/反相等；缺点是纹波较大、电路复杂"
      - "应用选择依据负载电流、压差大小及对噪声敏感程度来决定"

  - id: "NW-TQ-ZX-028"
    type: "technical"
    question: "请详细说明OSI模型中网络层和传输层的主要功能及其核心协议的区别？"
    tags: ["计算机网络", "OSI模型", "网络层", "传输层"]
    difficulty: "medium"
    source: "中兴通讯"
    key_points:
      - "网络层：主要负责逻辑寻址（IP地址）和路由选择，解决主机到主机的通信问题。核心协议：IP、ICMP、ARP等"
      - "传输层：主要负责端到端的通信（端口号），提供可靠或不可靠的数据交付机制。核心协议：TCP、UDP等"
      - "区别在于网络层解决“包裹怎么送达目标主机”，传输层解决“包裹交给目标主机的哪个具体应用程序”"

  - id: "NW-TQ-ZX-029"
    type: "technical"
    question: "请简述数据链路层的主要功能和作用是什么？"
    tags: ["计算机网络", "OSI模型", "数据链路层"]
    difficulty: "medium"
    source: "中兴通讯"
    key_points:
      - "负责相邻节点之间的数据帧传输（基于MAC地址寻址）"
      - "提供数据成帧（Framing）、物理寻址机制"
      - "包含差错检测（如CRC校验）和介质访问控制（MAC，如CSMA/CD）功能"
