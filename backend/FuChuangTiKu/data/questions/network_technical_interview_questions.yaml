    type: "technical"
    question: "为什么说 HTTP 的无状态特性是一把双刃剑？请结合实际系统设计分析其利弊。"
    tags: ["HTTP", "无状态", "系统架构"]
    difficulty: "medium"
    source: "Personal_Notes"
    key_points:
      - "利：服务器无需维护大量用户的上下文状态，极大减轻了服务器内存压力，且非常容易实现水平扩展和负载均衡。"
      - "弊：在需要上下文连贯的业务（如购物车、登录状态）中，每次请求都必须携带冗长的身份验证信息，增加了网络负载。"

  - id: "NW-TQ-058"
    type: "technical"
    question: "请讲解一下 Linux 系统是如何收发网络数据包的？描述从网卡接收到数据到用户态应用程序读取的完整流转过程。"
    tags: ["Linux", "网络栈", "底层原理", "中断处理"]
    difficulty: "hard"
    source: "Personal_Notes"
    key_points:
      - "网卡接收到光电信号转为数据帧，通过 DMA 复制到内存（Ring Buffer），并向 CPU 发起硬中断。"
      - "CPU 处理硬中断，触发软中断恢复执行网络协议栈的耗时处理流程（NAPI机制）。"
      - "数据包依次剥离 MAC 头（链路层）、IP 头（网络层）、TCP/UDP 头（传输层），最终放入 Socket 接收缓冲区供用户态应用程序调用。"

  - id: "NW-TQ-059"
    type: "technical"
    question: "请详细描述一下 HTTPS 的 TLS 握手过程，特别是 ClientHello 和 ServerHello 阶段，双方分别发送了哪些关键信息？"
    tags: ["HTTPS", "TLS握手", "网络安全"]
    difficulty: "hard"
    source: "Personal_Notes"
    key_points:
      - "ClientHello：客户端发送支持的 TLS 版本、密码套件列表（Cipher Suites）以及客户端生成的随机数（Client Random）。"
      - "ServerHello：服务器回复选定的 TLS 版本和密码套件、服务器端生成的随机数（Server Random）。"
      - "服务器紧接着会发送自己的数字证书供客户端校验，以防止中间人攻击。"

  - id: "NW-TQ-060"
    type: "technical"
    question: "请解释摘要算法和数字签名的区别与联系？在 HTTPS 证书校验中，它们是如何配合保证数据完整性和不可否认性的？"
    tags: ["HTTPS", "加密算法", "数字签名"]
    difficulty: "medium"
    source: "Personal_Notes"
    key_points:
      - "摘要算法（如 SHA-256）是单向不可逆的，用于生成数据的唯一指纹，保证内容未被篡改（完整性）。"
      - "数字签名是使用私钥对摘要进行加密的产物，证明数据确由私钥持有者发出（不可否认性）。"
      - "在 HTTPS 中，CA 机构用自己的私钥对服务器的公钥及信息摘要进行签名；客户端用操作系统内置的 CA 公钥解密验证，从而确认服务器身份的合法性。"

  - id: "NW-TQ-HW-001"
