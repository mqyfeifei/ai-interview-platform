  - id: "NW-TQ-ZX-001"
    type: "technical"
    question: "请详细说明DC-DC和LDO的工作原理，并对比它们之间的主要区别及各自的适用场景？"
    tags: ["硬件电路", "电源管理", "DC-DC", "LDO"]
    difficulty: "medium"
    source: "中兴通讯"
    key_points:
      - "LDO（低压差线性稳压器）工作原理：利用内部晶体管工作在线性区，通过调整导通压降来稳定输出电压，仅支持降压"
      - "DC-DC（直流转换器）工作原理：通过内部开关管的高频开关动作，配合外部电感、电容进行储能和滤波实现电压转换，支持降压(Buck)、升压(Boost)及反相"
      - "核心区别：LDO具有纹波极小、噪声低、外围电路简单的特点，但输入输出压差大时效率低下且发热严重；DC-DC转换效率极高（尤其在大压降时）、支持大电流输出，但开关噪声大、纹波较大且外围电路设计相对复杂"
      - "适用场景：LDO适用于对电源噪声极度敏感、压降小且功耗要求不高的模拟/射频电路；DC-DC适用于大压差、大功率以及对转换效率要求极高的数字逻辑主电源供电"

