    difficulty: "hard"
    source: "Personal_Notes"
    key_points:
      - "利用长连接（Keep-Alive）复用 TCP 连接，减少握手和挥手开销。"
      - "减少请求次数：资源合并（如CSS/JS压缩合并）、使用雪碧图（Sprite）或按需懒加载。"
      - "使用缓存策略（强缓存与协商缓存），避免重复拉取相同资源。"
      - "服务器端开启 Gzip/Brotli 压缩，减小传输体积。"

