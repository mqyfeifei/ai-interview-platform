      - "体现出对服务间通信（如RPC/HTTP）、服务治理及分布式问题的理解"

  - id: "BE-PD-HW-005"
    type: "project_deep_dive"
    question: "你的项目中涉及到状态转移，且是通过事件来观测是否实现。请问具体是如何判断该事件是否成功触发并完成状态扭转的？"
