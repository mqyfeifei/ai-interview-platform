items:
  - id: "BE-PQ-001"
    type: "project_deep_dive"
    question: "请介绍你项目的业务背景、目标用户、核心指标和当前阶段。"
    tags: ["项目背景", "业务理解"]
    difficulty: "easy"
    source: "Interview_Bank" 
    key_points:
      - "清晰的STAR法则描述"
      - "说清痛点和业务背景"
      - "能够明确自己的贡献所带来的具体量化业务指标(如QPS带来多大提升，成本降了多少)"
  - id: "BE-PQ-002"
    type: "project_deep_dive"
    question: "你在项目中负责的模块边界是什么？如何与上下游协作？"
    tags: ["职责边界", "协作"]
    difficulty: "easy"
    source: "Interview_Bank" 
    key_points:
      - "厘清自身的职责和开发边界"
      - "清晰展示出如何与上游(网关/端)和下游(DBA/基础架构)协作"
      - "展现出主动承担及突破边界的加分项"
  - id: "BE-PQ-003"
    type: "project_deep_dive"
    question: "系统整体架构是怎样的？请画出关键调用链路。"
    tags: ["系统架构", "调用链"]
    difficulty: "medium"
    source: "Interview_Bank" 
    key_points:
      - "具备全局视野，能画清楚合理的系统分层架构(接入、逻辑、数据)"
      - "流畅讲述一次核心请求(如一次下单)从端到端打通的完成链路图"
  - id: "BE-PQ-004"
    type: "project_deep_dive"
    question: "你们为什么选择当前技术栈？有哪些备选方案，如何权衡？"
    tags: ["技术选型", "权衡"]
    difficulty: "medium"
    source: "Interview_Bank" 
    key_points:
      - "体现出技术雷达深度(不仅只知道这个)"
      - "展现选型的妥协与权衡(基于团队熟悉度、交付周期、社区活跃度等客观对比)"
  - id: "BE-PQ-005"
    type: "project_deep_dive"
    question: "项目中遇到过最复杂的线上问题是什么？如何定位与修复？"
    tags: ["线上问题", "排障"]
    difficulty: "hard"
    source: "Interview_Bank" 
    key_points:
      - "复杂度的真实性(死锁、并发异常、内存泄漏、脏数据穿透等)"
      - "排障工具的使用熟练度(SkyWalking链路/Arthas)"
      - "根因分析到位并形成修复反馈闭环(如沉淀为Code Review规范)"
  - id: "BE-PQ-006"
    type: "project_deep_dive"
    question: "你如何做性能优化？优化前后数据对比如何？"
    tags: ["性能优化", "指标"]
    difficulty: "medium"
    source: "Interview_Bank" 
    key_points:
      - "通过火焰图或压测发现热点函数的切入点"
      - "实施了分步骤优化(如：加缓存、改异步、SQL加索引)"
      - "拥有前后对照的量化数据(例如响应时间从2s降低到300ms)"
  - id: "BE-PQ-007"
    type: "project_deep_dive"
    question: "你们如何保证接口幂等、数据一致性与事务正确性？"
    tags: ["一致性", "幂等"]
    difficulty: "hard"
    source: "Interview_Bank" 
    key_points:
      - "保证了多次重试请求依然一致的幂等设计(Token/唯一键)"
      - "使用正确的手段保证事务(分布式事务如RocketMQ事务消息或Seata)"
      - "资金/库存等敏感数据的并发锁兜底机制"
  - id: "BE-PQ-008"
    type: "project_deep_dive"
    question: "项目中的缓存策略是什么？如何处理缓存与数据库双写一致性？"
    tags: ["缓存", "一致性"]
    difficulty: "hard"
    source: "Interview_Bank" 
    key_points:
      - "明确采用双写还是CacheAside(先写DB再删缓存)策略"
      - "面对并发或异常导致脏数据的对策(基于Binlog同步更新、延时双删)"
      - "讲述如何面对极端突发流量(热点分散/多级缓存)"
  - id: "BE-PQ-009"
    type: "project_deep_dive"
    question: "你们的监控告警体系如何设计？关键 SLI/SLO 指标有哪些？"
    tags: ["可观测性", "监控"]
    difficulty: "medium"
    source: "Interview_Bank" 
    key_points:
      - "全链路监控(Tracing)机制能快速追踪链路节点"
      - "完备的Metrics度量设计(TP99, 错误率, Http状态码监控)"
      - "合理的告警层级及阈值，防止狼来了效应导致团队脱敏"
  - id: "BE-PQ-010"
    type: "project_deep_dive"
    question: "如果让你重做一次该项目，你会如何重构架构与流程？"
    tags: ["复盘", "架构演进"]
    difficulty: "medium"
    source: "Interview_Bank" 
    key_points:
      - "展示出了反思与成长的能力，体现'没有完美架构只有不断演进的架构'认知"
      - "找出系统当下的债务(技术债/架构债/流程债)"
      - "规划出明确的解耦和演化(如降级机制、缓存前置、底座重构等)路径"

  - id: "BE-PQ-011"
    type: "project_deep_dive"
    question: "请结合你的实际经历，谈谈在项目中什么地方具体使用了Redis缓存？引入它解决了什么问题？"
    tags: ["项目经验", "Redis", "缓存架构"]
    difficulty: "medium"
    source: "Personal_Notes"
    key_points:
      - "能清晰描述Redis的具体业务场景（如：热点数据缓存、分布式Session共享、排行榜、延时队列等）。"
      - "阐述引入Redis前后，系统接口响应时间（RT）和数据库（QPS）压力的具体对比与性能提升。"
      - "是否考虑到并妥善处理了缓存一致性、缓存穿透、缓存击穿、缓存雪崩等进阶问题。"

  - id: "BE-PD-AL-001"
    type: "project_deep_dive"
    question: "请详细讲一下你参与的 BI 平台的业务流程是怎样的？"
    tags: ["业务理解", "系统架构", "数据链路"]
    difficulty: "hard"
    source: "阿里巴巴"
    key_points:
      - "清晰描述数据的来源、采集、清洗与入库流程"
      - "讲解后端接口如何支撑前端多维分析与图表渲染的并发需求"
      - "说明系统的整体业务闭环及你在其中负责的核心模块"

  - id: "BE-PD-AL-002"
    type: "project_deep_dive"
    question: "请介绍一下你实习期间的业务背景，你在其中承担了什么角色，以及收获最大的点是什么？"
    tags: ["实习经历", "总结复盘", "个人成长"]
    difficulty: "medium"
    source: "阿里巴巴"
    key_points:
      - "精炼概述业务所处行业及解决的用户痛点"
      - "量化个人的实际产出（如性能提升百分比、优化了几个核心接口）"
      - "沉淀出可复用的方法论或底层技术认知"
  
  - id: "BE-PD-TX-001"
    type: "project_deep_dive"
    question: "在实际项目中，数据库的分页查询通常如何优化？特别是针对深分页问题，你是怎么解决的？"
    tags: ["MySQL", "数据库优化", "深分页"]
    difficulty: "medium"
    source: "腾讯"
    key_points:
      - "理解传统 limit offset, n 导致扫描大量无用数据的性能瓶颈"
      - "掌握游标（Cursor）或记录上次最大ID（where id > last_id limit n）的优化方案"
      - "掌握子查询/延迟关联优化（先走覆盖索引查出ID，再回表查完整数据）"

  - id: "BE-PD-TX-002"
    type: "project_deep_dive"
    question: "请谈谈你对Java反射机制的理解，你在实际项目中通常在哪些场景下会使用反射？"
    tags: ["Java", "反射", "底层原理"]
    difficulty: "medium"
    source: "腾讯"
    key_points:
      - "能准确解释反射在运行期动态获取类信息、调用方法的机制"
      - "结合项目举例：如开发自定义注解、AOP动态代理、依赖注入框架（Spring IOC）或ORM框架映射"
      - "了解反射带来的性能开销及安全问题，并能提出优化建议（如缓存反射对象）"

  - id: "BE-PQ-TX-003"
    type: "project_deep_dive"
    question: "请详细描述一下你在项目开发中遇到的最大技术难点是什么？你是通过什么思路和技术方案解决这个难点的？"
    tags: ["难点攻克", "项目架构", "问题解决"]
    difficulty: "hard"
    source: "腾讯"
    key_points:
      - "难点具有足够的工程深度（如高并发、数据一致性、复杂链路排障等）"
      - "解决思路具备逻辑性：问题复现 -> 原理分析 -> 方案选型 -> 落地实施"
      - "对所采用的解决方案有优缺点评估"

  - id: "BE-PQ-TX-004"
    type: "project_deep_dive"
    question: "结合你的项目实践，谈谈在使用关系型数据库（如MySQL）进行分页查询时遇到了哪些性能瓶颈？你是如何优化深分页问题的？"
    tags: ["MySQL", "SQL优化", "深分页"]
    difficulty: "medium"
    source: "腾讯"
    key_points:
      - "理解深分页由于LIMIT offset, size中offset过大导致的扫描回表性能开销"
      - "提到使用主键索引游标过滤（WHERE id > last_id LIMIT size）"
      - "提到使用覆盖索引结合延迟关联（JOIN或子查询）优化回表"

  - id: "BE-PQ-TX-005"
    type: "project_deep_dive"
    question: "谈谈你对Java反射机制的理解。在你的实际项目中，具体在哪些业务场景或底层框架封装中使用了反射技术？"
    tags: ["Java基础", "反射", "框架原理"]
    difficulty: "medium"
    source: "腾讯"
    key_points:
      - "解释反射能够在运行时动态获取类信息、调用方法和修改属性的原理"
      - "结合项目说明应用场景（如AOP动态代理、依赖注入DI、统一接口路由、对象属性拷贝等）"
      - "认知到反射带来的性能损耗及安全问题"

  - id: "BE-PQ-TX-006"
    type: "project_deep_dive"
    question: "说说你做过的最有挑战性的项目。能否以STAR法则描述该项目的业务背景、技术挑战，以及你在其中负责的核心模块和技术方案设计？"
    tags: ["项目总结", "系统设计", "技术挑战"]
    difficulty: "hard"
    source: "腾讯"
    key_points:
      - "清晰的STAR法则叙述（情境、任务、行动、结果）"
      - "技术挑战与业务量级匹配（如高并发下防超卖、系统高可用保障）"
      - "明确说明个人的技术贡献占比，而非团队泛泛而谈"

  - id: "BE-PQ-TX-007"
    type: "project_deep_dive"
    question: "在你的项目中，遇到过哪些最大的技术难点？你是如何逐步排查并解决的？"
    tags: ["项目复盘", "问题解决", "系统优化"]
    difficulty: "hard"
    source: "腾讯"
    key_points:
      - "能够清晰描述问题的背景和触发条件（如高并发导致的OOM或死锁）"
      - "展现出科学的排查链路（如监控报警 -> 日志排查 -> 链路追踪 -> 压测复现）"
      - "提出了根本性的解决方案，并有明确的收益数据支持"
  - id: "BE-PQ-TX-008"
    type: "project_deep_dive"
    question: "请详细介绍一下你项目中是如何落地使用 SingleFlight 合并请求来解决缓存穿透问题的？"
    tags: ["缓存穿透", "高并发", "SingleFlight"]
    difficulty: "medium"
    source: "腾讯"
    key_points:
      - "解释缓存穿透/击穿的概念及常规解法（如布隆过滤器、空值缓存）"
      - "阐述SingleFlight的原理：相同key的并发请求只让第一个去DB拉取，其他阻塞等待共享结果"
      - "提及SingleFlight在极端情况下的问题（如请求超时）及配合兜底方案的应用"
  - id: "BE-PQ-TX-009"
    type: "project_deep_dive"
    question: "在你的项目中具体是如何使用 Redis 的？结合业务场景谈谈用到了哪些数据类型？"
    tags: ["Redis", "数据结构", "业务建模"]
    difficulty: "medium"
    source: "腾讯"
    key_points:
      - "String类型用于简单的K-V缓存或分布式锁"
      - "Hash类型用于存储对象数据以节省内存"
      - "Zset用于排行榜、延时队列等排序场景，或Set用于去重和交并集"
  - id: "BE-PQ-TX-010"
    type: "project_deep_dive"
    question: "你的项目中提到了使用 SSE（Server-Sent Events），请问在什么业务场景下使用的？它解决了什么痛点？"
    tags: ["SSE", "网络通信", "消息推送"]
    difficulty: "medium"
    source: "腾讯"
    key_points:
      - "说明SSE适用于服务端单向高频向客户端推送数据的场景（如AI流式对话、大屏监控）"
      - "对比WebSocket，说明SSE基于HTTP协议、实现轻量且自带断线重连机制的优势"
      - "指出SSE不支持双向通信的局限性"
  - id: "BE-PQ-TX-011"
    type: "project_deep_dive"
    question: "项目中流量聚合是在内存中处理的，如果发生服务宕机导致数据丢失怎么办？如何保证数据的最终一致性？"
    tags: ["高可用", "数据一致性", "容灾备份"]
    difficulty: "hard"
    source: "腾讯"
    key_points:
      - "内存数据丢失的风险评估及优雅停机（Graceful Shutdown）机制设计"
      - "利用持久化队列（如Kafka）做流量缓冲和重放机制"
      - "设计数据对齐和定时对账服务，发现数据不一致时进行补偿操作以满足最终一致性"

  - id: "BE-PD-HW-001"
    type: "project_deep_dive"
    question: "请详细讲讲你做过的一个涉及ETL（数据抽取、转换、加载）的项目经历。数据是如何进行分流清洗并最终落库到平台的？"
    tags: ["ETL", "数据处理", "架构设计"]
    difficulty: "hard"
    source: "华为"
    key_points:
      - "清晰阐述ETL全流程架构，包括数据源、抽取组件、清洗规则和目标库"
      - "说明在清洗和转换阶段使用了哪些设计模式（如策略模式、责任链模式）来保证代码的可维护性"
      - "能提出针对海量数据清洗的性能优化手段（如多线程、批处理、内存调优）"

  - id: "BE-PD-HW-002"
    type: "project_deep_dive"
    question: "请介绍一下你的核心项目。你在项目中使用了布隆过滤器，请讲解其原理、缺点及应用场景。此外，项目中是如何使用Bitmap或HyperLogLog等Redis高级数据结构的？"
    tags: ["Redis架构", "布隆过滤器", "复杂数据结构"]
    difficulty: "hard"
    source: "华为"
    key_points:
      - "准确解释布隆过滤器的原理（多个Hash函数+位图）及缺点（存在误判率、不支持删除元素）"
      - "说明布隆过滤器在项目中的具体应用（如解决缓存穿透问题）"
      - "讲清Bitmap（用于签到、状态统计等）或HyperLogLog（用于海量基数去重统计如UV）的具体业务落地场景"

  - id: "BE-PD-HW-003"
    type: "project_deep_dive"
    question: "在参与项目开发时，你在设计数据库表结构时主要会考虑哪些因素？"
    tags: ["数据库设计", "架构思维", "MySQL"]
    difficulty: "medium"
    source: "华为"
    key_points:
      - "考虑范式与反范式的权衡，为了查询性能是否需要适当冗余字段"
      - "考虑字段类型的选择（如尽量使用整型、避免过长的VARCHAR、时间戳存储等）与空间占用"
      - "考虑未来数据的扩展性与分库分表键（Sharding Key）的预留，以及联合索引的合理设置"

